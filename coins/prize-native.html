<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prize pool</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23fff'/%3E%3Cpath d='M8 2.6l1.4 3 3.3.3-2.5 2.2.8 3.2L8 9.6l-3 1.7.8-3.2L3.3 5.9l3.3-.3z' fill='%23b58cff'/%3E%3C/svg%3E">
<style>
html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #ffffff;
  color: #1d1d1f;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, sans-serif;
  -webkit-font-smoothing: antialiased;
}

#scene {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.hero {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  pointer-events: none;
  gap: 6px;
}

.eyebrow {
  margin: 0 0 4px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  background: linear-gradient(90deg, #38b6ff, #b57bee 45%, #ff7ac3);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.pool {
  margin: 0;
  font-size: clamp(64px, 11vw, 128px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.tagline {
  margin: 10px 0 0;
  font-size: clamp(17px, 2.2vw, 21px);
  color: #6e6e73;
}

.sub {
  margin: 2px 0 0;
  font-size: 14px;
  color: #a1a1a6;
  font-variant-numeric: tabular-nums;
}

.buy {
  position: fixed;
  bottom: 46px;
  left: 50%;
  transform: translateX(-50%);
  padding: 14px 30px;
  border: none;
  border-radius: 100px;
  background: #1d1d1f;
  color: #f5f5f7;
  font: inherit;
  font-size: 15px;
  cursor: pointer;
  transition: transform 0.12s ease, opacity 0.2s ease;
}

.buy:hover {
  opacity: 0.85;
}

.buy:active {
  transform: translateX(-50%) scale(0.97);
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div class="hero">
  <p class="eyebrow">Trading Competition</p>
  <h1 class="pool" id="pool">$0</h1>
  <p class="tagline">The prize pool grows with every ticket.</p>
  <p class="sub" id="sub"></p>
</div>
<button class="buy" id="buy" type="button">Buy a ticket&nbsp;&nbsp;$25</button>
<script type="module">
import { mountPrize } from "./prize.js";

const pool = mountPrize(document.getElementById("scene"), {
  pool: document.getElementById("pool"),
  sub: document.getElementById("sub")
});
window.pool = pool; // integration hook: pool.setSold(n)
document.getElementById("buy").addEventListener("click", () => pool.buy());
</script>
</body>
</html>
