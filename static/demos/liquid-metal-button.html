<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alex Foster</title>
<style>
  html, body { height: 100%; }

  body {
    margin: 0;
    background: #0b0b0d;
    display: grid;
    place-items: center;
    min-height: 100vh;
    padding: 1.5rem;
    box-sizing: border-box;
  }

  .card {
    width: min(92vw, 38rem);
    border: 1px solid #1c1d21;
    border-radius: 12px;
    background: #0e0e11;
    overflow: hidden;
  }

  .card-bar {
    display: flex;
    justify-content: space-between;
    padding: .6rem 1rem;
    border-bottom: 1px solid #1c1d21;
    font: .68rem "SF Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #55585f;
  }

  .card pre {
    margin: 0;
    padding: 1.25rem 1.4rem 1.5rem;
    overflow-x: auto;
    font: .85rem/1.75 "SF Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
    color: #9a9ea7;
    min-height: 19.25em;
  }

  .kw  { color: #8fa8d9; }
  .str { color: #c9b28f; }
  .cm  { color: #4c4f56; }
  .id  { color: #c9ced7; }

  .cursor {
    display: inline-block;
    width: .55em;
    height: 1.15em;
    margin-left: 1px;
    vertical-align: text-bottom;
    background: #c9ced7;
    animation: blink 1.1s steps(2, start) infinite;
  }

  @keyframes blink { to { visibility: hidden; } }

  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
  }
</style>

</head>
<body>
<main class="card">
  <div class="card-bar"><span>whoami</span><span>alex_foster.ts</span></div>
  <pre><code id="code"></code><span class="cursor" aria-hidden="true"></span></pre>
</main>

<script>
  // [class, text] tokens, typed out in order
  const TOKENS = [
    ["cm", "// whoami\n\n"],
    ["kw", "const"], ["", " "], ["id", "alex"], ["", " = {\n"],
    ["", "  name: "], ["str", "\"Alex Foster\""], ["", ",\n"],
    ["", "  role: "], ["str", "\"founder & investor\""], ["", ",\n\n"],
    ["", "  founder_of: [\n"],
    ["", "    "], ["str", "\"Vertus AI\""], ["", ",\n"],
    ["", "  ],\n\n"],
    ["", "  invested_in: [\n"],
    ["", "    "], ["cm", "// portfolio loading…\n"],
    ["", "  ],\n"],
    ["", "};\n\n"],
    ["kw", "export default"], ["", " "], ["id", "alex"], ["", ";"],
  ];

  const code = document.getElementById("code");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function renderAll() {
    for (const [cls, text] of TOKENS) {
      const span = document.createElement("span");
      if (cls) span.className = cls;
      span.textContent = text;
      code.appendChild(span);
    }
  }

  async function typeOut() {
    const wait = ms => new Promise(r => setTimeout(r, ms));
    await wait(500);
    for (const [cls, text] of TOKENS) {
      const span = document.createElement("span");
      if (cls) span.className = cls;
      code.appendChild(span);
      for (const ch of text) {
        span.textContent += ch;
        await wait(ch === "\n" ? 70 : 16 + Math.random() * 26);
      }
    }
  }

  reduced ? renderAll() : typeOut();
</script>
</body>
</html>
