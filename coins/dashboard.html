<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trade tournament</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23fff'/%3E%3Cpath d='M2 12l3-4 3 2 3-5 3 3' fill='none' stroke='%23FFC35C' stroke-width='1.6'/%3E%3C/svg%3E">
<style>
/* palette: gold #FFC35C · white #FFFFFF · ink #1d1d1f */
:root {
  --gold: #FFC35C;
  --gold-deep: #E9A437;
  --ink: #1d1d1f;
  --grey: #6e6e73;
  --faint: #a1a1a6;
  --line: rgba(24, 24, 26, 0.08);
  --up: #34a853;
  --down: #e5484d;
}

* { box-sizing: border-box; }

html,
body {
  margin: 0;
  min-height: 100%;
  background: #f5f5f7;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 1160px;
  margin: 0 auto;
  padding: 40px 28px 60px;
}

header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 26px;
}

.eyebrow {
  margin: 0 0 4px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold-deep);
}

h1 {
  margin: 0;
  font-size: clamp(26px, 3.4vw, 38px);
  font-weight: 700;
  letter-spacing: -0.02em;
}

.timer {
  display: flex;
  gap: 18px;
  align-items: baseline;
}

.seg { text-align: center; min-width: 38px; }

.seg .num {
  display: block;
  font-size: 20px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.seg .lab {
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--faint);
}

.grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 380px;
  gap: 22px;
  align-items: start;
}

@media (max-width: 900px) {
  .grid { grid-template-columns: 1fr; }
}

.card {
  background: #ffffff;
  border-radius: 18px;
  border: 1px solid var(--line);
  overflow: hidden;
}

.card h2 {
  margin: 0;
  padding: 18px 22px 14px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.02em;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.live {
  font-size: 11px;
  font-weight: 500;
  color: var(--grey);
  display: flex;
  align-items: center;
  gap: 6px;
}

.live::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--up);
  animation: blink 1.6s ease infinite;
}

@keyframes blink { 50% { opacity: 0.3; } }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

th {
  text-align: left;
  padding: 10px 22px;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--faint);
  border-bottom: 1px solid var(--line);
}

td {
  padding: 12px 22px;
  border-bottom: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}

tr:last-child td { border-bottom: none; }

.rank {
  width: 30px;
  color: var(--faint);
}

.top .rank {
  color: var(--gold-deep);
  font-weight: 600;
}

.trader { font-weight: 500; }

.pnl.up { color: var(--up); }
.pnl.down { color: var(--down); }

td.num, th.num { text-align: right; }

/* ------------------------------------------------ prize jar widget */
.jar-card {
  position: relative;
}

.jar-card.hit {
  animation: cardhit 0.5s ease-out;
}

@keyframes cardhit {
  0% { box-shadow: 0 0 0 0 rgba(255, 195, 92, 0.55); }
  100% { box-shadow: 0 0 0 26px rgba(255, 195, 92, 0); }
}

.jar-stage {
  position: relative;
  height: 410px;
}

.jar-stage canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.jar-flash {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 62%, rgba(255, 195, 92, 0.3), rgba(255, 195, 92, 0) 64%);
  opacity: 0;
}

.jar-flash.on { animation: flash 0.7s ease-out; }

@keyframes flash {
  0% { opacity: 1; }
  100% { opacity: 0; }
}

.streak {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  padding: 4px 12px;
  border-radius: 100px;
  background: var(--gold);
  color: #4a3208;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  opacity: 0;
  transition: opacity 0.25s ease;
  pointer-events: none;
}

.streak.on { opacity: 1; }

.floater {
  position: absolute;
  left: 50%;
  top: 30%;
  transform: translateX(-50%);
  font-size: 20px;
  font-weight: 600;
  color: var(--gold-deep);
  pointer-events: none;
  animation: rise 1.1s ease-out forwards;
}

@keyframes rise {
  0% { opacity: 0; transform: translate(-50%, 14px) scale(0.8); }
  18% { opacity: 1; transform: translate(-50%, 0) scale(1.06); }
  100% { opacity: 0; transform: translate(-50%, -56px) scale(1); }
}

.jar-meta {
  padding: 4px 22px 22px;
  text-align: center;
}

.pool {
  margin: 0;
  font-size: 40px;
  font-weight: 700;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}

.pool.pop { animation: pop 0.4s ease-out; }

@keyframes pop {
  0% { transform: scale(1); }
  30% { transform: scale(1.14); }
  100% { transform: scale(1); }
}

.tickets {
  margin: 4px 0 12px;
  font-size: 13px;
  color: var(--faint);
  font-variant-numeric: tabular-nums;
}

.track {
  height: 3px;
  background: rgba(24, 24, 26, 0.1);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 18px;
}

.bar {
  height: 100%;
  width: 0%;
  background: var(--gold);
  transition: width 0.6s ease;
}

.buy {
  width: 100%;
  padding: 13px 0;
  border: none;
  border-radius: 100px;
  background: var(--ink);
  color: #f5f5f7;
  font: inherit;
  font-size: 15px;
  cursor: pointer;
  transition: transform 0.12s ease, opacity 0.2s ease;
}

.buy:hover { opacity: 0.85; }
.buy:active { transform: scale(0.98); }

.sim {
  margin-top: 10px;
  width: 100%;
  padding: 9px 0;
  border: 1px solid var(--line);
  border-radius: 100px;
  background: transparent;
  color: var(--grey);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Trading Competition</p>
      <h1>Weekly Invitational</h1>
    </div>
    <div class="timer" aria-label="time until the draw">
      <div class="seg"><span class="num" id="t-d">00</span><span class="lab">days</span></div>
      <div class="seg"><span class="num" id="t-h">00</span><span class="lab">hrs</span></div>
      <div class="seg"><span class="num" id="t-m">00</span><span class="lab">min</span></div>
      <div class="seg"><span class="num" id="t-s">00</span><span class="lab">sec</span></div>
    </div>
  </header>

  <div class="grid">
    <div class="card">
      <h2>Leaderboard <span class="live">live</span></h2>
      <table>
        <thead>
          <tr><th class="rank">#</th><th>Trader</th><th class="num">PnL</th><th class="num">Volume</th></tr>
        </thead>
        <tbody id="board"></tbody>
      </table>
    </div>

    <div class="card jar-card" id="jarCard">
      <h2>Prize vault <span class="live">live</span></h2>
      <div class="jar-stage" id="jarStage">
        <canvas id="jar"></canvas>
        <div class="jar-flash" id="flash"></div>
        <div class="streak" id="streak"></div>
      </div>
      <div class="jar-meta">
        <p class="pool" id="pool">$0</p>
        <p class="tickets" id="tickets"></p>
        <div class="track"><div class="bar" id="bar"></div></div>
        <button class="buy" id="buy" type="button">Buy a ticket&nbsp;&nbsp;$25</button>
        <button class="sim" id="sim" type="button">pause live sale simulation</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { mountJar } from "./jar.js";

const TICKET_PRICE = 25;
const params = new URLSearchParams(location.search);

// ------------------------------------------------------------ jar widget
const stage = document.getElementById("jarStage");
const card = document.getElementById("jarCard");
const poolEl = document.getElementById("pool");
const ticketsEl = document.getElementById("tickets");
const flashEl = document.getElementById("flash");
const streakEl = document.getElementById("streak");
let streakHide;
let shownPool = 0;
let targetPool = 0;

function onTickets(sold, total) {
  targetPool = sold * TICKET_PRICE;
  ticketsEl.textContent = `${sold.toLocaleString("en-US")} / ${total.toLocaleString("en-US")} tickets sold`;
}

const jar = mountJar(document.getElementById("jar"), {
  bar: document.getElementById("bar"),
  onCelebrate(tier, streak) {
    poolEl.classList.remove("pop");
    void poolEl.offsetWidth;
    poolEl.classList.add("pop");
    flashEl.classList.remove("on");
    void flashEl.offsetWidth;
    flashEl.classList.add("on");
    card.classList.remove("hit");
    void card.offsetWidth;
    card.classList.add("hit");
    const f = document.createElement("div");
    f.className = "floater";
    f.textContent = "+$" + TICKET_PRICE;
    stage.appendChild(f);
    setTimeout(() => f.remove(), 1200);
    if (tier > 1) {
      streakEl.textContent = `on fire ×${streak}`;
      streakEl.classList.add("on");
      clearTimeout(streakHide);
      streakHide = setTimeout(() => streakEl.classList.remove("on"), 2600);
    }
  }
}, { sold: 61240, total: 100000 });

// keep the $ readouts in sync with the jar's state
function syncMeta() { onTickets(jar.sold, jar.total); }
syncMeta();
shownPool = targetPool;

// integration hook: window.jar.setTickets(sold, total)
window.jar = {
  setTickets: (s, t) => { jar.setTickets(s, t); syncMeta(); },
  buy: (n = 1) => { jar.buy(n); syncMeta(); },
  get sold() { return jar.sold; },
  get total() { return jar.total; }
};

document.getElementById("buy").addEventListener("click", () => window.jar.buy());

// demo: simulated live sales — replace with polling your ticketing API:
//   setInterval(async () => { const { sold, total } = await fetch("/api/tickets").then(r => r.json());
//     window.jar.setTickets(sold, total); }, 30000);
let simOn = params.get("sim") !== "0";
let simTimer;
function scheduleSim() {
  clearTimeout(simTimer);
  if (!simOn) return;
  simTimer = setTimeout(() => {
    // mostly single tickets; occasionally a whale sweeps a block and the
    // pile itself visibly rises
    const r = Math.random();
    const burst = r < 0.08 ? 250 + Math.floor(Math.random() * 400)
      : r < 0.3 ? 2 + Math.floor(Math.random() * 3) : 1;
    window.jar.buy(burst);
    scheduleSim();
  }, 900 + Math.random() * 3800);
}
scheduleSim();
const simBtn = document.getElementById("sim");
simBtn.addEventListener("click", () => {
  simOn = !simOn;
  simBtn.textContent = simOn ? "pause live sale simulation" : "resume live sale simulation";
  scheduleSim();
});

// ------------------------------------------------------------ leaderboard
const traders = [
  ["0xSable", 41.2, 2.41], ["mango.eth", 33.8, 1.92], ["Vex", 27.1, 3.05],
  ["Delta Nine", 19.4, 1.28], ["quietfire", 12.9, 0.87], ["Kestrel", 8.3, 1.53],
  ["Nocturne", 3.1, 0.66], ["ppshort", -2.4, 0.91], ["Marlin", -6.8, 0.42], ["Halcyon", -11.5, 0.58]
].map(([name, pnl, vol]) => ({ name, pnl, vol }));

const board = document.getElementById("board");
function renderBoard() {
  traders.sort((a, b) => b.pnl - a.pnl);
  board.innerHTML = traders.map((t, i) => `
    <tr class="${i < 3 ? "top" : ""}">
      <td class="rank">${i + 1}</td>
      <td class="trader">${t.name}</td>
      <td class="num pnl ${t.pnl >= 0 ? "up" : "down"}">${t.pnl >= 0 ? "+" : ""}${t.pnl.toFixed(1)}%</td>
      <td class="num">$${t.vol.toFixed(2)}M</td>
    </tr>`).join("");
}
renderBoard();
setInterval(() => {
  for (const t of traders) {
    t.pnl += (Math.random() - 0.48) * 0.9;
    t.vol += Math.random() * 0.03;
  }
  renderBoard();
}, 2400);

// ------------------------------------------------------------ countdown
const pEnds = Date.parse(params.get("ends"));
const endsAt = Number.isFinite(pEnds) ? pEnds : Date.now() + 6 * 86400000;
const two = (n) => String(n).padStart(2, "0");
function renderTimer() {
  let left = Math.max(0, endsAt - Date.now());
  const d = Math.floor(left / 86400000); left -= d * 86400000;
  const h = Math.floor(left / 3600000); left -= h * 3600000;
  const m = Math.floor(left / 60000); left -= m * 60000;
  document.getElementById("t-d").textContent = two(d);
  document.getElementById("t-h").textContent = two(h);
  document.getElementById("t-m").textContent = two(m);
  document.getElementById("t-s").textContent = two(Math.floor(left / 1000));
}
renderTimer();

// ------------------------------------------------------------ pool roll
const fmt = (n) => "$" + Math.round(n).toLocaleString("en-US");
poolEl.textContent = fmt(shownPool);
let last = performance.now();
(function tick(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  if (shownPool !== targetPool) {
    const diff = targetPool - shownPool;
    shownPool = Math.abs(diff) < 1 ? targetPool : shownPool + diff * Math.min(dt * 3, 1);
    poolEl.textContent = fmt(shownPool);
  }
  renderTimer();
  requestAnimationFrame(tick);
})(last);
</script>
</body>
</html>
