.tc-dir { font-size: 27px; font-weight: 800; letter-spacing: -0.01em; margin-top: 2px; }
.tc-dir.up, .tc-hero.up .tc-dir { color: #10b981; }
.tc-dir.down, .tc-hero.down .tc-dir { color: #e5484d; }
.tc-arow { display: flex; align-items: center; gap: 11px; margin: 16px 0 10px; }

.fdone { text-align: center; padding: 44px 20px; }

.fpicks { margin-top: 22px; }
.fpicks-h { font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: 0.12em; color: var(--text-faint); text-transform: uppercase; margin-bottom: 10px; }

.fstack { position: relative; margin-bottom: 34px; }

.ai-sig-kick {

}
.ai-brief-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 16px 0 10px; }
.ai-brief-tag {
  display: inline-flex; align-items: center; gap: 7px;
  background: linear-gradient(92deg, var(--accent-a), var(--accent-b));
  color: #fff;
  font-family: 'SF Mono', ui-monospace, Menlo, monospace;
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
  padding: 7px 14px; border-radius: 999px;
  box-shadow: 0 6px 14px rgba(124, 58, 237, 0.3);
}
.ai-brief-box {
  position: relative;
  border-radius: 15px;
  padding: 14px 17px 14px 20px;
  background: linear-gradient(135deg, rgba(124, 58, 237, 0.06), rgba(217, 70, 239, 0.03));
  border: 1px solid rgba(124, 58, 237, 0.14);
  overflow: hidden;
}
.ai-brief-box::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  background: linear-gradient(180deg, var(--accent-a), var(--accent-b));
}
.ai-brief-box .tc-brief-p { margin: 0; }
.tcard {
  position: relative;
  z-index: 2;
  background: var(--card);
  border-radius: 26px;
  box-shadow: var(--neu-out);
  padding: 26px 28px;
  touch-action: pan-y;
  will-change: transform;
}
.tcard.dragging { transition: none !important; cursor: grabbing; }
.tcard .fstamp { z-index: 3; top: 34px; }
.fstub {
  position: absolute;
  left: 12px; right: 12px; top: 14px; bottom: -12px;
  border-radius: 26px;
  background: var(--card);
  box-shadow: var(--neu-out-sm);
  z-index: 1;
}
.fstub.d2 { left: 24px; right: 24px; bottom: -22px; z-index: 0; opacity: 0.55; }

/* Spotlight glow on hover (cursor-following) */

.glow { position: relative; }

/* AI brief */

.brief {
  background: var(--surface);
  box-shadow: var(--neu-in-sm);
  border-radius: 14px;
  padding: 14px 16px;
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--text-soft);
}
.brief-h {
  font-size: 9.5px;
  color: var(--accent-a);
  margin-bottom: 7px;
  display: flex;
  align-items: center;
  gap: 7px;
}
.brief p { margin-bottom: 10px; }
.brief-lv { display: flex; gap: 9px; }
.brief-lv .term-cell { background: var(--card); box-shadow: none; border: 1px solid var(--line); padding: 8px 11px; }
.brief-toggle { margin-top: 0; padding: 4px 0; font-size: 12.5px; color: var(--accent-a); }

/* Morphing card stack */

.stack-wrap { position: relative; max-width: 600px; margin: 18px auto 8px; height: 400px; }
.scard {
  position: absolute;
  inset: 0;
  background: var(--card);
  border-radius: 24px;
  box-shadow: var(--neu-out);
  padding: 26px 28px;
  display: flex;
  flex-direction: column;
  gap: 13px;
  transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease;
  will-change: transform;
}
.scard.d0 { z-index: 4; cursor: pointer; }
.scard.d1 { transform: translateY(18px) scale(0.955); opacity: 0.75; z-index: 3; }
.scard.d2 { transform: translateY(36px) scale(0.91); opacity: 0.45; z-index: 2; }
.scard.d3 { transform: translateY(52px) scale(0.87); opacity: 0.2; z-index: 1; }
.scard.out { transform: translateX(125%) rotate(9deg) !important; opacity: 0 !important; }
.scard-head { display: flex; align-items: center; gap: 12px; }
.scard-title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.35; }
.scard-desc {
  font-size: 13.5px; line-height: 1.6; color: var(--text-soft);
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
}
.scard .idea-cat { margin-right: auto; }
.scard-foot { margin-top: auto; display: flex; gap: 10px; align-items: center; }
.stack-hint { text-align: center; font-size: 11px; color: var(--text-faint); margin-top: 68px; }

/* Tinder flick deck */

.flick-wrap { position: relative; max-width: 460px; margin: 18px auto 0; height: 520px; touch-action: none; }
.fcard {
  position: absolute;
  inset: 0;
  background: var(--card);
  border-radius: 26px;
  box-shadow: var(--neu-out);
  padding: 26px 28px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  user-select: none;
  transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
  will-change: transform;
}
.fcard.top { cursor: grab; z-index: 2; }
.fcard.top:active { cursor: grabbing; }
.fcard.under { transform: translateY(16px) scale(0.95); opacity: 0.6; z-index: 1; }
.fcard.dragging { transition: none; }
.fstamp {
  position: absolute;
  top: 26px;
  padding: 9px 18px;
  border: 3px solid;
  border-radius: 13px;
  font-weight: 800;
  font-size: 21px;
  letter-spacing: 0.12em;
  opacity: 0;
  pointer-events: none;
}
.fstamp.exec { left: 22px; color: #10b981; border-color: #10b981; transform: rotate(-12deg); }
.fstamp.skip { right: 22px; color: #e5484d; border-color: #e5484d; transform: rotate(12deg); }
.fcard-big { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.35; }
.flick-actions { display: flex; justify-content: center; gap: 26px; margin-top: 18px; }
.fbtn {
  width: 62px; height: 62px; border: none; border-radius: 50%;
  background: var(--surface-raised);
  box-shadow: var(--neu-out-sm);
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700;
  transition: all 0.22s ease;
}
.fbtn:active { box-shadow: var(--neu-in-sm); }
.fbtn.skip { color: #e5484d; }
.fbtn.exec { color: #10b981; }
.fbtn:hover { transform: translateY(-2px); }
.flick-hint { text-align: center; font-size: 11px; color: var(--text-faint); margin-top: 14px; }

/* Neumorphic counter (soft-UI stepper) */

.neu-counter {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px;
  border-radius: 17px;
  background: var(--surface);
  box-shadow: var(--neu-in-sm);
}
.cnt-btn {
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 13px;
  background: var(--surface-raised);
  box-shadow: var(--neu-out-sm);
  color: var(--text-soft);
  font-size: 19px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  line-height: 1;
  padding-bottom: 2px;
}
.cnt-btn:hover { color: var(--accent-a); }
.cnt-btn:active { box-shadow: var(--neu-in-sm); }
.cnt-wrap { display: flex; flex-direction: column; align-items: center; min-width: 62px; padding: 0 4px; }
.cnt-label { font-size: 8.5px; color: var(--text-faint); }
.cnt-val {
  font-size: 19px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
  line-height: 1.15;
}
.cnt-val.pop { animation: cntpop 0.25s ease; }
@keyframes cntpop {
  0% { transform: translateY(7px) scale(0.85); opacity: 0; }
  100% { transform: none; opacity: 1; }
}

/* Responsive for new pages */

@media (max-width: 1180px) {
  .term-grid, .two-col { grid-template-columns: 1fr; }
  .idea-grid, .challenge-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .contact-grid, .prod-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split { grid-template-columns: 1fr; }
  .tile-row, .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 640px) {
  .idea-grid, .challenge-grid, .contact-grid, .prod-grid, .tile-row, .stats-grid { grid-template-columns: 1fr; }
}

/* ---------------- Odometer — every live number rolls like a slot machine ---------------- */
.odo { display: inline-flex; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.odo .odc { height: 1.12em; display: flex; align-items: center; }
.odo .odd { position: relative; width: 1ch; height: 1.12em; overflow: hidden; }
.odo .odd i { position: absolute; left: 0; top: 0; width: 100%; display: block; font-style: normal; transition: transform .9s cubic-bezier(.16, 1, .3, 1); will-change: transform; }
.odo .odd b { height: 1.12em; display: flex; align-items: center; justify-content: center; font-weight: inherit; }

/* ---------------- Nation Wars ---------------- */
.nw-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 18px; }
.nw-card { background: var(--card); border-radius: 24px; box-shadow: var(--neu-out); padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }

.nw-pot { margin-left: auto; color: var(--text); font-weight: 800; letter-spacing: 0; font-size: 13px; }
.nw-face { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.nw-side { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.nw-side.right { align-items: flex-end; text-align: right; }
.nw-country { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 14.5px; color: var(--text); }
.nw-squad { font-size: 11px; color: var(--text-faint); }
.nw-ret { font-size: 21px; font-weight: 800; letter-spacing: -.4px; }
.nw-vs { font-size: 11px; font-weight: 800; letter-spacing: .14em; color: var(--text-faint); background: var(--surface); box-shadow: var(--neu-in-sm); border-radius: 999px; padding: 7px 11px; }
.nw-bar { height: 9px; border-radius: 999px; background: var(--surface); box-shadow: var(--neu-in-sm); overflow: hidden; display: flex; }
.nw-bar > span { height: 100%; background: linear-gradient(90deg, #34d399, #10b981); border-radius: 999px 0 0 999px; transition: width 1.1s cubic-bezier(.16, 1, .3, 1); }
.nw-bar > i { flex: 1; height: 100%; background: linear-gradient(90deg, var(--accent-a), var(--accent-b)); border-radius: 0 999px 999px 0; }
.nw-foot { display: flex; align-items: center; gap: 10px; }
.nw-foot .btn-neu { padding: 10px 16px; font-size: 12.5px; }
.nw-watch { margin-left: auto; font-size: 11px; color: var(--text-faint); }
.flagc { position: relative; width: 30px; height: 30px; border-radius: 50%; overflow: hidden; flex: none; box-shadow: var(--neu-out-sm); background: var(--surface); }
.flagc .flag-fb { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 800; letter-spacing: .04em; color: var(--text-soft); }
.flagc img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.flagc.sm { width: 22px; height: 22px; }

/* ---------------- Country winnings accordion ---------------- */
.nat-acc { background: var(--card); border-radius: 24px; box-shadow: var(--neu-out); overflow: hidden; }
.nrow { padding: 20px 24px; display: flex; gap: 26px; align-items: flex-start; }
.nrow + .nrow { border-top: 1px solid var(--surface); }
.nrow-label { width: 108px; flex: none; font-size: 10.5px; font-weight: 700; letter-spacing: .15em; color: var(--text-faint); padding-top: 8px; }
.nrow-body { flex: 1; min-width: 0; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(172px, 1fr)); gap: 9px; }
.cgrid.nrow-more { overflow: hidden; max-height: 0; opacity: 0; margin-top: 0; transition: max-height .45s cubic-bezier(.4, 0, .2, 1), opacity .3s ease, margin-top .3s ease; }
.cgrid.nrow-more.open { max-height: 420px; opacity: 1; margin-top: 9px; }
.cpill { display: flex; align-items: center; gap: 9px; padding: 8px 11px; border-radius: 14px; background: var(--surface); box-shadow: var(--neu-in-sm); min-width: 0; }
.cpill-tx { min-width: 0; flex: 1; }
.cpill-name { font-size: 11.5px; font-weight: 600; color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cpill-won { font-size: 12px; font-weight: 800; color: var(--text); margin-top: 1px; }
.cheat { height: 3.5px; border-radius: 2px; background: var(--card); margin-top: 4px; overflow: hidden; }
.cheat > span { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--accent-a), var(--accent-b)); }
.nrow-toggle { flex: none; padding-top: 8px; display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--text-faint); background: none; border: 0; cursor: pointer; font-family: inherit; }
.nrow-toggle:hover { color: var(--text); }
.nrow-toggle b { font-size: 15px; font-weight: 600; line-height: 1; transition: transform .25s ease; display: inline-block; }
.nrow-toggle.open b { transform: rotate(45deg); }

@media (max-width: 760px) {
  .nrow { flex-direction: column; gap: 10px; }
  .nrow-label { width: auto; padding-top: 0; }
}

/* ---------------- Tournaments inside the Arena ---------------- */

  display: inline-flex; align-items: center; gap: 8px;

  background: linear-gradient(135deg, var(--accent-a), var(--accent-b));

.tc2-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }

.fame-win > span { display: block; font-size: 11px; font-weight: 700; color: var(--green); margin-top: 2px; }

/* ---------------- Ideas grid — market cards ---------------- */
.icg-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.asset-ic.lg { width: 38px; height: 38px; border-radius: 13px; font-size: 16px; }
.icg-nm { min-width: 0; }

function formatCountdown(total) {

  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  const pad = n => String(n).padStart(2, '0');
  return d > 0 ? `${d}d ${pad(h)}h ${pad(m)}m ${pad(s)}s` : `${h}h ${pad(m)}m ${pad(s)}s`;
}

/* ---------------- Odometer — digits roll vertically like a slot machine.
   Any element can become an odometer: setOdo() rebuilds when the shape of the
   string changes (sign flip, extra digit) and rolls the strips otherwise. */

const ODIGITS = '0123456789'.split('').map(d => `<b>${d}</b>`).join('');

function odoInner(str) {
  return [...str].map(ch => /\d/.test(ch)
    ? `<span class="odd"><i style="transform:translateY(-${(+ch * 1.12).toFixed(2)}em)">${ODIGITS}</i></span>`
    : `<span class="odc">${ch}</span>`).join('');
}

function odoHTML(id, str, cls = '') {
  return `<span class="odo${cls ? ' ' + cls : ''}" id="${id}" data-odo="${str}">${odoInner(str)}</span>`;
}

function setOdo(target, str) {
  const el = typeof target === 'string' ? document.getElementById(target) : target;
  if (!el || el.dataset.odo === str) return;
  const shape = s => [...(s || '')].map(c => /\d/.test(c) ? '#' : c).join('');
  if (shape(el.dataset.odo) !== shape(str)) {
    el.classList.add('odo');
    el.innerHTML = odoInner(str);
  } else {
    const strips = el.querySelectorAll('.odd i');
    let j = 0;
    [...str].forEach(ch => { if (/\d/.test(ch)) strips[j++].style.transform = `translateY(-${(+ch * 1.12).toFixed(2)}em)`; });
  }
  el.dataset.odo = str;
}

/* roll in from a zeroed string on first paint */
function odoIntro(id, from, to) {
  const el = document.getElementById(id);
  if (!el) return;
  setOdo(el, from);
  requestAnimationFrame(() => requestAnimationFrame(() => setOdo(el, to)));
}

const fmtRet = v => (v >= 0 ? '+' : '') + v.toFixed(2) + '%';

function tickLiveNumbers() {
  if (!feedLive) return;
  /* the house always grows — every platform counter only climbs */
  prizePool += 120 + Math.floor(Math.random() * 900);
  activePlayers += Math.floor(Math.random() * 6);
  liveCapital += 500000 + Math.floor(Math.random() * 4e6);
  setOdo('stat-pool', '£' + (prizePool / 1e6).toFixed(2) + 'M');
  setOdo('stat-players', activePlayers.toLocaleString('en-GB'));
  setOdo('stat-capital', '£' + (liveCapital / 1e9).toFixed(2) + 'B');
  const row = leaderboard[Math.floor(Math.random() * leaderboard.length)];
  row.value = Math.max(0, row.value + (Math.random() - 0.42) * 1400);
  leaderboard.sort((a, b) => b.value - a.value);
  renderLeaderboard(row.name);
  setTimeout(() => renderLeaderboard(), 700);
  /* live arena battles drift + settlement */
  if (typeof myBattles !== 'undefined' && myBattles.length) {
    const settled = [];
    myBattles.forEach(b => {
      b.age = (b.age || 0) + 1;
      if (b.age >= 12) settled.push(b);
    });
    settled.forEach(b => {
      myBattles.splice(myBattles.indexOf(b), 1);
      if (b.my > b.op) {
        showReward(b.pot, b.opp);
      } else {
        toast(`Battle settled — ${b.opp} edged it ${b.op.toFixed(2)}% to ${b.my.toFixed(2)}%`);
        addNotif('💀', `Battle lost to ${b.opp}`, `They took the £${b.pot.toLocaleString('en-GB')} pot by ${(b.op - b.my).toFixed(2)}%. Run it back?`);
      }
      if (currentView === 'arena') renderArena();
    });
    myBattles.forEach((b, i) => {
      b.my += (Math.random() - 0.48) * 0.35;
      b.op += (Math.random() - 0.5) * 0.35;
      if (currentView !== 'arena') return;
      const my = document.querySelector(`[data-bmy="${i}"]`);
      const op = document.querySelector(`[data-bop="${i}"]`);
      const ld = document.querySelector(`[data-blead="${i}"]`);
      if (my) { setOdo(my, fmtRet(b.my)); my.className = 'fd-bt-ret odo ' + (b.my >= 0 ? 'up' : 'down'); }
      if (op) { setOdo(op, fmtRet(b.op)); op.className = 'fd-bt-ret odo ' + (b.op >= 0 ? 'up' : 'down'); }
      if (ld) ld.style.width = Math.max(8, Math.min(92, 50 + (b.my - b.op) * 9)).toFixed(0) + '%';
    });

function drawSeries(canvas, series, opts = {}) {
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  const min = Math.min(...series), max = Math.max(...series), rng = (max - min) || 1;
  const pad = 12;
  const X = i => pad + (i / (series.length - 1)) * (w - pad * 2);
  const Y = v => pad + (1 - (v - min) / rng) * (h - pad * 2);
  const up = series[series.length - 1] >= series[0];
  const col = opts.color || (up ? '#16a34a' : '#e5484d');
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, col + '33');
  grad.addColorStop(1, col + '00');
  ctx.beginPath();
  series.forEach((v, i) => i ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v)));
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.lineTo(X(series.length - 1), h); ctx.lineTo(X(0), h); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(pad, Y(series[series.length - 1]));
  ctx.lineTo(w - pad, Y(series[series.length - 1]));
  ctx.strokeStyle = cssVar('--text-faint'); ctx.lineWidth = 1; ctx.stroke();
  ctx.setLineDash([]);
}

function updatePos() {
  const pos = term.pos;
  const a = INSTR[pos.sym];
  const stop = TMODES[pos.mode].stop;
  const move = (a.px - pos.entry) / pos.entry * (pos.dir === 'up' ? 1 : -1);
  let pnl = pos.risk * (move / stop);
  const floor = pos.be ? 0 : -pos.risk;
  if (pnl <= floor) return closePos(floor, pos.be ? 'breakeven' : 'stopped');
  if (pnl >= pos.risk * pos.rr) return closePos(pos.risk * pos.rr, 'target');
  const el = document.getElementById('posPnl');
  if (el) {
    el.textContent = (pnl >= 0 ? '+' : '−') + gbp(pnl);
    el.className = 'pos-pnl ' + (pnl >= 0 ? 'up' : 'down');
  }
}

function closePos(pnl, outcome = 'manual') {
  const pos = term.pos;
  if (!pos) return;
  if (Math.abs(pnl) < 1) { pnl = 0; outcome = 'breakeven'; }
  term.bal += pnl;
  tradeLog.unshift({
    sym: pos.sym, dir: pos.dir, entry: pos.entry, exit: INSTR[pos.sym].px,
    riskAmt: pos.risk, riskPct: pos.riskPct || term.risk, rr: pos.rr, pnl,
    outcome, src: pos.src || 'terminal',
    openedAt: pos.openedAt || Date.now(), closedAt: Date.now()
  });
  term.pos = null;
  const msg = {
    target: `◆ Target hit — +${gbp(pnl)} banked`,
    stopped: `✕ Stopped out — −${gbp(pnl)}`,
    breakeven: '◎ Flat — closed at breakeven',
    manual: pnl >= 0 ? `✂ Closed early — +${gbp(pnl)}` : `✂ Closed early — −${gbp(pnl)}`
  }[outcome];
  toast(msg);
  addNotif(pnl > 0 ? '🏆' : pnl < 0 ? '📉' : '➖', `${pos.sym} ${pos.dir === 'up' ? 'long' : 'short'} closed`, msg);
  renderTerminal();
}

function seedIdeas() {
  if (ideaFeed.length) return;
  IDEA_HEADLINES.forEach(([sym, head, cat, dir, brief, bull, hist], i) => {
    ideaFeed.push({
      uid: ideaUid++, sym, head, cat, dir, brief, bull, hist,
      hz: HZS[i % 3][0],
      age: 2 + Math.floor(Math.random() * 110),
      conf: 55 + Math.floor(Math.random() * 40),
      conv: 2 + Math.floor(Math.random() * 4),
      acted: 120 + Math.floor(Math.random() * 900)
    });
  });
}

function ideaLevels(c) {
  const a = INSTR[c.sym], cfg = HZCFG[c.hz];
  const up = c.dir === 'up';
  const f = n => n.toLocaleString('en-GB', { minimumFractionDigits: a.dp, maximumFractionDigits: a.dp });
  const sl = up ? a.px * (1 - cfg.sl / 100) : a.px * (1 + cfg.sl / 100);
  const tp = up ? a.px * (1 + cfg.sl * cfg.rr / 100) : a.px * (1 - cfg.sl * cfg.rr / 100);
  return { entry: f(a.px), sl: f(sl), tp: f(tp), slPct: cfg.sl.toFixed(1), tpPct: (cfg.sl * cfg.rr).toFixed(1), rr: cfg.rr, up };
}

function ideaCrowd(c) {
  let pc = Math.round(c.dir === 'up' ? 50 + c.conv * 5 : 50 - c.conv * 5);
  return Math.max(22, Math.min(78, pc));
}

function flickSpark(c) {
  const up = c.dir === 'up';
  const col = up ? '#10b981' : '#e5484d';
  const W = 300, H = 84, pad = 6, N = 40, ys = [];
  let s = (c.uid + 7) * 2654435761 % 2147483647, v = H * 0.5;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let i = 0; i < N; i++) {
    v += (rnd() - (up ? 0.42 : 0.58)) * 8;
    v = Math.max(pad, Math.min(H - pad, v));
    ys.push(v);
  }
  const X = i => (pad + (W - 2 * pad) * i / (N - 1)).toFixed(1);
  let line = `M${X(0)},${ys[0].toFixed(1)}`;
  for (let j = 1; j < N; j++) line += ` L${X(j)},${ys[j].toFixed(1)}`;
  const area = `${line} L${X(N - 1)},${H} L${X(0)},${H} Z`;
  const gid = 'spk' + c.uid;
  return `<svg class="tc-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#${gid})"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/></svg>`;
}

function briefBox(c) {

}

/* Interactive sparkline — crosshair + price tooltip on hover, like a pro market card */
function bindIdeaCharts() {
  document.querySelectorAll('[data-icgchart]').forEach(wrap => {
    const sym = wrap.dataset.icgchart, p = INSTR[sym];
    const svg = wrap.querySelector('svg'), tip = wrap.querySelector('.icg-tip');
    const W = wrap.clientWidth || 300, H = wrap.clientHeight || 96, pad = 8;
    const data = p.series.slice(-60);
    const min = Math.min(...data), max = Math.max(...data), rng = (max - min) || 1;
    const X = i => pad + i / (data.length - 1) * (W - pad * 2);
    const Y = v => H - pad - (v - min) / rng * (H - pad * 2);
    const up = data[data.length - 1] >= data[0];
    const col = up ? '#10b981' : '#e5484d';
    const line = data.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = `<defs><linearGradient id="icg-g-${sym}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${col}" stop-opacity=".25"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <path d="${line} L${X(data.length - 1).toFixed(1)},${H} L${X(0).toFixed(1)},${H} Z" fill="url(#icg-g-${sym})"/>
      <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <line class="icg-vline" x1="0" y1="${pad}" x2="0" y2="${H - pad}" stroke="${col}" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
      <circle class="icg-dot" r="3.5" fill="${col}" stroke="var(--card)" stroke-width="2" opacity="0"/>`;
    const vline = svg.querySelector('.icg-vline'), dot = svg.querySelector('.icg-dot');
    wrap.addEventListener('pointermove', e => {
      const r = wrap.getBoundingClientRect();
      const i = Math.max(0, Math.min(data.length - 1, Math.round((e.clientX - r.left - pad) / (r.width - pad * 2) * (data.length - 1))));
      const x = X(i), y = Y(data[i]);
      vline.setAttribute('x1', x); vline.setAttribute('x2', x); vline.setAttribute('opacity', '.7');
      dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.setAttribute('opacity', '1');
      tip.textContent = data[i].toLocaleString('en-GB', { maximumFractionDigits: p.dp });
      tip.classList.add('on');
      tip.style.left = Math.min(Math.max(6, x / W * r.width - tip.offsetWidth / 2), r.width - tip.offsetWidth - 6) + 'px';
    });
    wrap.addEventListener('pointerleave', () => {
      vline.setAttribute('opacity', '0'); dot.setAttribute('opacity', '0'); tip.classList.remove('on');
    });
  });
}

function executeIdea(c) {
  const modeMap = { scalp: 'scalp', intraday: 'day', swing: 'swing' };
  term.asset = c.sym;
  term.pos = { sym: c.sym, dir: c.dir, entry: INSTR[c.sym].px, risk: term.bal * flick.risk / 100, riskPct: flick.risk, rr: HZCFG[c.hz].rr, mode: modeMap[c.hz] || 'day', be: false, src: 'flick', openedAt: Date.now() };
  toast(`${c.dir === 'up' ? 'Bought' : 'Sold'} ${c.sym} @ ${fmtPx(c.sym)} — ${flick.risk}% risk, 1:${HZCFG[c.hz].rr}`);
  addNotif('⚡', `Flick signal taken — ${c.sym}`, `${c.dir === 'up' ? 'Long' : 'Short'} @ ${fmtPx(c.sym)}, ${flick.risk}% risk, 1:${HZCFG[c.hz].rr} target`);
}

function flickResolve(take) {
  const card = document.getElementById('flickTop');
  const c = flick.deck[flick.pos];
  if (!card || !c) return;
  if (take) {
    executeIdea(c);
    flick.taken.push({ sym: c.sym, dir: c.dir });
    const st = card.querySelector('.fstamp.exec');
    if (st) st.style.opacity = '1';
  } else {
    flick.passed++;
    const st = card.querySelector('.fstamp.skip');
    if (st) st.style.opacity = '1';
  }
  card.style.transition = 'transform 0.34s ease, opacity 0.34s ease';
  card.style.transform = take ? 'translate(560px, 20px) rotate(16deg)' : 'translate(-560px, 20px) rotate(-16deg)';
  card.style.opacity = '0';
  setTimeout(() => { flick.pos++; flick.sec = 60; renderIdeas(); }, 300);
}

function bindFlick() {
  const card = document.getElementById('flickTop');
  if (!card) return;
  let sx = 0, dx = 0, dragging = false;
  card.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    dragging = true; sx = e.clientX; dx = 0;
    card.classList.add('dragging');
    card.setPointerCapture(e.pointerId);
  });
  card.addEventListener('pointermove', e => {
    if (!dragging) return;
    dx = e.clientX - sx;
    card.style.transform = `translateX(${dx}px) rotate(${(dx / 20).toFixed(1)}deg)`;
    const ex = card.querySelector('.fstamp.exec'), sk = card.querySelector('.fstamp.skip');
    if (ex) ex.style.opacity = dx > 0 ? Math.min(1, dx / 110) : 0;
    if (sk) sk.style.opacity = dx < 0 ? Math.min(1, -dx / 110) : 0;
  });
  card.addEventListener('pointerup', () => {
    if (!dragging) return;
    dragging = false;
    card.classList.remove('dragging');
    if (dx > 110) flickResolve(true);
    else if (dx < -110) flickResolve(false);
    else {
      card.style.transform = '';
      const ex = card.querySelector('.fstamp.exec'), sk = card.querySelector('.fstamp.skip');
      if (ex) ex.style.opacity = 0;
      if (sk) sk.style.opacity = 0;
    }
    dx = 0;
  });
}

function mediaChartSVG(win, seed) {
  const col = win ? '#22c55e' : '#e5484d';
  const W = 480, H = 240, pad = 20, N = 30, ys = [];
  let v = H * 0.55, s = seed || 1;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let i = 0; i < N; i++) {
    v += (rnd() - (win ? 0.56 : 0.44)) * 15;
    v = Math.max(pad, Math.min(H - pad, v));
    ys.push(v);
  }
  const X = i => (pad + (W - 2 * pad) * i / (N - 1)).toFixed(1);
  let line = `M${X(0)},${ys[0].toFixed(1)}`;
  for (let j = 1; j < N; j++) line += ` L${X(j)},${ys[j].toFixed(1)}`;
  const area = `${line} L${X(N - 1)},${H} L${X(0)},${H} Z`;
  const gid = 'fm' + seed;
  let grid = '';
  for (let g = 1; g < 3; g++) grid += `<line x1="${pad}" y1="${(H * g / 3).toFixed(0)}" x2="${W - pad}" y2="${(H * g / 3).toFixed(0)}" stroke="rgba(255,255,255,.06)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".28"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#${gid})"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function metricCardHTML(id, title, chip, extraHead) {
  return `<div class="pmc2" id="${id}">
    <div class="pmc2-region">
      <div class="pmc2-wash" data-role="wash"></div>
      <div class="pmc2-dots"><svg aria-hidden="true"><defs><pattern id="${id}-dg" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#${id}-dg)"/></svg></div>
      <div class="pmc2-chart" data-role="chart"><svg data-role="svg"></svg></div>
    </div>
    <div class="pmc2-main">
      <div class="pmc2-head"><span class="pmc2-title">${title}</span><span class="pmc2-chip mono">${chip}</span>${extraHead ? `<span style="margin-left:auto;display:flex;gap:6px;pointer-events:auto">${extraHead}</span>` : ''}</div>
      <div class="pmc2-headline"><span data-role="val">—</span><span class="pmc2-trendchip" data-role="trend"></span></div>
      <div class="pmc2-date mono" data-role="date"></div>
    </div>
    <div class="pmc2-foot">
      <div><b data-role="delta"></b> <span style="color:var(--text-faint)" data-role="dlabel">today</span></div>
      <div class="pmc2-stats" data-role="stats"></div>
    </div>
  </div>`;
}

function buildMetric(id, series, opts = {}) {
  const root = document.getElementById(id);
  if (!root || !series || series.length < 2) return;
  const fmt = opts.fmt || (n => '£' + Math.round(n).toLocaleString('en-GB'));
  const n = series.length;
  const first = series[0], last = series[n - 1], prev = series[n - 2];
  const pct = first ? (last - first) / first * 100 : 0;
  const trend = Math.abs(pct) < 0.5 ? 'flat' : last >= first ? 'up' : 'down';
  const stroke = trend === 'down' ? '#e5484d' : trend === 'flat' ? '#8b93a3' : '#10b981';
  root.querySelector('[data-role="wash"]').style.background =
    `linear-gradient(to left, ${stroke}1f, transparent 75%)`;
  const chart = root.querySelector('[data-role="chart"]');
  const svg = root.querySelector('[data-role="svg"]');
  const W = Math.max(260, chart.clientWidth || 600), H = Math.max(180, chart.clientHeight || 300), pad = 12;
  const min = Math.min(...series), max = Math.max(...series), rng = (max - min) || 1;
  const X = i => pad + (i / (n - 1)) * (W - pad * 2);
  const Y = v => 34 + (1 - (v - min) / rng) * (H - 34 - pad);
  let line = `M${X(0)},${Y(first).toFixed(1)}`;
  for (let i = 1; i < n; i++) line += ` L${X(i).toFixed(1)},${Y(series[i]).toFixed(1)}`;
  const area = `${line} L${X(n - 1).toFixed(1)},${H} L${X(0)},${H} Z`;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.innerHTML = `
    <defs><linearGradient id="${id}-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${stroke}" stop-opacity=".18"/><stop offset="1" stop-color="${stroke}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${id}-g)"/>
    <path d="${line}" fill="none" stroke="${stroke}" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <line data-role="vline" y1="8" y2="${H}" stroke="${cssVar('--text-faint')}" stroke-width="1" stroke-dasharray="3,4" opacity="0"/>
    <circle data-role="dot" r="5" fill="${stroke}" stroke="#fff" stroke-width="2.5" opacity="0"/>`;
  const el = r => root.querySelector(`[data-role="${r}"]`);
  const dot = svg.querySelector('[data-role="dot"]'), vline = svg.querySelector('[data-role="vline"]');
  const arrow = trend === 'down' ? '↓' : trend === 'flat' ? '→' : '↑';
  const trendEl = el('trend');
  trendEl.textContent = `${arrow} ${Math.abs(pct).toFixed(1)}%`;
  trendEl.style.color = stroke;
  const deltaEl = el('delta');
  deltaEl.textContent = (last - prev >= 0 ? '+' : '−') + fmt(Math.abs(last - prev)).replace('£', '£');
  deltaEl.style.color = stroke;
  el('stats').innerHTML =
    `<span><b>${fmt(max)}</b> peak</span><span class="sep">·</span>` +
    `<span><b>${fmt(min)}</b> low</span><span class="sep">·</span>` +
    `<span><b>${fmt(series.reduce((a, b) => a + b, 0) / n)}</b> avg</span>`;
  const dateFor = i => new Date(Date.now() - (n - 1 - i) * 86400000)
    .toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  const setIdx = (i, scrub) => {
    i = Math.max(0, Math.min(n - 1, i));
    el('val').textContent = fmt(series[i]);
    el('date').textContent = dateFor(i) + (scrub ? '' : ' · latest');
    dot.setAttribute('cx', X(i)); dot.setAttribute('cy', Y(series[i]));
    vline.setAttribute('x1', X(i)); vline.setAttribute('x2', X(i));
    dot.setAttribute('opacity', 1); vline.setAttribute('opacity', scrub ? 1 : 0);
  };
  chart.onpointermove = e => {
    const r = chart.getBoundingClientRect();
    setIdx(Math.round((e.clientX - r.left) / r.width * (n - 1)), true);
  };
  chart.onpointerleave = () => setIdx(n - 1, false);
  setIdx(n - 1, false);
}

  };
}

function hashName(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function traderProfile(name) {
  let s = hashName(name) || 1;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  const winRate = Math.round(52 + rnd() * 24);
  const wins = 9 + Math.floor(rnd() * 42), losses = 3 + Math.floor(rnd() * 23);
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  /* Hall of Fame champions banked seven figures — their profiles must agree */
  const CHAMPIONS = { Theo4: 1382400, Fredi9999: 1291150, swisstony: 1265800, Rudy: 1147695 };
  const winnings = CHAMPIONS[name] || Math.round(3000 + rnd() * rnd() * 900000);
  /* Cumulative prize curve — flat spells and jump wins, ending exactly at banked winnings */
  const raw = [0];
  for (let i = 1; i < 160; i++) raw.push(raw[i - 1] + Math.max(0, rnd() - 0.3) * (0.5 + rnd()));
  const endv = raw[159] || 1;
  const series = raw.map(v => Math.round(winnings * (0.05 + 0.95 * v / endv)));
  const formBars = Array.from({ length: 24 }, () => 0.1 + rnd() * 0.9);
  return {
    name, av: TRADER_AV[name] || name.charAt(0).toUpperCase(),
    tint: AV_TINTS[hashName(name) % AV_TINTS.length],
    bio: TRADER_BIOS[hashName(name + 'b') % TRADER_BIOS.length],
    winRate, wins, losses,
    followers: kfmt(1200 + Math.floor(rnd() * 80000)),
    following: 40 + Math.floor(rnd() * 900),
    big: Math.round(4000 + rnd() * rnd() * 900000),
    trades: 40 + Math.floor(rnd() * 4200),
    joined: months[hashName(name + 'm') % 12] + ' ' + (2023 + hashName(name + 'y') % 3),
    rank: 1 + hashName(name + 'r') % 200,
    views: (1 + rnd() * 60).toFixed(1) + 'K',
    tourShare: 0.55 + rnd() * 0.2,
    podiums: 2 + Math.floor(rnd() * 12),
    mediaRets: Array.from({ length: 6 }, () => (2 + rnd() * 40).toFixed(1)),
    winnings,
    winningsChange: Math.round(winnings * (0.04 + rnd() * 0.18)),
    tours: 4 + Math.floor(rnd() * 60), toursMonth: 1 + Math.floor(rnd() * 6),
    battlesMonth: 1 + Math.floor(rnd() * 5),
    formBars,
    hours: 40 + Math.floor(rnd() * 140),
    series,
    acts: Array.from({ length: 10 }, () => {
      const MK = ['BTC', 'ETH', 'NAS100', 'XAUUSD', 'EURUSD', 'GBPJPY'];
      const battle = rnd() < 0.25;
      const win = rnd() < winRate / 100;
      return {
        battle, win,
        dir: rnd() < 0.55 ? 'Long' : 'Short',
        market: battle ? 'vs ' + ['pip_titan', 'vol_king', 'nattyG', 'wickwizard', 'quantqueen'][Math.floor(rnd() * 5)] : MK[Math.floor(rnd() * 6)],
        amount: Math.round(Math.pow(10, 1.6 + rnd() * 3.2)),
        ago: 1 + Math.floor(rnd() * 420)
      };
    }),
    positions: Array.from({ length: Math.floor(rnd() * 3.4) }, () => {
      const MK = ['BTC', 'ETH', 'NAS100', 'XAUUSD', 'EURUSD', 'GBPJPY'];
      return {
        market: MK[Math.floor(rnd() * 6)],
        dir: rnd() < 0.55 ? 'Long' : 'Short',
        size: Math.round(500 + rnd() * 20000),
        pnl: Math.round((rnd() - 0.42) * 6000)
      };
    })
  };
}

function bindAwardTilt() {
  const el = document.getElementById('awardBadge');
  if (!el) return;
  const tilt = el.querySelector('.award-tilt');
  el.addEventListener('pointermove', e => {
    const r = el.getBoundingClientRect();
    const rx = ((e.clientY - r.top) / r.height - 0.5) * -16;
    const ry = ((e.clientX - r.left) / r.width - 0.5) * 18;
    tilt.style.transform = `perspective(700px) rotateX(${rx.toFixed(1)}deg) rotateY(${ry.toFixed(1)}deg) scale(0.985)`;
  });
  el.addEventListener('pointerleave', () => { tilt.style.transform = 'perspective(700px)'; });
}

function oddsMult() {
  if (arenaB.oddsMode === 'preset') return B_ODDS[arenaB.odds] || 1;
  const t = (arenaB.oddsText || '').trim();
  if (/^\d+(\.\d+)?\s*:\s*\d+(\.\d+)?$/.test(t)) {
    const [a, b] = t.split(':').map(Number);
    return b ? a / b : 1;
  }
  const n = parseFloat(t);
  return isFinite(n) && n > 0 ? n : 1;
}

function oddsLabel() { return arenaB.oddsMode === 'preset' ? arenaB.odds : (arenaB.oddsText || 'custom'); }

function startLabel() {
  if (arenaB.startMode === 'preset') return arenaB.start;
  if (!arenaB.startCustom) return 'pick a time';
  const d = new Date(arenaB.startCustom);
  return isNaN(d) ? 'pick a time' : d.toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function payoffHTML() {
  const S = arenaB.stake, m = oddsMult();
  const pool = Math.round(S * (1 + m));
  const rake = Math.round(pool * B_RAKE);
  const pays = pool - rake;
  const win = pays - S;
  const f = n => '£' + Math.abs(n).toLocaleString('en-GB');
  return `<div class="b-payoff">
    <div class="bp-card lose">
      <div class="bp-k mono">💀 IF&nbsp;YOU&nbsp;LOSE</div>
      <div class="bp-v down">−${f(S)}</div>

}

let rewardEl = null;

function showReward(pot, opp) {
  if (rewardEl) return;
  const veil = document.createElement('div');
  veil.className = 'reward-veil';
  veil.innerHTML = `<div class="reward-card">
    <div class="reward-gift">🎁</div>
    <div class="reward-title">You won the battle!</div>
    <div class="reward-sub">Your return beat <b>${opp}</b> when the window closed.<br>The escrowed pot is yours.</div>
    <div class="slide-track" id="slideTrack">
      <div class="slide-handle" id="slideHandle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <div class="slide-label" id="slideLabel">Slide to claim £${pot.toLocaleString('en-GB')}</div>
    </div>
    <button class="reward-skip" data-rskip>Claim later</button>
  </div>`;
  document.body.appendChild(veil);
  rewardEl = veil;
  const track = document.getElementById('slideTrack');
  const handle = document.getElementById('slideHandle');
  const labelEl = document.getElementById('slideLabel');
  let sx = 0, dx = 0, dragging = false;
  const maxX = () => track.clientWidth - handle.offsetWidth - 6;
  handle.addEventListener('pointerdown', e => {
    dragging = true; sx = e.clientX; dx = 0;
    handle.classList.add('dragging');
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', e => {
    if (!dragging) return;
    dx = Math.max(0, Math.min(maxX(), e.clientX - sx));
    handle.style.transform = `translateX(${dx}px)`;
    labelEl.style.opacity = Math.max(0, 1 - dx / 60);
  });
  handle.addEventListener('pointerup', () => {
    dragging = false;
    handle.classList.remove('dragging');
    if (dx > maxX() * 0.8) unlockReward(pot, opp);
    else { handle.style.transform = ''; labelEl.style.opacity = 1; }
    dx = 0;
  });
}

function unlockReward(pot, opp) {
  const card = rewardEl.querySelector('.reward-card');
  card.querySelector('.slide-track').outerHTML = `<div class="claim-strip" data-rclaim>
    <span><span class="claim-amt">+£${pot.toLocaleString('en-GB')} claimed</span>
      <span class="claim-sub" style="display:block">settled to your balance · tap to continue</span></span>
    <span class="claim-ic">🏆</span>
  </div>`;
  const skip = card.querySelector('.reward-skip');
  if (skip) skip.remove();
  card.querySelector('.reward-title').textContent = 'GG — pot secured';
  card.querySelector('.reward-gift').textContent = '🏆';
  term.bal += pot;
  addNotif('🏆', 'Battle won — pot claimed', `+£${pot.toLocaleString('en-GB')} — you beat ${opp} and the escrow settled to your balance.`);
  fireConfetti();
}

function closeReward() {
  if (rewardEl) { rewardEl.remove(); rewardEl = null; }
}

function fireConfetti() {
  const c = document.createElement('canvas');
  c.id = 'confettiCanvas';
  document.body.appendChild(c);
  const ctx = c.getContext('2d');
  const W = c.width = window.innerWidth, H = c.height = window.innerHeight;
  const cols = ['#7c3aed', '#d946ef', '#10b981', '#f59e0b', '#3b82f6', '#ef4444'];
  const ps = Array.from({ length: 170 }, () => ({
    x: Math.random() * W, y: -30 - Math.random() * H * 0.4,
    w: 5 + Math.random() * 6, h: 8 + Math.random() * 8,
    r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
    vy: 2.2 + Math.random() * 3.4, vx: (Math.random() - 0.5) * 1.8,
    col: cols[(Math.random() * cols.length) | 0]
  }));
  let frames = 0;
  (function tick() {
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.col; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (++frames < 330) requestAnimationFrame(tick);
    else c.remove();
  })();
}

document.addEventListener('click', e => {
  const q = sel => e.target.closest(sel);
  let el;
  /* dismiss notifications when clicking elsewhere */
  if (notifOpen && !q('[data-bell]') && !q('#notifPanel')) {
    notifOpen = false;
    const p = document.getElementById('notifPanel');
    if (p) p.classList.remove('show');
  }
  /* counter + enter handled by their own listener */
  if (q('[data-cnt]') || q('[data-enter]')) return;
  if ((el = q('[data-collapse]'))) return document.body.classList.toggle('side-collapsed');
  if ((el = q('[data-bell]'))) {
    notifOpen = !notifOpen;
    const p = document.getElementById('notifPanel');
    if (notifOpen) { renderNotifPanel(); notifs.forEach(n => n.read = true); updateBell(); }
    if (p) p.classList.toggle('show', notifOpen);
    return;
  }
  if ((el = q('[data-nav]'))) return navigate(el.dataset.nav);
  if ((el = q('[data-tour]'))) { lbTour = el.dataset.tour; lbPage = 0; return navigate('leaderboard'); }
  if ((el = q('[data-trend]'))) {
    const dest = [['terminal', 'XAUUSD'], ['ideas'], ['terminal', 'BTC'], ['arena'], ['terminal', 'NAS100']][+el.dataset.trend];
    if (!dest) return;
    if (dest[1]) term.asset = dest[1];
    return navigate(dest[0]);
  }
  if ((el = q('[data-fdaccept]'))) {
    const name = el.dataset.fdaccept;
    const p = POSTS.find(x => x.name === name && x.open);
    const side = p ? parseFloat(p.open.pot.replace(/[£,]/g, '')) * (p.open.pot.includes('K') ? 1000 : 1) : 4000;
    myBattles.unshift({ id: battleSeq++, opp: name, av: p ? p.av : '⚔️', tint: p ? p.tint : AV_TINTS[0], market: 'Any market', window: p ? p.open.window : '1 week', pot: side * 2, my: 0, op: 0, watching: 12 + Math.floor(Math.random() * 240) });
    addNotif('⚔️', 'Battle locked in', `You accepted ${name}’s open challenge — stakes escrowed.`);
    navigate('arena');
    return toast(`Battle vs ${name} locked in — live under Your battles`);
  }
  /* terminal */
  if ((el = q('[data-tasset]'))) { term.asset = el.dataset.tasset; return renderTerminal(); }
  if ((el = q('[data-ttf]'))) { term.tf = el.dataset.ttf; return renderTerminal(); }

  if ((el = q('[data-trisk]'))) { term.risk = +el.dataset.trisk; return renderTerminal(); }
  if ((el = q('[data-tdir]'))) {
    const a = INSTR[term.asset];
    term.pos = { sym: term.asset, dir: el.dataset.tdir, entry: a.px, risk: term.bal * term.risk / 100, riskPct: term.risk, rr: term.rr, mode: term.mode, be: false, src: 'terminal', openedAt: Date.now() };
    toast(`${el.dataset.tdir === 'up' ? 'Bought' : 'Sold'} ${term.asset} · risking ${gbp0(term.pos.risk)}`);
    return renderTerminal();
  }
  if ((el = q('[data-tbe]'))) { if (term.pos) { term.pos.be = true; toast('Stop moved to breakeven'); renderTerminal(); } return; }
  if ((el = q('[data-tclose]'))) {
    if (!term.pos) return;
    const pos = term.pos, a = INSTR[pos.sym];
    const move = (a.px - pos.entry) / pos.entry * (pos.dir === 'up' ? 1 : -1);
    let pnl = Math.max(pos.be ? 0 : -pos.risk, Math.min(pos.risk * pos.rr, pos.risk * (move / TMODES[pos.mode].stop)));
    return closePos(pnl, 'manual');
  }
  /* ideas */
  if ((el = q('[data-icat]'))) { ideaCat = el.dataset.icat; return renderIdeas(); }
  if ((el = q('[data-ihz]'))) { ideaHz = el.dataset.ihz; return renderIdeas(); }
  if ((el = q('[data-imode]'))) { ideaMode = el.dataset.imode; if (ideaMode === 'flick') flick.sec = 60; return renderIdeas(); }
  if ((el = q('[data-brief]'))) {
    const uid = +el.dataset.brief;
    openBriefs.has(uid) ? openBriefs.delete(uid) : openBriefs.add(uid);
    return renderIdeas();
  }
  if ((el = q('[data-frisk]'))) { flick.risk = +el.dataset.frisk; return renderIdeas(); }
  if ((el = q('[data-fskip]'))) return flickResolve(false);
  if ((el = q('[data-ftake]'))) return flickResolve(true);
  if ((el = q('[data-freshuffle]'))) { flickBuild(); return renderIdeas(); }
  if ((el = q('[data-fprov]'))) {
    flick.prov = el.dataset.fprov;
    flick.model = FLICK_MODELS[flick.prov].models[0];
    return renderIdeas();
  }
  if ((el = q('[data-fmodel]'))) {
    const list = FLICK_MODELS[flick.prov].models;
    flick.model = list[(list.indexOf(flick.model) + 1) % list.length];
    return renderIdeas();
  }
  if ((el = q('[data-fpick]'))) { term.asset = el.dataset.fpick; return navigate('terminal'); }
  if ((el = q('[data-itrade]'))) { term.asset = el.dataset.itrade; navigate('terminal'); return toast(`${el.dataset.itrade} loaded in the terminal`); }
  if ((el = q('[data-stacknext]'))) {
    const front = document.querySelector('.scard.d0');
    if (front && !front.classList.contains('out')) {
      front.classList.add('out');
      setTimeout(() => { stackTop = (stackTop + 1) % ideaFeed.length; renderIdeas(); }, 380);
    }
    return;
  }
  /* social feed */
  if ((el = q('[data-ftab]'))) { feedTab = el.dataset.ftab; return renderSocial(); }
  if ((el = q('[data-showposts]'))) {
    POSTS.unshift(...pendingPosts);
    pendingPosts = [];
    return renderSocial();
  }
  if ((el = q('[data-postbtn]'))) {
    const inp = document.getElementById('composeIn');
    if (!inp || !inp.value.trim()) return toast('Write something first');
    POSTS.unshift({ id: postId++, name: 'jstone', handle: '@jstone', av: 'J', tint: 'linear-gradient(135deg,var(--accent-b),var(--accent-a))', time: 'now', tag: null, text: inp.value.trim(), replies: 0, reposts: 0, likes: 0, views: '1', liked: false, reposted: false, bm: false });
    renderSocial();
    return toast('Posted to your followers');
  }
  if ((el = q('[data-plike]'))) {
    const p = POSTS.find(x => x.id === +el.dataset.plike);
    if (p) { p.liked = !p.liked; p.likes += p.liked ? 1 : -1; renderSocial(); }
    return;
  }
  if ((el = q('[data-prt]'))) {
    const p = POSTS.find(x => x.id === +el.dataset.prt);
    if (p) {
      p.reposted = !p.reposted; p.reposts += p.reposted ? 1 : -1;
      toast(p.reposted ? 'Reposted to your followers' : 'Repost removed');
      renderSocial();
    }
    return;
  }
  if ((el = q('[data-pbm]'))) {
    const p = POSTS.find(x => x.id === +el.dataset.pbm);
    if (p) { p.bm = !p.bm; toast(p.bm ? 'Added to your Bookmarks' : 'Removed from Bookmarks'); renderSocial(); }
    return;
  }
  if ((el = q('[data-pshare]'))) return toast('Post link copied');
  if ((el = q('[data-pmenu]'))) return toast('Post options are a demo');
  if ((el = q('[data-tst]'))) return toast(el.dataset.tst);
  if ((el = q('[data-follow]'))) {
    const n = el.dataset.follow;
    following.has(n) ? following.delete(n) : following.add(n);
    toast(following.has(n) ? `Following ${n}` : `Unfollowed ${n}`);
    return currentView === 'trader' ? renderTrader() : renderSocial();
  }
  if ((el = q('[data-preply]'))) {
    const p = POSTS.find(x => x.id === +el.dataset.preply);
    const i = p ? threads.findIndex(t => t.name === p.name) : -1;
    if (i >= 0) { inboxTab = 'messages'; activeThread = i; threads[i].unread = false; return navigate('inbox'); }
    return toast('Replies open a DM — this trader has DMs closed');
  }
  /* inbox */
  if ((el = q('[data-stab]'))) { inboxTab = el.dataset.stab; return renderInbox(); }
  if ((el = q('[data-thread]'))) { activeThread = +el.dataset.thread; threads[activeThread].unread = false; return renderInbox(); }
  if ((el = q('[data-dmsend]'))) return sendDM();
  if ((el = q('[data-dm]'))) {
    const i = threads.findIndex(t => t.name === el.dataset.dm);
    inboxTab = 'messages';
    if (i >= 0) activeThread = i;
    return currentView === 'inbox' ? renderInbox() : navigate('inbox');
  }
  if ((el = q('[data-inv-acc]'))) {
    const iv = invites[+el.dataset.invAcc];
    invites.splice(+el.dataset.invAcc, 1);
    toast('Invite accepted — see you on the board');
    if (iv) addNotif('✅', 'Invite accepted', iv.t);
    return renderInbox();
  }
  if ((el = q('[data-inv-dec]'))) { invites.splice(+el.dataset.invDec, 1); toast('Invite declined'); return renderInbox(); }
  /* performance */
  if ((el = q('[data-prange]'))) { perfRange = el.dataset.prange; return renderPerformance(); }
  if ((el = q('[data-ptab]'))) { perfTab = el.dataset.ptab; return renderPerformance(); }
  if ((el = q('[data-shareperf]'))) return toast('Share link copied — live performance page');
  /* leaderboard */
  if ((el = q('[data-lbpage]'))) { lbPage += +el.dataset.lbpage; return renderLbPage(); }
  if ((el = q('[data-lbtour]'))) { lbTour = el.dataset.lbtour; return renderLbPage(); }
  /* arena */
  if ((el = q('[data-abopen]'))) { arenaB.open = !arenaB.open; return renderArena(); }
  if ((el = q('[data-abstake]'))) {
    if (el.dataset.abstake === 'custom') arenaB.stakeMode = 'custom';
    else { arenaB.stakeMode = 'preset'; arenaB.stake = +el.dataset.abstake; }
    return renderArena();
  }
  if ((el = q('[data-abodds]'))) {
    if (el.dataset.abodds === 'custom') arenaB.oddsMode = 'custom';
    else { arenaB.oddsMode = 'preset'; arenaB.odds = el.dataset.abodds; }
    return renderArena();
  }
  if ((el = q('[data-abstart]'))) {
    if (el.dataset.abstart === 'custom') arenaB.startMode = 'custom';
    else { arenaB.startMode = 'preset'; arenaB.start = el.dataset.abstart; }
    return renderArena();
  }
  if ((el = q('[data-abmarket]'))) { arenaB.market = el.dataset.abmarket; return renderArena(); }
  if ((el = q('[data-abpost]'))) {
    challenges.unshift({
      name: 'jstone', av: 'J', market: arenaB.market, start: startLabel(),
      pot: Math.round(arenaB.stake * (1 + oddsMult())), mine: true
    });
    arenaB.open = false;
    toast(`Challenge posted — £${arenaB.stake.toLocaleString('en-GB')} at ${oddsLabel()}, kick-off ${startLabel()}`);
    addNotif('⚔️', 'Challenge posted to the open board', `£${arenaB.stake.toLocaleString('en-GB')} at ${oddsLabel()} · ${arenaB.market} · kick-off ${startLabel()}.`);
    return renderArena();
  }
  if ((el = q('[data-abcancel]'))) {
    challenges.splice(+el.dataset.abcancel, 1);
    toast('Challenge cancelled — stake released from escrow');
    return renderArena();
  }
  if ((el = q('[data-njoin]'))) {
    const w = NATION_WARS[+el.dataset.njoin];
    if (!w || w.joined || w.aIn >= w.size) return;
    w.aIn++;
    w.joined = true;
    toast(`You're in — ${w.a[1]} squad, ${w.size}v${w.size} vs ${w.b[1]}. Trade well for your flag.`);
    addNotif('🏴', `Joined the ${w.a[1]} squad`, `${w.size}v${w.size} nation war vs ${w.b[1]} · £${w.pot.toLocaleString('en-GB')} pot · ends ${w.ends}. Your return now counts toward the squad average.`);
    return renderArena();
  }
  if ((el = q('[data-nreg]'))) {
    const more = document.querySelector(`[data-nmore="${el.dataset.nreg}"]`);
    if (!more) return;
    const open = more.classList.toggle('open');
    el.classList.toggle('open', open);
    el.querySelector('span').textContent = open ? 'Show less' : 'Show all';
    return;
  }
  if ((el = q('[data-accept]'))) {
    const i = +el.dataset.accept;
    const c = challenges[i];
    if (!c) return;
    challenges.splice(i, 1);
    myBattles.unshift({
      id: battleSeq++, opp: c.name, av: c.av, tint: AV_TINTS[battleSeq % 6],
      market: c.market, window: c.window, pot: c.pot * 2,
      my: 0, op: 0, watching: 12 + Math.floor(Math.random() * 240)
    });
    toast(`Battle vs ${c.name} locked in — stakes escrowed, higher return takes £${(c.pot * 2).toLocaleString('en-GB')}`);
    addNotif('⚔️', `Battle vs ${c.name} is live`, `£${(c.pot * 2).toLocaleString('en-GB')} pot · ${c.window} window · higher return takes it.`);
    return renderArena();
  }
  if ((el = q('[data-watch]'))) {
    if (currentView !== 'arena') { navigate('arena'); return toast('The biggest battles are live here'); }
    return toast('Spectator streams launch with live data — take the other side instead');
  }
  /* partner */
  if ((el = q('[data-copyref]'))) {
    try { navigator.clipboard.writeText(partner.link); } catch (_e) {}
    return toast('Referral link copied');
  }
  /* reward overlay */
  if ((el = q('[data-rclaim]'))) { closeReward(); return toast('Winnings banked — back to the Arena'); }
  if ((el = q('[data-rskip]'))) { closeReward(); return toast('Pot parked in your notifications — claim any time'); }
  /* trader profile controls */
  if ((el = q('[data-trtab]'))) { traderTab = el.dataset.trtab; return renderTrader(); }
  if ((el = q('[data-trrange]'))) { traderRange = el.dataset.trrange; return renderTrader(); }
  /* trader rows — fall-through so buttons inside rows keep priority */
  if ((el = q('[data-trader]'))) return openTrader(el.dataset.trader);
});

document.addEventListener('input', e => {
  if (e.target.id === 'fame-search') return renderFame(e.target.value);
  if (e.target.id === 'rrSlider') {
    term.rr = +e.target.value;
    const riskAmt = term.bal * term.risk / 100;
    const lbl = document.getElementById('rrLabel');
    if (lbl) lbl.textContent = `1 : ${term.rr.toFixed(1)}`;
    const plain = document.getElementById('rrPlain');
    if (plain) plain.innerHTML = `Risk <b>${gbp0(riskAmt)}</b> to win <b>${gbp0(riskAmt * term.rr)}</b>`;
    return;
  }
  /* arena builder custom fields — update summary in place so inputs keep focus */
  if (e.target.id === 'stakeCustom') {
    const v = Math.max(10, Math.round(+e.target.value || 0));
    if (v) arenaB.stake = v;
  } else if (e.target.id === 'oddsCustom') {
    arenaB.oddsText = e.target.value;
  } else if (e.target.id === 'startCustom') {
    arenaB.startCustom = e.target.value;
  } else return;
  const sum = document.getElementById('bSum');
  if (sum) sum.innerHTML = payoffHTML();
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'dmInput') { e.preventDefault(); sendDM(); }
  if (e.target.id === 'railSearch') {
    e.preventDefault();
    toast(e.target.value.trim() ? `Search launches with live data — no results for “${e.target.value.trim()}” in demo` : 'Type a trader or market to search');
  }
  if (e.target.id === 'composeIn') {
    e.preventDefault();
    const btn = document.querySelector('[data-postbtn]');
    if (btn) btn.click();
  }
});

/* Neumorphic entries counter + Enter Now */

let entryCount = 1;

document.addEventListener('click', e => {
  let el;
  if ((el = e.target.closest('[data-cnt]'))) {
    entryCount = Math.max(1, Math.min(50, entryCount + (+el.dataset.cnt)));
    const v = document.getElementById('cntVal');
    v.textContent = entryCount;
    v.classList.remove('pop');
    void v.offsetWidth;
    v.classList.add('pop');
    document.getElementById('enterLabel').textContent = `Enter Now · £${(entryCount * 25).toLocaleString('en-GB')}`;
    return;
  }
  if ((el = e.target.closest('[data-enter]'))) {
    prizePool += entryCount * 25;
    activePlayers += 1;
    toast(`Entered with ${entryCount} ${entryCount === 1 ? 'entry' : 'entries'} — £${(entryCount * 25).toLocaleString('en-GB')} added to the pool`);
    addNotif('🎟️', 'Tournament entry confirmed', `${entryCount} ${entryCount === 1 ? 'entry' : 'entries'} · £${(entryCount * 25).toLocaleString('en-GB')} added to the prize pool.`);
    return;
  }
});

/* Partner mode toggle */
document.querySelector('.segmented-state').addEventListener('change', e => {
  navigate(e.target.checked ? 'partner' : 'arena');
});

/* Redraw charts on theme change */
document.getElementById('theme-state').addEventListener('change', () => {
  setTimeout(() => { if (RENDER[currentView]) RENDER[currentView](); }, 60);
});

navigate('arena');

/* Hero stats roll in from zero — every digit a slot-machine reel */
odoIntro('stat-pool', '£0.00M', '£' + (prizePool / 1e6).toFixed(2) + 'M');
odoIntro('stat-players', '000,000', activePlayers.toLocaleString('en-GB'));
odoIntro('stat-capital', '£00.00B', '£' + (liveCapital / 1e9).toFixed(2) + 'B');
</script>
</body>
</html>
