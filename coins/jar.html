<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ticket jar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23fff'/%3E%3Cpath d='M5 3h6v1.5H5z' fill='%23999'/%3E%3Cpath d='M4.5 5h7v8a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1z' fill='none' stroke='%23999'/%3E%3Ccircle cx='8' cy='11' r='1.6' fill='%23c9962e'/%3E%3C/svg%3E">
<style>
html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #ffffff;
  color: rgba(24, 24, 26, 0.9);
  font-family: system-ui, sans-serif;
  font-weight: 400;
  letter-spacing: 0.04em;
}

#scene {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.hud {
  position: fixed;
  top: 40px;
  left: 0;
  right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  pointer-events: none;
}

.eyebrow {
  margin: 0;
  font-size: 11px;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: rgba(24, 24, 26, 0.35);
}

.count {
  margin: 0;
  font-size: 22px;
  font-variant-numeric: tabular-nums;
}

.track {
  width: min(260px, 60vw);
  height: 2px;
  background: rgba(24, 24, 26, 0.12);
}

.bar {
  height: 100%;
  width: 0%;
  background: #c9962e;
  transition: width 0.6s ease;
}

.buy {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 26px;
  border: 1px solid rgba(24, 24, 26, 0.25);
  border-radius: 100px;
  background: #ffffff;
  color: rgba(24, 24, 26, 0.85);
  font: inherit;
  font-size: 13px;
  letter-spacing: 0.14em;
  cursor: pointer;
  transition: border-color 0.2s ease, transform 0.1s ease;
}

.buy:hover {
  border-color: rgba(24, 24, 26, 0.6);
}

.buy:active {
  transform: translateX(-50%) scale(0.97);
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div class="hud">
  <p class="eyebrow">trading competition</p>
  <p class="count" id="count"></p>
  <div class="track"><div class="bar" id="bar"></div></div>
</div>
<button class="buy" id="buy" type="button">buy a ticket · demo</button>
<script type="module">
import { mountJar } from "./jar.js";

const jar = mountJar(document.getElementById("scene"), {
  count: document.getElementById("count"),
  bar: document.getElementById("bar")
});
window.jar = jar; // integration hook: jar.setTickets(sold, total)
document.getElementById("buy").addEventListener("click", () => jar.buy());
</script>
</body>
</html>
