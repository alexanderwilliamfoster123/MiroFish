<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prize vault</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23fff'/%3E%3Cpath d='M5 3h6v1.5H5z' fill='%23999'/%3E%3Cpath d='M4.5 5h7v8a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1z' fill='none' stroke='%23999'/%3E%3Ccircle cx='8' cy='11' r='1.6' fill='%23c9962e'/%3E%3C/svg%3E">
<style>
html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #ffffff;
  color: rgba(24, 24, 26, 0.9);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, sans-serif;
  -webkit-font-smoothing: antialiased;
}

#scene {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* gold flash when a ticket lands */
.flash {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 60%, rgba(255, 195, 92, 0.28), rgba(255, 195, 92, 0) 62%);
  opacity: 0;
}

.flash.on {
  animation: flash 0.7s ease-out;
}

@keyframes flash {
  0% { opacity: 1; }
  100% { opacity: 0; }
}

.hud {
  position: fixed;
  top: 40px;
  left: 0;
  right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  pointer-events: none;
}

.eyebrow {
  margin: 0;
  font-size: 11px;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: rgba(24, 24, 26, 0.35);
}

.count {
  position: relative;
  margin: 0;
  font-size: 22px;
  font-variant-numeric: tabular-nums;
}

.count.pop {
  animation: pop 0.4s ease-out;
}

@keyframes pop {
  0% { transform: scale(1); }
  30% { transform: scale(1.18); }
  100% { transform: scale(1); }
}

.track {
  width: min(260px, 60vw);
  height: 2px;
  background: rgba(24, 24, 26, 0.12);
}

.bar {
  height: 100%;
  width: 0%;
  background: #c9962e;
  transition: width 0.6s ease;
}

.streak {
  position: fixed;
  top: 118px;
  left: 50%;
  transform: translateX(-50%);
  padding: 4px 12px;
  border-radius: 100px;
  background: #FFC35C;
  color: #4a3208;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  opacity: 0;
  transition: opacity 0.25s ease;
  pointer-events: none;
}

.streak.on {
  opacity: 1;
}

.floater {
  position: fixed;
  left: 50%;
  top: 34%;
  transform: translateX(-50%);
  font-size: 22px;
  font-weight: 600;
  color: #E9A437;
  pointer-events: none;
  animation: rise 1.1s ease-out forwards;
}

@keyframes rise {
  0% { opacity: 0; transform: translate(-50%, 14px) scale(0.8); }
  18% { opacity: 1; transform: translate(-50%, 0) scale(1.06); }
  100% { opacity: 0; transform: translate(-50%, -56px) scale(1); }
}

.buy {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 26px;
  border: 1px solid rgba(24, 24, 26, 0.25);
  border-radius: 100px;
  background: #ffffff;
  color: rgba(24, 24, 26, 0.85);
  font: inherit;
  font-size: 13px;
  letter-spacing: 0.14em;
  cursor: pointer;
  transition: border-color 0.2s ease, transform 0.1s ease;
}

.buy:hover {
  border-color: rgba(24, 24, 26, 0.6);
}

.buy:active {
  transform: translateX(-50%) scale(0.97);
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div class="flash" id="flash"></div>
<div class="hud">
  <p class="eyebrow">trading competition</p>
  <p class="count" id="count"></p>
  <div class="track"><div class="bar" id="bar"></div></div>
</div>
<div class="streak" id="streak">on fire ×2</div>
<button class="buy" id="buy" type="button">buy a ticket · demo</button>
<script type="module">
import { mountJar } from "./jar.js";

const countEl = document.getElementById("count");
const flashEl = document.getElementById("flash");
const streakEl = document.getElementById("streak");
let streakHide;

const jar = mountJar(document.getElementById("scene"), {
  count: countEl,
  bar: document.getElementById("bar"),
  onCelebrate(tier, streak) {
    // counter pop
    countEl.classList.remove("pop");
    void countEl.offsetWidth;
    countEl.classList.add("pop");
    // gold flash
    flashEl.classList.remove("on");
    void flashEl.offsetWidth;
    flashEl.classList.add("on");
    // +$25 floater
    const f = document.createElement("div");
    f.className = "floater";
    f.textContent = "+$25";
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1200);
    // streak pill
    if (tier > 1) {
      streakEl.textContent = `on fire ×${streak}`;
      streakEl.classList.add("on");
      clearTimeout(streakHide);
      streakHide = setTimeout(() => streakEl.classList.remove("on"), 2600);
    }
  }
}, { camZ: 13.2 });
window.jar = jar; // integration hook: jar.setTickets(sold, total)
document.getElementById("buy").addEventListener("click", () => jar.buy());
</script>
</body>
</html>
