<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Metal Button</title>
<style>
  @property --lm-angle {
    syntax: '<angle>';
    inherits: false;
    initial-value: 0deg;
  }

  :root {
    --ground: #0b0b0d;
    --ink: #c4c8d0;
    --ink-dim: #7d8189;
    --face-top: #1e1e22;
    --face-bottom: #060607;
    --rim: 1.5px;
  }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "SF Pro Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    min-height: 100vh;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3.5rem;
    padding: 3rem 1.5rem;
    text-align: center;
  }

  .head { display: flex; flex-direction: column; align-items: center; gap: .9rem; }

  .eyebrow {
    font-size: .7rem;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  h1 {
    margin: 0;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: 550;
    letter-spacing: -.01em;
    color: #e8eaee;
    text-wrap: balance;
  }

  .lede {
    margin: 0;
    max-width: 34ch;
    font-size: .95rem;
    line-height: 1.55;
    color: var(--ink-dim);
    text-wrap: balance;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 3.5rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* ---------- Liquid metal button ---------- */

  .lm {
    position: relative;
    isolation: isolate;
    appearance: none;
    border: 0;
    cursor: pointer;
    border-radius: 999px;
    padding: 1.35rem 3.1rem;
    font: inherit;
    font-size: 1.3rem;
    letter-spacing: .01em;
    color: #b3b7bf;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.07), rgba(255,255,255,0) 55%),
      linear-gradient(180deg, var(--face-top), var(--face-bottom) 62%, #0c0c0f);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.06),
      inset 0 -8px 18px rgba(0,0,0,.55),
      0 18px 40px -18px rgba(0,0,0,.9);
    transition: color .25s ease, transform .18s ease;
  }

  .lm.icon {
    width: 5.9rem;
    height: 5.9rem;
    padding: 0;
    display: inline-grid;
    place-items: center;
  }

  .lm svg { display: block; width: 1.75rem; height: 1.75rem; }

  /* Chromed rim: conic gradient masked to a thin ring, slowly turning */
  .lm::before,
  .lm::after {
    content: "";
    position: absolute;
    inset: calc(-1 * var(--rim));
    border-radius: inherit;
    padding: var(--rim);
    background: conic-gradient(from var(--lm-angle),
      #26282d 0deg,
      #43464e 30deg,
      #8f939c 44deg,
      #ffd3a0 52deg,
      #ffffff 56deg,
      #a9c2ff 60deg,
      #4a4d55 74deg,
      #202227 120deg,
      #3a3d45 160deg,
      #c9ced7 178deg,
      #3a3d45 196deg,
      #1d1f24 232deg,
      #565963 256deg,
      #ffc9b0 264deg,
      #ffffff 268deg,
      #b4e0ff 272deg,
      #3c3f47 288deg,
      #26282d 360deg);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    animation: lm-turn 9s linear infinite;
  }

  /* Soft halo where the glints sit */
  .lm::after {
    filter: blur(5px);
    opacity: .55;
    z-index: -1;
  }

  .lm:hover { color: #f2f3f5; transform: translateY(-1px); }
  .lm:hover::before { filter: brightness(1.3); }
  .lm:hover::after { opacity: .8; }
  .lm:active { transform: translateY(1px); }

  .lm:focus-visible {
    outline: 2px solid #a9c2ff;
    outline-offset: 4px;
  }

  @keyframes lm-turn { to { --lm-angle: 360deg; } }

  @media (prefers-reduced-motion: reduce) {
    .lm::before, .lm::after { animation: none; }
    .lm, .lm:hover, .lm:active { transform: none; }
  }

  /* ---------- Usage card ---------- */

  .usage {
    max-width: min(92vw, 34rem);
    text-align: left;
    border: 1px solid #1c1d21;
    border-radius: 12px;
    background: #0e0e11;
    overflow: hidden;
  }

  .usage-bar {
    display: flex;
    justify-content: space-between;
    padding: .55rem .9rem;
    border-bottom: 1px solid #1c1d21;
    font-size: .68rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #55585f;
  }

  .usage pre {
    margin: 0;
    padding: .9rem 1rem 1rem;
    overflow-x: auto;
    font: .78rem/1.65 "SF Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
    color: #9a9ea7;
  }

  .usage .tag { color: #c9ced7; }
  .usage .attr { color: #8fa8d9; }
  .usage .str { color: #c9b28f; }
</style>

</head>
<body>
<main class="stage">
  <header class="head">
    <p class="eyebrow">MiroFish · UI Lab</p>
    <h1>Liquid Metal Button</h1>
    <p class="lede">A chromed rim that catches light as it turns — one animated conic gradient, no shaders, no images.</p>
  </header>

  <div class="row">
    <button class="lm" type="button">Get Started</button>
    <button class="lm icon" type="button" aria-label="Sparkle action">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 4.5c.6 3.6 2.4 5.4 6 6-3.6.6-5.4 2.4-6 6-.6-3.6-2.4-5.4-6-6 3.6-.6 5.4-2.4 6-6z"/>
        <path d="M18.5 3.5v3M17 5h3"/>
        <path d="M6.5 16.5v2.5M5.25 17.75h2.5"/>
      </svg>
    </button>
  </div>

  <figure class="usage" style="margin:0">
    <div class="usage-bar"><span>Usage</span><span>demo.tsx</span></div>
    <pre><code><span class="attr">import</span> { <span class="tag">LiquidMetalButton</span> } <span class="attr">from</span> <span class="str">"@/components/ui/liquid-metal-button"</span>;

&lt;<span class="tag">LiquidMetalButton</span> <span class="attr">label</span>=<span class="str">"Get Started"</span> /&gt;
&lt;<span class="tag">LiquidMetalButton</span> <span class="attr">viewMode</span>=<span class="str">"icon"</span> /&gt;</code></pre>
  </figure>
</main>
</body>
</html>
