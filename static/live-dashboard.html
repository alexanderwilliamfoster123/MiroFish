.icg-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 11px; }
.icg-stats > div { min-width: 0; }
.icg-stats span { display: block; font-size: 8.5px; letter-spacing: .1em; color: var(--text-faint); }

/* AnimatedDock port — cursor-distance magnification with spring physics, no libraries */
let dockMouseX = Infinity, dockRAF = 0;

function dockLoop() {
  const items = document.querySelectorAll('#dockList .dk');
  let settled = true;
  items.forEach(li => {
    const r = li.getBoundingClientRect();
    const dist = dockMouseX === Infinity ? Infinity : dockMouseX - (r.left + r.width / 2);
    const target = dist === Infinity ? 52 : 52 + 30 * Math.max(0, 1 - Math.abs(dist) / 150);
    const cur = parseFloat(li.dataset.w || '52');
    const vel = (parseFloat(li.dataset.v || '0') + (target - cur) * 0.24) * 0.62;
    const nw = cur + vel;
    li.dataset.w = nw; li.dataset.v = vel;
    li.style.width = li.style.height = nw.toFixed(2) + 'px';
    if (Math.abs(vel) > 0.02 || Math.abs(target - nw) > 0.15) settled = false;
  });
  dockRAF = settled ? 0 : requestAnimationFrame(dockLoop);
}

function wakeDock() { if (!dockRAF) dockRAF = requestAnimationFrame(dockLoop); }

document.addEventListener('DOMContentLoaded', () => {
  const dock = document.querySelector('.dock');
  if (!dock) return;
  dock.addEventListener('pointermove', e => { dockMouseX = e.clientX; wakeDock(); });
  dock.addEventListener('pointerleave', () => { dockMouseX = Infinity; wakeDock(); });
});

  const s = total % 60;

  return d > 0 ? `${d}d ${pad(h)}h ${pad(m)}m ${pad(s)}s` : `${h}h ${pad(m)}m ${pad(s)}s`;
}

/* ---------------- Odometer — digits roll vertically like a slot machine.
   Any element can become an odometer: setOdo() rebuilds when the shape of the
   string changes (sign flip, extra digit) and rolls the strips otherwise. */

const ODIGITS = '0123456789'.split('').map(d => `<b>${d}</b>`).join('');

function odoInner(str) {
  /* rolling digit strips retired — numbers render plain so every figure sits on the same baseline */
  return str;
}

function odoHTML(id, str, cls = '') {
  return `<span class="odo${cls ? ' ' + cls : ''}" id="${id}" data-odo="${str}">${odoInner(str)}</span>`;
}

function setOdo(target, str) {
  const el = typeof target === 'string' ? document.getElementById(target) : target;
  if (!el || el.dataset.odo === str) return;
  el.textContent = str;
  el.dataset.odo = str;
}

/* roll in from a zeroed string on first paint */
function odoIntro(id, from, to) {
  const el = document.getElementById(id);
  if (!el) return;
  setOdo(el, from);
  requestAnimationFrame(() => requestAnimationFrame(() => setOdo(el, to)));
}

/* ---------------- Candle engine — OHLC + volume, live last bar ---------------- */

const TF_MS = { '1m': 60e3, '5m': 3e5, '15m': 9e5, '1H': 36e5, '1D': 864e5 };

function ensureCandles(a, sym) {
  if (a.cd && a.cdTf === term.tf) return;
  let s = hashName(sym + term.tf) || 1;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  const arr = [];
  let prev = 100;
  for (let i = 0; i < 80; i++) {
    const o = prev;
    const c = o * (1 + (rnd() - 0.5) * 0.022);
    arr.push({
      o, c,
      h: Math.max(o, c) * (1 + rnd() * 0.008),
      l: Math.min(o, c) * (1 - rnd() * 0.008),
      v: Math.abs(c - o) * 3 + rnd(),
    });
    prev = c;
  }
  const k = a.px / arr[79].c;
  arr.forEach(cd => { cd.o *= k; cd.h *= k; cd.l *= k; cd.c *= k; });
  a.cd = arr; a.cdTf = term.tf; a.cdTicks = 0;
}

function tickCandles(a) {
  if (!a.cd) return;
  const last = a.cd[a.cd.length - 1];
  last.c = a.px;
  last.h = Math.max(last.h, a.px);
  last.l = Math.min(last.l, a.px);
  last.v += Math.abs(a.px - last.o) * 0.4 + 0.05;
  if (++a.cdTicks >= 6) {
    a.cdTicks = 0;
    a.cd.push({ o: last.c, c: last.c, h: last.c, l: last.c, v: 0.05 });
    if (a.cd.length > 84) a.cd.shift();
  }
}

function drawCandleChart() {
  const box = document.getElementById('termChart');
  if (!box) return;
  const a = INSTR[term.asset];
  ensureCandles(a, term.asset);
  const cd = a.cd, n = cd.length;
  const W = Math.max(600, box.clientWidth || 920), H = 330, AXIS = 62, VOLH = 44, GAP2 = 8;
  const PH = H - VOLH - GAP2;
  const plotW = W - AXIS;
  const min = Math.min(...cd.map(k => k.l)), max = Math.max(...cd.map(k => k.h));
  const pad = (max - min) * 0.08 || 1;
  const lo = min - pad, hi = max + pad, rng = hi - lo;
  const maxV = Math.max(...cd.map(k => k.v));
  const slot = plotW / n, bw = slot * 0.62;
  const X = i => i * slot + slot / 2;
  const Y = v => (1 - (v - lo) / rng) * PH;
  const dp = a.dp;
  const fmtN = v => v.toLocaleString('en-GB', { maximumFractionDigits: dp, minimumFractionDigits: dp });
  const GREEN = '#10b981', RED = '#e5484d';
  let out = '';
  /* grid + right axis */
  for (let g = 0; g <= 4; g++) {
    const v = lo + rng * g / 4, y = Y(v).toFixed(1);
    out += `<line x1="0" x2="${plotW}" y1="${y}" y2="${y}" stroke="currentColor" opacity=".06"/>`
      + `<text x="${W - 4}" y="${+y + 3}" text-anchor="end" fill="currentColor" opacity=".38" font-size="9.5" font-family="ui-monospace,Menlo,monospace">${fmtN(v)}</text>`;
  }
  /* last-close guide */
  const lastUp = cd[n - 1].c >= cd[n - 1].o;
  out += `<line x1="0" x2="${plotW}" y1="${Y(cd[n - 1].c).toFixed(1)}" y2="${Y(cd[n - 1].c).toFixed(1)}" stroke="${lastUp ? GREEN : RED}" stroke-opacity=".45" stroke-dasharray="2 4"/>`;
  /* position lines — entry, stop, target */
  const pos = term.pos;
  if (pos && pos.sym === term.asset) {
    const stopPct = (TMODES[pos.mode] || TMODES[term.mode]).stop;
    const up = pos.dir === 'up';
    const stopPx = pos.be ? pos.entry : pos.entry * (up ? 1 - stopPct : 1 + stopPct);
    const tgtPx = pos.entry * (up ? 1 + stopPct * pos.rr : 1 - stopPct * pos.rr);
    const ln = (v, col, lbl) => {
      if (v < lo || v > hi) return '';
      return `<line x1="0" x2="${plotW}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="${col}" stroke-opacity=".75" stroke-dasharray="5 4"/>`
        + `<text x="6" y="${(Y(v) - 4).toFixed(1)}" fill="${col}" font-size="8.5" font-family="ui-monospace,Menlo,monospace" letter-spacing=".08em">${lbl} ${fmtN(v)}</text>`;
    };
    out += ln(pos.entry, 'color-mix(in srgb, currentColor 65%, transparent)', up ? 'LONG ENTRY' : 'SHORT ENTRY');
    out += ln(stopPx, RED, pos.be ? 'STOP · BREAKEVEN' : 'STOP');
    out += ln(tgtPx, GREEN, 'TARGET');
  }
  /* candles */
  const hov = term.cHover;
  cd.forEach((k, i) => {
    const col = k.c >= k.o ? GREEN : RED;
    const top = Y(Math.max(k.o, k.c)), bot = Y(Math.min(k.o, k.c));
    const dim = hov != null && hov !== i ? ' opacity=".45"' : '';
    out += `<g${dim}><line x1="${X(i).toFixed(1)}" x2="${X(i).toFixed(1)}" y1="${Y(k.h).toFixed(1)}" y2="${Y(k.l).toFixed(1)}" stroke="${col}"/>`
      + `<rect x="${(X(i) - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, bot - top).toFixed(1)}" fill="${col}"/></g>`;
  });
  /* volume strip */
  cd.forEach((k, i) => {
    const vh = (k.v / maxV) * VOLH;
    out += `<rect x="${(X(i) - bw / 2).toFixed(1)}" y="${(PH + GAP2 + VOLH - vh).toFixed(1)}" width="${bw.toFixed(1)}" height="${vh.toFixed(1)}" fill="${k.c >= k.o ? GREEN : RED}" fill-opacity="${hov != null && hov !== i ? '.25' : '.55'}"/>`;
  });
  /* crosshair */
  if (hov != null) out += `<line x1="${X(hov).toFixed(1)}" x2="${X(hov).toFixed(1)}" y1="0" y2="${H}" stroke="currentColor" opacity=".28" stroke-dasharray="3 3"/>`;
  const svgEl = box.querySelector('svg');
  svgEl.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svgEl.innerHTML = out;
  /* crosshair tooltip */
  const tip = document.getElementById('ccTip');
  if (tip) {
    if (hov == null) tip.classList.remove('on');
    else {
      const k = cd[hov];
      const t = new Date(Date.now() - (n - 1 - hov) * (TF_MS[term.tf] || 3e5));
      const chg = (k.c - k.o) / k.o * 100;
      tip.innerHTML = `<div class="cct-t mono">${t.toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}</div>`
        + [['O', k.o], ['H', k.h], ['L', k.l], ['C', k.c]].map(([l2, v]) =>
          `<div class="cct-r"><span class="mono">${l2}</span><b>${fmtN(v)}</b></div>`).join('')
        + `<div class="cct-r"><span class="mono">CHG</span><b class="${chg >= 0 ? 'up' : 'down'}">${fmtRet(chg)}</b></div>`;
      const r = box.getBoundingClientRect();
      const px = X(hov) / W * r.width;
      tip.style.left = (px > r.width * 0.55 ? px - tip.offsetWidth - 14 : px + 14) + 'px';
      tip.classList.add('on');
    }
  }
}

function bindTermChart() {
  const box = document.getElementById('termChart');
  if (!box) return;
  box.addEventListener('pointermove', e => {
    const r = box.getBoundingClientRect();
    const a = INSTR[term.asset];
    if (!a.cd) return;
    const i = Math.floor((e.clientX - r.left) / r.width * a.cd.length);
    term.cHover = Math.max(0, Math.min(a.cd.length - 1, i));

function drawSeries(canvas, series, opts = {}) {
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  const min = Math.min(...series), max = Math.max(...series), rng = (max - min) || 1;
  const pad = 12;
  const X = i => pad + (i / (series.length - 1)) * (w - pad * 2);
  const Y = v => pad + (1 - (v - min) / rng) * (h - pad * 2);
  const up = series[series.length - 1] >= series[0];
  const col = opts.color || (up ? '#16a34a' : '#e5484d');
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, col + '33');
  grad.addColorStop(1, col + '00');
  ctx.beginPath();
  series.forEach((v, i) => i ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v)));
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.lineTo(X(series.length - 1), h); ctx.lineTo(X(0), h); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(pad, Y(series[series.length - 1]));
  ctx.lineTo(w - pad, Y(series[series.length - 1]));
  ctx.strokeStyle = cssVar('--text-faint'); ctx.lineWidth = 1; ctx.stroke();
  ctx.setLineDash([]);
}

function tickPrices() {
  if (!feedLive) return;
  Object.keys(INSTR).forEach(k => {
    const a = INSTR[k];
    a.px += a.px * (Math.random() - 0.497) * 0.0011;
    a.series.push(a.px);
    if (a.series.length > 120) a.series.shift();
  });
  document.querySelectorAll('[data-ptag]').forEach(el => setOdo(el, fmtPx(el.dataset.ptag)));
  document.querySelectorAll('[data-podo]').forEach(el => setOdo(el, fmtPx(el.dataset.podo)));
  document.querySelectorAll('[data-ppill]').forEach(el => {
    const p = INSTR[el.dataset.ppill];
    const chg = (p.px - p.open) / p.open * 100;
    el.classList.toggle('neg', chg < 0);
    const b = el.querySelector('b');
    if (b) b.textContent = fmtRet(chg);
  });
  if (currentView !== 'terminal') return;
  Object.keys(INSTR).forEach(k => setOdo(document.querySelector(`[data-tpx="${k}"]`), fmtPx(k)));
  const a = INSTR[term.asset];
  const bigPx = document.getElementById('bigPx');
  if (bigPx) {
    setOdo(bigPx, fmtPx(term.asset));
    const chg = (a.px - a.open) / a.open * 100;
    const bigChg = document.getElementById('bigChg');
    setOdo(bigChg, fmtRet(chg));
    bigChg.className = 'chart-chg odo ' + (chg >= 0 ? 'up' : 'down');
  }
  tickCandles(a);
  drawCandleChart();
  if (term.pos) updatePos();
}

function updatePos() {
  const pos = term.pos;
  const a = INSTR[pos.sym];
  const stop = TMODES[pos.mode].stop;
  const move = (a.px - pos.entry) / pos.entry * (pos.dir === 'up' ? 1 : -1);
  let pnl = pos.risk * (move / stop);
  const floor = pos.be ? 0 : -pos.risk;
  if (pnl <= floor) return closePos(floor, pos.be ? 'breakeven' : 'stopped');
  if (pnl >= pos.risk * pos.rr) return closePos(pos.risk * pos.rr, 'target');
  const el = document.getElementById('posPnl');
  if (el) {
    el.textContent = (pnl >= 0 ? '+' : '−') + gbp(pnl);
    el.className = 'pos-pnl ' + (pnl >= 0 ? 'up' : 'down');
  }
}

function closePos(pnl, outcome = 'manual') {
  const pos = term.pos;
  if (!pos) return;
  if (Math.abs(pnl) < 1) { pnl = 0; outcome = 'breakeven'; }
  term.bal += pnl;
  tradeLog.unshift({
    acct: ACCTS[term.acct].id,
    sym: pos.sym, dir: pos.dir, entry: pos.entry, exit: INSTR[pos.sym].px,
    riskAmt: pos.risk, riskPct: pos.riskPct || term.risk, rr: pos.rr, pnl,
    outcome, src: pos.src || 'terminal',
    openedAt: pos.openedAt || Date.now(), closedAt: Date.now()
  });
  term.pos = null;
  const msg = {
    target: `◆ Target hit — +${gbp(pnl)} banked`,
    stopped: `✕ Stopped out — −${gbp(pnl)}`,
    breakeven: '◎ Flat — closed at breakeven',
    manual: pnl >= 0 ? `✂ Closed early — +${gbp(pnl)}` : `✂ Closed early — −${gbp(pnl)}`
  }[outcome];
  toast(msg);
  addNotif(pnl > 0 ? 'W' : pnl < 0 ? 'L' : '—', `${pos.sym} ${pos.dir === 'up' ? 'long' : 'short'} closed`, msg);
  markStreak();
  saveDB();
  renderTerminal();
}

function flickSpark(c) {
  const up = c.dir === 'up';
  const col = up ? '#10b981' : '#e5484d';
  const W = 300, H = 84, pad = 6, N = 40, ys = [];
  let s = (c.uid + 7) * 2654435761 % 2147483647, v = H * 0.5;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let i = 0; i < N; i++) {
    v += (rnd() - (up ? 0.42 : 0.58)) * 8;
    v = Math.max(pad, Math.min(H - pad, v));
    ys.push(v);
  }
  const X = i => (pad + (W - 2 * pad) * i / (N - 1)).toFixed(1);
  let line = `M${X(0)},${ys[0].toFixed(1)}`;
  for (let j = 1; j < N; j++) line += ` L${X(j)},${ys[j].toFixed(1)}`;
  const area = `${line} L${X(N - 1)},${H} L${X(0)},${H} Z`;
  const gid = 'spk' + c.uid;
  return `<svg class="tc-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#${gid})"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/></svg>`;

/* Interactive sparkline — crosshair + price tooltip on hover, like a pro market card */
function bindIdeaCharts() {
  document.querySelectorAll('[data-icgchart]').forEach(wrap => {
    const sym = wrap.dataset.icgchart, p = INSTR[sym];
    const svg = wrap.querySelector('svg'), tip = wrap.querySelector('.icg-tip');
    const W = wrap.clientWidth || 300, H = wrap.clientHeight || 96, pad = 8;
    const data = p.series.slice(-60);
    const min = Math.min(...data), max = Math.max(...data), rng = (max - min) || 1;
    const X = i => pad + i / (data.length - 1) * (W - pad * 2);
    const Y = v => H - pad - (v - min) / rng * (H - pad * 2);
    const up = data[data.length - 1] >= data[0];
    const col = up ? '#10b981' : '#e5484d';
    const line = data.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = `<defs><linearGradient id="icg-g-${sym}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${col}" stop-opacity=".25"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <path d="${line} L${X(data.length - 1).toFixed(1)},${H} L${X(0).toFixed(1)},${H} Z" fill="url(#icg-g-${sym})"/>
      <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <line class="icg-vline" x1="0" y1="${pad}" x2="0" y2="${H - pad}" stroke="${col}" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
      <circle class="icg-dot" r="3.5" fill="${col}" stroke="var(--card)" stroke-width="2" opacity="0"/>`;
    const vline = svg.querySelector('.icg-vline'), dot = svg.querySelector('.icg-dot');
    wrap.addEventListener('pointermove', e => {
      const r = wrap.getBoundingClientRect();
      const i = Math.max(0, Math.min(data.length - 1, Math.round((e.clientX - r.left - pad) / (r.width - pad * 2) * (data.length - 1))));
      const x = X(i), y = Y(data[i]);
      vline.setAttribute('x1', x); vline.setAttribute('x2', x); vline.setAttribute('opacity', '.7');
      dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.setAttribute('opacity', '1');
      tip.textContent = data[i].toLocaleString('en-GB', { maximumFractionDigits: p.dp });
      tip.classList.add('on');
      tip.style.left = Math.min(Math.max(6, x / W * r.width - tip.offsetWidth / 2), r.width - tip.offsetWidth - 6) + 'px';
    });
    wrap.addEventListener('pointerleave', () => {
      vline.setAttribute('opacity', '0'); dot.setAttribute('opacity', '0'); tip.classList.remove('on');
    });
  });
}

/* Fan carousel engine — slot math + spring transitions, no libraries */
const FAN_POS = [
  { rot: -21, scale: 0.7756, x: -30, y: 7.3, z: 1 },
  { rot: -14, scale: 0.8498, x: -22, y: 4.0, z: 2 },
  { rot: -7, scale: 0.9346, x: -11, y: 1.3, z: 3 },
  { rot: 0, scale: 1, x: 0, y: 0, z: 10 },
  { rot: 7, scale: 0.9346, x: 11, y: 1.3, z: 3 },
  { rot: 14, scale: 0.8498, x: 22, y: 4.0, z: 2 },
  { rot: 21, scale: 0.7756, x: 30, y: 7.3, z: 1 }
];

function applyFan() {
  const wrap = document.getElementById('fanWrap');
  if (!wrap || !flick.deck || !flick.deck.length) return;
  const len = flick.deck.length;
  const w = wrap.clientWidth || 600;
  const mult = w < 480 ? 0.3 : w < 700 ? 0.42 : 0.55;
  wrap.querySelectorAll('.fan-card').forEach(el => {
    const i = +el.dataset.fi;
    let dd = ((i - flick.pos) % len + len) % len;
    if (dd > len / 2) dd -= len;
    const slot = dd + 3;
    if (slot < 0 || slot > 6) {
      el.dataset.t = 'translateX(-50%) translateY(2rem) scale(0.3)';
      el.style.transform = el.dataset.t;
      el.style.opacity = 0; el.style.zIndex = 0; el.style.pointerEvents = 'none';
      return;
    }
    const p2 = FAN_POS[slot];
    const t = `translateX(calc(-50% + ${(p2.x * mult).toFixed(1)}rem)) translateY(${(p2.y * 0.9).toFixed(1)}rem) rotate(${p2.rot}deg) scale(${p2.scale})`;
    el.dataset.t = t;
    el.style.transform = t;
    el.style.opacity = 1;
    el.style.zIndex = p2.z;
    el.style.pointerEvents = 'auto';
  });
}

function fanCycle(target) {
  const d = flick.deck;
  if (!d || !d.length) return;
  const len = d.length;
  const old = flick.pos;
  const next = ((target % len) + len) % len;
  if (next === old) return;
  flick.pos = next;
  flick.sec = 60;
  const wrap = document.getElementById('fanWrap');
  if (!wrap) return renderIdeas();
  const oldCtr = wrap.querySelector(`.fan-card[data-fi="${old}"]`);
  if (oldCtr && d[old]) { oldCtr.classList.remove('ctr'); oldCtr.setAttribute('data-fango', old); oldCtr.innerHTML = fanPrevHTML(d[old]); }
  const ctr = wrap.querySelector(`.fan-card[data-fi="${next}"]`);
  if (ctr) { ctr.classList.add('ctr'); ctr.removeAttribute('data-fango'); ctr.innerHTML = flickCardHTML(d[next]); }
  applyFan();
  bindFlick();
  const c = d[next], rr = HZCFG[c.hz].rr, riskAmt = term.bal * flick.risk / 100;
  const xEl = document.querySelector('.f1c-po-x small'); if (xEl) xEl.textContent = rr + '×';
  const winEl = document.querySelector('.f1c-po b.win'); if (winEl) winEl.textContent = gbp(riskAmt * rr);
}

function executeIdea(c) {
  const modeMap = { scalp: 'scalp', intraday: 'day', swing: 'swing' };
  term.asset = c.sym;
  term.pos = { sym: c.sym, dir: c.dir, entry: INSTR[c.sym].px, risk: term.bal * flick.risk / 100, riskPct: flick.risk, rr: HZCFG[c.hz].rr, mode: modeMap[c.hz] || 'day', be: false, src: 'flick', openedAt: Date.now() };
  toast(`${c.dir === 'up' ? 'Bought' : 'Sold'} ${c.sym} @ ${fmtPx(c.sym)} — ${flick.risk}% risk, 1:${HZCFG[c.hz].rr}`);
  addNotif('F', `Flick signal taken — ${c.sym}`, `${c.dir === 'up' ? 'Long' : 'Short'} @ ${fmtPx(c.sym)}, ${flick.risk}% risk, 1:${HZCFG[c.hz].rr} target`);
  markStreak();
}

function flickResolve(take) {
  const card = document.getElementById('flickTop');
  const c = flick.deck[flick.pos];
  if (!card || !c) return;
  if (take) {
    executeIdea(c);
    flick.taken.push({ sym: c.sym, dir: c.dir });
    const st = card.querySelector('.fstamp.exec');
    if (st) st.style.opacity = '1';
  } else {
    flick.passed++;
    const st = card.querySelector('.fstamp.skip');
    if (st) st.style.opacity = '1';
  }
  card.style.transition = 'transform 0.34s ease, opacity 0.34s ease';
  card.style.transform = take ? 'translate(560px, 20px) rotate(16deg)' : 'translate(-560px, 20px) rotate(-16deg)';
  card.style.opacity = '0';
  setTimeout(() => {
    flick.deck.splice(flick.pos, 1);
    if (flick.pos >= flick.deck.length) flick.pos = 0;
    flick.sec = 60;
    renderIdeas();
  }, 300);
}

function bindFlick() {
  const card = document.getElementById('flickTop');
  if (!card) return;
  let sx = 0, dx = 0, dragging = false;
  card.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    dragging = true; sx = e.clientX; dx = 0;
    card.classList.add('dragging');
    card.setPointerCapture(e.pointerId);
  });
  card.addEventListener('pointermove', e => {
    if (!dragging) return;
    dx = e.clientX - sx;
    card.style.transform = `translateX(${dx}px) rotate(${(dx / 20).toFixed(1)}deg)`;
    const ex = card.querySelector('.fstamp.exec'), sk = card.querySelector('.fstamp.skip');
    if (ex) ex.style.opacity = dx > 0 ? Math.min(1, dx / 110) : 0;
    if (sk) sk.style.opacity = dx < 0 ? Math.min(1, -dx / 110) : 0;
  });
  card.addEventListener('pointerup', () => {
    if (!dragging) return;
    dragging = false;
    card.classList.remove('dragging');
    if (dx > 110) flickResolve(true);
    else if (dx < -110) flickResolve(false);
    else {
      card.style.transform = '';
      const ex = card.querySelector('.fstamp.exec'), sk = card.querySelector('.fstamp.skip');
      if (ex) ex.style.opacity = 0;
      if (sk) sk.style.opacity = 0;
    }
    dx = 0;
  });
}

function mediaChartSVG(win, seed) {
  const col = win ? '#22c55e' : '#e5484d';
  const W = 480, H = 240, pad = 20, N = 30, ys = [];
  let v = H * 0.55, s = seed || 1;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let i = 0; i < N; i++) {
    v += (rnd() - (win ? 0.56 : 0.44)) * 15;
    v = Math.max(pad, Math.min(H - pad, v));
    ys.push(v);
  }
  const X = i => (pad + (W - 2 * pad) * i / (N - 1)).toFixed(1);
  let line = `M${X(0)},${ys[0].toFixed(1)}`;
  for (let j = 1; j < N; j++) line += ` L${X(j)},${ys[j].toFixed(1)}`;
  const area = `${line} L${X(N - 1)},${H} L${X(0)},${H} Z`;
  const gid = 'fm' + seed;
  let grid = '';
  for (let g = 1; g < 3; g++) grid += `<line x1="${pad}" y1="${(H * g / 3).toFixed(0)}" x2="${W - pad}" y2="${(H * g / 3).toFixed(0)}" stroke="rgba(255,255,255,.06)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".28"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#${gid})"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function buildMetric(id, series, opts = {}) {
  const root = document.getElementById(id);
  if (!root || !series || series.length < 2) return;
  const fmt = opts.fmt || (n => '£' + Math.round(n).toLocaleString('en-GB'));
  const n = series.length;
  const first = series[0], last = series[n - 1], prev = series[n - 2];
  const pct = first ? (last - first) / first * 100 : 0;
  const trend = Math.abs(pct) < 0.5 ? 'flat' : last >= first ? 'up' : 'down';
  const stroke = trend === 'down' ? '#e5484d' : trend === 'flat' ? '#8b93a3' : '#10b981';
  root.querySelector('[data-role="wash"]').style.background =
    `linear-gradient(to left, ${stroke}1f, transparent 75%)`;
  const chart = root.querySelector('[data-role="chart"]');
  const svg = root.querySelector('[data-role="svg"]');
  const W = Math.max(260, chart.clientWidth || 600), H = Math.max(180, chart.clientHeight || 300), pad = 12;
  const min = Math.min(...series), max = Math.max(...series), rng = (max - min) || 1;
  const X = i => pad + (i / (n - 1)) * (W - pad * 2);
  const Y = v => 34 + (1 - (v - min) / rng) * (H - 34 - pad);
  let line = `M${X(0)},${Y(first).toFixed(1)}`;
  for (let i = 1; i < n; i++) line += ` L${X(i).toFixed(1)},${Y(series[i]).toFixed(1)}`;
  const area = `${line} L${X(n - 1).toFixed(1)},${H} L${X(0)},${H} Z`;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.innerHTML = `
    <defs><linearGradient id="${id}-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${stroke}" stop-opacity=".18"/><stop offset="1" stop-color="${stroke}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${id}-g)"/>
    <path d="${line}" fill="none" stroke="${stroke}" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <line data-role="vline" y1="8" y2="${H}" stroke="${cssVar('--text-faint')}" stroke-width="1" stroke-dasharray="3,4" opacity="0"/>
    <circle data-role="dot" r="5" fill="${stroke}" stroke="#fff" stroke-width="2.5" opacity="0"/>`;
  const el = r => root.querySelector(`[data-role="${r}"]`);
  const dot = svg.querySelector('[data-role="dot"]'), vline = svg.querySelector('[data-role="vline"]');
  const arrow = trend === 'down' ? '↓' : trend === 'flat' ? '→' : '↑';
  const trendEl = el('trend');
  trendEl.textContent = `${arrow} ${Math.abs(pct).toFixed(1)}%`;
  trendEl.style.color = stroke;
  const deltaEl = el('delta');
  deltaEl.textContent = (last - prev >= 0 ? '+' : '−') + fmt(Math.abs(last - prev)).replace('£', '£');
  deltaEl.style.color = stroke;
  el('stats').innerHTML =
    `<span><b>${fmt(max)}</b> peak</span><span class="sep">·</span>` +
    `<span><b>${fmt(min)}</b> low</span><span class="sep">·</span>` +
    `<span><b>${fmt(series.reduce((a, b) => a + b, 0) / n)}</b> avg</span>`;
  const dateFor = i => new Date(Date.now() - (n - 1 - i) * 86400000)
    .toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  const setIdx = (i, scrub) => {
    i = Math.max(0, Math.min(n - 1, i));
    el('val').textContent = fmt(series[i]);
    el('date').textContent = dateFor(i) + (scrub ? '' : ' · latest');
    dot.setAttribute('cx', X(i)); dot.setAttribute('cy', Y(series[i]));
    vline.setAttribute('x1', X(i)); vline.setAttribute('x2', X(i));
    dot.setAttribute('opacity', 1); vline.setAttribute('opacity', scrub ? 1 : 0);
  };
  chart.onpointermove = e => {
    const r = chart.getBoundingClientRect();
    setIdx(Math.round((e.clientX - r.left) / r.width * (n - 1)), true);
  };
  chart.onpointerleave = () => setIdx(n - 1, false);
  setIdx(n - 1, false);
}

function hashName(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function traderProfile(name) {
  let s = hashName(name) || 1;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  const winRate = Math.round(52 + rnd() * 24);
  const wins = 9 + Math.floor(rnd() * 42), losses = 3 + Math.floor(rnd() * 23);
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  /* Hall of Fame champions banked seven figures — their profiles must agree */
  const CHAMPIONS = { Theo4: 1382400, Fredi9999: 1291150, swisstony: 1265800, Rudy: 1147695 };
  const winnings = CHAMPIONS[name] || Math.round(3000 + rnd() * rnd() * 900000);
  /* Cumulative prize curve — flat spells and jump wins, ending exactly at banked winnings */
  const raw = [0];
  for (let i = 1; i < 160; i++) raw.push(raw[i - 1] + Math.max(0, rnd() - 0.3) * (0.5 + rnd()));
  const endv = raw[159] || 1;
  const series = raw.map(v => Math.round(winnings * (0.05 + 0.95 * v / endv)));
  const formBars = Array.from({ length: 24 }, () => 0.1 + rnd() * 0.9);
  return {
    name, av: TRADER_AV[name] || name.charAt(0).toUpperCase(),
    tint: AV_TINTS[hashName(name) % AV_TINTS.length],

    following: 40 + Math.floor(rnd() * 900),
    big: Math.round(4000 + rnd() * rnd() * 900000),
    trades: 40 + Math.floor(rnd() * 4200),
    joined: months[hashName(name + 'm') % 12] + ' ' + (2023 + hashName(name + 'y') % 3),
    rank: 1 + hashName(name + 'r') % 200,
    views: (1 + rnd() * 60).toFixed(1) + 'K',
    tourShare: 0.55 + rnd() * 0.2,
    podiums: 2 + Math.floor(rnd() * 12),
    mediaRets: Array.from({ length: 6 }, () => (2 + rnd() * 40).toFixed(1)),
    winnings,
    winningsChange: Math.round(winnings * (0.04 + rnd() * 0.18)),
    tours: 4 + Math.floor(rnd() * 60), toursMonth: 1 + Math.floor(rnd() * 6),
    battlesMonth: 1 + Math.floor(rnd() * 5),
    formBars,
    hours: 40 + Math.floor(rnd() * 140),
    series,
    acts: Array.from({ length: 10 }, () => {
      const MK = ['BTC', 'ETH', 'NAS100', 'XAUUSD', 'EURUSD', 'GBPJPY'];
      const battle = rnd() < 0.25;
      const win = rnd() < winRate / 100;
      return {
        battle, win,
        dir: rnd() < 0.55 ? 'Long' : 'Short',
        market: battle ? 'vs ' + ['pip_titan', 'vol_king', 'nattyG', 'wickwizard', 'quantqueen'][Math.floor(rnd() * 5)] : MK[Math.floor(rnd() * 6)],
        amount: Math.round(Math.pow(10, 1.6 + rnd() * 3.2)),
        ago: 1 + Math.floor(rnd() * 420)
      };
    }),
    positions: Array.from({ length: Math.floor(rnd() * 3.4) }, () => {
      const MK = ['BTC', 'ETH', 'NAS100', 'XAUUSD', 'EURUSD', 'GBPJPY'];
      return {
        market: MK[Math.floor(rnd() * 6)],
        dir: rnd() < 0.55 ? 'Long' : 'Short',
        size: Math.round(500 + rnd() * 20000),
        pnl: Math.round((rnd() - 0.42) * 6000)
      };
    })
  };
}

function bindAwardTilt() {
  document.querySelectorAll('.award-badge:not(.locked)').forEach(el => {
    const tilt = el.querySelector('.award-tilt');
    el.addEventListener('pointermove', e => {
      const r = el.getBoundingClientRect();
      const rx = ((e.clientY - r.top) / r.height - 0.5) * -16;
      const ry = ((e.clientX - r.left) / r.width - 0.5) * 18;
      tilt.style.transform = `perspective(700px) rotateX(${rx.toFixed(1)}deg) rotateY(${ry.toFixed(1)}deg) scale(0.985)`;
    });
    el.addEventListener('pointerleave', () => { tilt.style.transform = 'perspective(700px)'; });
  });
}

function pickImage(maxW, cb) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, maxW / img.width);
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        cb(cv.toDataURL('image/jpeg', 0.82));
      };
      img.src = r.result;
    };
    r.readAsDataURL(f);
  };
  inp.click();
}

function drawCallout(cv) {
  const W = 1080, H = 1350;
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  const opp = inv.to, me = myProfile.name;
  const pot = '£' + (inv.stake * (1 + inv.odds)).toLocaleString('en-GB');
  /* soft light ground, one clean white card */
  x.fillStyle = '#eef0f5'; x.fillRect(0, 0, W, H);
  x.save();
  x.shadowColor = 'rgba(40, 40, 70, .10)'; x.shadowBlur = 60; x.shadowOffsetY = 24;
  x.fillStyle = '#ffffff';
  x.beginPath(); x.roundRect(70, 70, W - 140, H - 140, 48); x.fill();
  x.restore();
  x.strokeStyle = '#e9e7f2'; x.lineWidth = 2;
  x.beginPath(); x.roundRect(70, 70, W - 140, H - 140, 48); x.stroke();
  /* quiet mirrored corner inscriptions */
  const corner = flip => {
    x.save();

function oddsMult() {
  if (arenaB.oddsMode === 'preset') return B_ODDS[arenaB.odds] || 1;
  const t = (arenaB.oddsText || '').trim();
  if (/^\d+(\.\d+)?\s*:\s*\d+(\.\d+)?$/.test(t)) {
    const [a, b] = t.split(':').map(Number);
    return b ? a / b : 1;
  }
  const n = parseFloat(t);

document.addEventListener('mousemove', e => {
  const cards = document.querySelectorAll('.frost-card');
  if (!cards.length) return;
  cards.forEach(fc => {
    const inner = fc.querySelector('.frost-inner');
    if (!inner) return;
    const r = fc.getBoundingClientRect();
    const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    if (inside) {
      const ry = ((e.clientX - r.left) / r.width - 0.5) * 22;
      const rx = -((e.clientY - r.top) / r.height - 0.5) * 22;
      inner.style.transform = `rotateX(${rx.toFixed(1)}deg) rotateY(${ry.toFixed(1)}deg) scale(1.06)`;
    } else if (inner.style.transform) inner.style.transform = '';
  });
});

function barcodeSVG(value) {
  const hash = [...value].reduce((a2, c) => ((a2 << 5) - a2 + c.charCodeAt(0)) | 0, 0);
  const rnd2 = s2 => { const x = Math.sin(s2) * 10000; return x - Math.floor(x); };
  const bars = Array.from({ length: 60 }, (_, i2) => (rnd2(hash + i2) > 0.7 ? 2.5 : 1.5));
  const spacing = 1.5;
  const total = bars.reduce((a2, w) => a2 + w + spacing, -spacing);
  let x = (250 - total) / 2;
  const rects = bars.map(w => { const r = `<rect x="${x.toFixed(1)}" y="10" width="${w}" height="50"/>`; x += w + spacing; return r; }).join('');
  return `<svg width="250" height="70" viewBox="0 0 250 70" fill="currentColor" aria-hidden="true">${rects}</svg>`;
}

function settleBattleAccount(b) {
  if (!b.acctId) return 0;
  const ai = ACCTS.findIndex(a2 => a2.id === b.acctId);
  if (ai < 0) return 0;
  const wasActive = ai === term.acct;
  const finalBal = wasActive ? term.bal : ACCTS[ai].bal;
  const pnl = finalBal - ACCTS[ai].startBal;
  ACCTS.splice(ai, 1);
  if (wasActive) { term.acct = 0; term.bal = ACCTS[0].bal; term.pos = ACCTS[0].pos; }
  else if (term.acct > ai) term.acct--;
  if (term.acct === 0) { term.bal += pnl; ACCTS[0].bal = term.bal; } else ACCTS[0].bal += pnl;

}

const stISO = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
let pkStreak = [];
try { pkStreak = JSON.parse(localStorage.getItem('pkStreak') || '[]'); } catch (e2) { }
if (!pkStreak.length) {
  for (let k = 1; k <= 16; k++) pkStreak.push(stISO(Date.now() - k * 864e5));
  for (let k = 20; k < 140; k++) if ((k * 7919) % 10 < 6) pkStreak.push(stISO(Date.now() - k * 864e5));
}
let stkHowOpen = false;

function streakStats() {
  const set = new Set(pkStreak);
  let cur = 0, t = set.has(stISO(Date.now())) ? Date.now() : Date.now() - 864e5;
  while (set.has(stISO(t))) { cur++; t -= 864e5; }
  const dates = [...set].sort();
  let longest = 0, run = 0, prev = null;
  dates.forEach(ds => {
    run = prev && (new Date(ds) - new Date(prev) === 864e5) ? run + 1 : 1;
    longest = Math.max(longest, run);
    prev = ds;
  });
  return { cur, longest: Math.max(longest, cur), total: set.size, set };
}

function markStreak() {
  const today = stISO(Date.now());
  if (pkStreak.includes(today)) return;
  pkStreak.push(today);
  try { localStorage.setItem('pkStreak', JSON.stringify(pkStreak.slice(-420))); } catch (e2) { }
  const s2 = streakStats();
  toast(`Streak extended — day ${s2.cur} locked in`);
  addNotif('S', `Streak day ${s2.cur} locked in`, 'One qualifying action a day keeps it alive — miss a day and it resets to zero.');
}

function lbbList() {
  return Object.keys(TRADER_AV).map(n => {
    const p = traderProfile(n);

    const rnd = () => { s2 = (s2 * 16807) % 2147483647; return s2 / 2147483647; };

    const score = Math.min(99, Math.round(p.winRate * 0.72 + Math.min(28, p.winnings / 50000) + rnd() * 6));

function lbbSpark(series) {
  const pts = series.filter((_, i) => i % 4 === 0);
  const min = Math.min(...pts), max = Math.max(...pts);
  const W = 110, H = 30;
  const d = pts.map((v, i) => `${(i / (pts.length - 1) * W).toFixed(1)},${(H - 3 - (v - min) / ((max - min) || 1) * (H - 6)).toFixed(1)}`).join(' ');
  return `<span class="lbb-spark"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><polyline points="${d}" fill="none" stroke="var(--lbA)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg></span>`;
}

    let dd = ((i - exPos) % len + len) % len;
    if (dd > len / 2) dd -= len;
    const slot = dd + 3;
    if (slot < 0 || slot > 6) {
      el.style.transform = 'translateX(-50%) translateY(2rem) scale(0.3)';
      el.style.opacity = 0; el.style.zIndex = 0; el.style.pointerEvents = 'none';
      el.classList.remove('ctr'); el.removeAttribute('data-exgo');
      return;
    }
    const p2 = FAN_POS[slot];
    const t = `translateX(calc(-50% + ${(p2.x * mult).toFixed(1)}rem)) translateY(${(p2.y * 0.9).toFixed(1)}rem) rotate(${p2.rot}deg) scale(${p2.scale})`;
    el.dataset.t = t;
    el.style.transform = t;
    el.style.opacity = 1;
    el.style.zIndex = p2.z;
    el.style.pointerEvents = 'auto';
    el.classList.toggle('ctr', slot === 3);
    if (slot === 3) el.removeAttribute('data-exgo'); else el.setAttribute('data-exgo', i);
  });
  const duel = document.querySelector('[data-exduel]');
  if (duel) duel.textContent = `Challenge ${exOrder[exPos]} — set the date →`;
}

function exBind() {
  const wrap = document.getElementById('exFan');
  if (!wrap) return;
  let live = false, sx = 0, dx = 0, card = null;
  wrap.onpointerdown = e => {
    card = e.target.closest('.fan-card.ctr');
    if (!card) return;
    live = true; dx = 0; sx = e.clientX;
    card.style.transition = 'none';
  };
  wrap.onpointermove = e => {
    if (!live || !card) return;
    dx = e.clientX - sx;
    card.style.transform = `${card.dataset.t} translateX(${dx}px) rotate(${(dx * 0.05).toFixed(2)}deg)`;
    card.style.opacity = String(1 - Math.min(Math.abs(dx) / 340, 0.4));
  };
  const finish = () => {
    if (!live || !card) { live = false; return; }
    live = false;
    card.style.transition = '';
    if (Math.abs(dx) > 70) {
      wrap.addEventListener('click', ev => { ev.stopPropagation(); ev.preventDefault(); }, { capture: true, once: true });
      exDecide(Math.sign(dx));
    } else {
      card.style.transform = card.dataset.t;
      card.style.opacity = 1;
    }
    dx = 0; card = null;
  };
  wrap.onpointerup = finish;
  wrap.onpointercancel = finish;
  wrap.onpointerleave = finish;
}

function exDecide(dir) {
  const wrap = document.getElementById('exFan');
  const ctr = wrap?.querySelector('.fan-card.ctr');
  const n = exOrder[exPos];
  if (dir > 0 && !following.has(n)) { following.add(n); toast(`Following ${n} — their calls hit your feed`); }
  if (ctr) {
    ctr.style.transition = 'transform .28s ease, opacity .28s ease';
    ctr.style.transform = `${ctr.dataset.t} translateX(${dir * 440}px) rotate(${dir * 14}deg)`;
    ctr.style.opacity = 0;
  }
  setTimeout(() => {
    exPos = (exPos + 1) % exOrder.length;
    if (currentView === 'explore') renderExplore();
  }, 280);
}

function exGo(target) {

/* ---------------- Spectate — watching battles is a sport of its own ---------------- */

let spec = null;

function specSeries(end, seed) {
  let s = seed || 1;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  const pts = [0];
  for (let i = 1; i < 90; i++) pts.push(pts[i - 1] + (rnd() - 0.5) * 0.8);
  const drift = (end - pts[89]) / 89;
  return pts.map((v, i) => +(v + drift * i).toFixed(3));
}

function specLoadout(seed) {
  let s = seed || 1;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  const raw = Object.keys(INSTR).map(k => [k, 0.15 + rnd()]);
  const tot = raw.reduce((a, r) => a + r[1], 0);
  return raw.map(([k, v]) => [k, Math.round(v / tot * 100)]).sort((a, b) => b[1] - a[1]).slice(0, 4);
}

function specSquad(warSeed, avg, offset) {
  const pool = Object.keys(TRADER_AV);
  let s = warSeed;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  const picks = [];
  while (picks.length < 5) {
    const n = pool[Math.floor(rnd() * pool.length)];
    if (!picks.find(p => p.name === n)) picks.push({ name: n, ret: +(avg + (rnd() - 0.45) * 6).toFixed(2) });
  }
  return picks.sort((a, b) => b.ret - a.ret);
}

function openDuel(aName, bName, pot, watching, ra, rb) {
  const ha = hashName(aName), hb = hashName(bName);
  spec = {

    b: { name: bName, av: TRADER_AV[bName] || bName.charAt(0).toUpperCase(), tint: AV_TINTS[hb % AV_TINTS.length] },
    ra: ra ?? +(1 + (ha % 500) / 100).toFixed(2),
    rb: rb ?? +(1 + (hb % 500) / 100).toFixed(2),
    pot, watching: watching || 800 + ha % 9000, ends: '3h 12m',
    loadA: specLoadout(ha), loadB: specLoadout(hb),
  };
  spec.sa = specSeries(spec.ra, ha);
  spec.sb = specSeries(spec.rb, hb);
  navigate('spectate');
}

function openNation(i) {

function specChartSVG() {
  const box = document.getElementById('specChart');
  const W = Math.max(560, box ? box.clientWidth : 920), H = 262, padL = 16, padR = 64, padT = 20, padB = 30;
  const iw = W - padL - padR, ih = H - padT - padB;
  const all = spec.sa.concat(spec.sb);
  const min = Math.min(...all), max = Math.max(...all);
  const pad = (max - min) * 0.14 || 1;
  const lo = min - pad, hi = max + pad, rng = hi - lo;
  const X = (i2, n) => padL + i2 / (n - 1) * iw;
  const Y = v => padT + (1 - (v - lo) / rng) * ih;
  const path = sr => sr.map((v, i2) => `${i2 ? 'L' : 'M'}${X(i2, sr.length).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const A = lbCol('a'), B = lbCol('b');
  let grid = '';
  for (let g = 0; g <= 4; g++) {
    const v = lo + rng * g / 4, y = Y(v).toFixed(1);
    grid += `<line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" stroke="currentColor" opacity=".07" stroke-dasharray="2 7"/>`
      + `<text x="${W - padR + 10}" y="${+y + 3}" text-anchor="start" fill="currentColor" opacity=".4" font-size="9.5" font-family="ui-monospace,Menlo,monospace">${v.toFixed(1)}%</text>`;
  }
  /* name + live return pills pinned to the line ends — polymarket style */
  let ya = Y(spec.sa[spec.sa.length - 1]), yb = Y(spec.sb[Math.min(spec.sa.length, spec.sb.length) - 1]);
  if (Math.abs(ya - yb) < 26) { const mid = (ya + yb) / 2, d2 = ya <= yb ? 1 : -1; ya = mid - 13 * d2; yb = mid + 13 * d2; }
  const pill = (name, v, y, col) => {
    const label = `${name} ${fmtRet(v)}`;
    const w2 = label.length * 6.6 + 30;
    const x2 = W - padR - 16 - w2;
    const yy = Math.max(padT + 11, Math.min(H - padB - 11, y));
    return `<g><rect x="${x2.toFixed(1)}" y="${(yy - 11.5).toFixed(1)}" width="${w2.toFixed(1)}" height="23" rx="11.5" fill="var(--card)" stroke="currentColor" stroke-opacity=".13" filter="url(#spDot)"/>
      <rect x="${(x2 + 10).toFixed(1)}" y="${(yy - 5.5).toFixed(1)}" width="3.5" height="11" rx="1.75" fill="${col}"/>
      <text x="${(x2 + 20).toFixed(1)}" y="${(yy + 3.6).toFixed(1)}" font-size="10.5" font-weight="700" fill="currentColor" font-family="inherit">${label}</text></g>`;
  };
  const endDot = (sr, col) => `<circle cx="${X(sr.length - 1, sr.length).toFixed(1)}" cy="${Y(sr[sr.length - 1]).toFixed(1)}" r="4.5" fill="${col}" stroke="#fff" stroke-width="2" filter="url(#spDot)"/>`;
  let hover = '';
  if (spec.hov != null) {
    const n = spec.sa.length;
    const idx = Math.max(0, Math.min(n - 1, spec.hov));
    const hx = X(idx, n).toFixed(1);
    hover = `<line x1="${hx}" x2="${hx}" y1="${padT}" y2="${H - padB}" stroke="currentColor" opacity=".2"/>`
      + `<circle cx="${hx}" cy="${Y(spec.sa[idx]).toFixed(1)}" r="4.5" fill="${A}" stroke="#fff" stroke-width="2" filter="url(#spDot)"/>`
      + `<circle cx="${hx}" cy="${Y(spec.sb[Math.min(idx, spec.sb.length - 1)]).toFixed(1)}" r="4.5" fill="${B}" stroke="#fff" stroke-width="2" filter="url(#spDot)"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}">
    <defs><filter id="spDot" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="1" dy="2" stdDeviation="2.4" flood-color="rgba(0,0,0,.3)"/></filter></defs>
    ${grid}
    <path d="${path(spec.sa)}" fill="none" stroke="${A}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${path(spec.sb)}" fill="none" stroke="${B}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${endDot(spec.sa, A)}${endDot(spec.sb, B)}
    ${hover}
    ${pill(spec.a.name, spec.ra, ya, A)}${pill(spec.b.name, spec.rb, yb, B)}
    <text x="${padL}" y="${H - 8}" fill="currentColor" opacity=".35" font-size="8.5" font-family="ui-monospace,Menlo,monospace">KICK-OFF</text>
    <text x="${W - padR}" y="${H - 8}" text-anchor="end" fill="currentColor" opacity=".35" font-size="8.5" font-family="ui-monospace,Menlo,monospace">NOW</text>
  </svg>`;
}

function bindSpecChart() {
  const box = document.getElementById('specChart');
  if (!box) return;
  requestAnimationFrame(() => { if (document.getElementById('specChart')) box.innerHTML = specChartSVG(); });
  box.onpointermove = e => {
    if (!spec) return;
    const r = box.getBoundingClientRect();
    const frac = ((e.clientX - r.left) - 48) / (r.width - 68);
    spec.hov = Math.max(0, Math.min(spec.sa.length - 1, Math.round(frac * (spec.sa.length - 1))));
    box.innerHTML = specChartSVG();
    const tip = document.getElementById('specTip');
    if (tip) {
      const i2 = spec.hov;
      tip.innerHTML = `<div class="spt-r"><i style="background:${lbCol('a')}"></i>${spec.a.name}<b>${fmtRet(spec.sa[i2])}</b></div>
        <div class="spt-r"><i style="background:${lbCol('b')}"></i>${spec.b.name}<b>${fmtRet(spec.sb[Math.min(i2, spec.sb.length - 1)])}</b></div>`;
      const px = 48 + frac * (r.width - 68);
      tip.style.left = Math.min(Math.max(8, px + 14), r.width - 160) + 'px';
      tip.classList.add('on');
    }
  };
  box.onpointerleave = () => {
    if (spec) spec.hov = null;
    box.innerHTML = specChartSVG();
    document.getElementById('specTip')?.classList.remove('on');
  };
}

const SPEC_HYPE = ['let him cook', 'green not giving up', 'what a battle', 'this is closer than the chart says', 'stop hunting incoming, watch', 'size down champ', 'that fill was criminal', 'refresh, REFRESH', 'pot is life-changing money', 'called this last week', 'both playing it safe rn', 'someone send it already', 'volatility about to pick a winner', 'imagine fumbling this lead', 'textbook risk management honestly'];

function specTrade(lead) {
  const syms = Object.keys(INSTR);
  const sym = syms[Math.floor(Math.random() * syms.length)];
  const win = Math.random() < (lead ? 0.62 : 0.45);
  const amt = Math.round((20 + Math.random() * 480) * (win ? 1 : -0.6));
  return { sym, dir: Math.random() < 0.5 ? 'Long' : 'Short', win, amt, ago: 'now' };
}

function initSpecExtras() {

  for (let i = 0; i < 6; i++) {

  spec.x = {
    cheersA: 800 + Math.floor(Math.random() * 4000), cheersB: 800 + Math.floor(Math.random() * 4000),
    xpA: 12400 + Math.floor(Math.random() * 9000), xpB: 12400 + Math.floor(Math.random() * 9000),
    trA: 14 + Math.floor(Math.random() * 30), trB: 14 + Math.floor(Math.random() * 30),
    stA: 1 + Math.floor(Math.random() * 5), stB: 1 + Math.floor(Math.random() * 5),
    comments: seedC,
    feedA: Array.from({ length: 4 }, () => specTrade(true)),

}

const LB_WINDOWS = [['15m', 15], ['1h', 60], ['4h', 240], ['1d', 1440], ['1w', 10080], ['1M', 43200]];
const LB_POTS = [500, 1000, 2500, 5000, 10000, 25000, 50000, 100000, 250000, 1000000];

function lbSeed(b) {
  const seed = hashName(String(b.a) + String(b.b) + 'lb') || 1;
  b.sa = specSeries(b.ra, seed).slice(-40);
  b.sb = specSeries(b.rb, (seed * 23) % 2147483647 || 5).slice(-40);
  return b;
}

function genLiveBattle(kind) {
  const names = Object.keys(TRADER_AV);
  const [wl, wm] = LB_WINDOWS[Math.floor(Math.random() * LB_WINDOWS.length)];
  const pot = LB_POTS[Math.floor(Math.pow(Math.random(), 1.6) * LB_POTS.length)];
  const b = {
    kind, pot, window: wl, windowMin: wm,
    endsMin: Math.max(2, Math.floor(Math.random() * wm)),
    ra: +((Math.random() - 0.45) * 6).toFixed(2),
    rb: +((Math.random() - 0.45) * 6).toFixed(2),
    watching: Math.round(80 + Math.sqrt(pot) * (2 + Math.random() * 8)),
  };
  if (kind === 'clan') {
    const cs = [...CLANS].sort(() => Math.random() - 0.5);
    b.a = cs[0].id; b.b = cs[1] ? cs[1].id : cs[0].id;
  } else {
    const shuffled = [...names].sort(() => Math.random() - 0.5);
    b.a = shuffled[0]; b.b = shuffled[1];
  }
  return lbSeed(b);
}

const LIVE_B = [
  ...BATTLES.map(x => lbSeed({ kind: '1v1', a: x[0], b: x[2], pot: x[4], window: '1d', windowMin: 1440, endsMin: 200 + Math.floor(Math.random() * 800), ra: +((Math.random()) * 5).toFixed(2), rb: +((Math.random()) * 5).toFixed(2), watching: Math.round(parseFloat(x[5]) * 1000) })),
  ...Array.from({ length: 18 }, () => genLiveBattle('1v1')),
  ...(FEATURE_CLANS ? Array.from({ length: 6 }, () => genLiveBattle('clan')) : []),
];

const LB_DUR_L = { any: 'Any length', sprint: 'Sprint ≤1h', day: 'Intraday', week: 'Week+' };
const LB_SORT_L = { pot: 'Biggest pot', watch: 'Most watched', close: 'Closest fight', ends: 'Ending soon' };
const LB_POT_BANDS = { any: [0, 1e12], small: [0, 1000], mid: [1000, 10000], big: [10000, 100000], whale: [100000, 1e12] };
const LB_DUR_BANDS = { any: [0, 1e9], sprint: [0, 60], day: [61, 1440], week: [1441, 1e9] };

const lbEnds = m => { m = Math.max(1, Math.round(m)); return m < 60 ? m + 'm' : m < 1440 ? Math.round(m / 60) + 'h' : Math.round(m / 1440) + 'd'; };

function lbCol(side) {
  const dark = document.body.classList.contains('dark');
  return side === 'a' ? (dark ? '#D3C2F0' : '#6A2E9E') : '#94939F';
}

function lbName(b, side) {
  const id = side === 'a' ? b.a : b.b;
  if (b.kind === 'clan') { const c = clanById(id); return c ? c.name : String(id); }
  return String(id);
}

function lbStats(b) {
  let flips = 0, peak = 0;
  const n = Math.min(b.sa.length, b.sb.length);
  for (let k = 1; k < n; k++) {
    const d0 = b.sa[k - 1] - b.sb[k - 1], d1 = b.sa[k] - b.sb[k];
    if ((d0 >= 0) !== (d1 >= 0)) flips++;
    peak = Math.max(peak, Math.abs(d1));
  }
  return { flips, peak };
}

let LB_HOV = { i: -1, idx: null };

function lbFace(b, side) {
  const dot = `<i class="lb-sdot" style="background:${lbCol(side)}"></i>`;
  const id = side === 'a' ? b.a : b.b;
  if (b.kind === 'clan') {
    const c = clanById(id);
    return `<span class="lb-face">${dot}${c ? clanChip(c, true) : ''}<b>${c ? c.name : id}</b></span>`;
  }
  return `<span class="lb-face" data-trader="${id}" style="cursor:pointer">${dot}${avatarHTML(id, 'thread-av', '', 'width:26px;height:26px')}<b>${id}</b></span>`;
}

function smoothPath(pts) {
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
    const mx = ((x0 + x1) / 2).toFixed(1);
    d += ` C${mx},${y0.toFixed(1)} ${mx},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
  }
  return d;
}

function lbMiniSVG(b, W = 400, H = 150) {
  const padL = 42, padR = 14, padT = 12, padB = 10;
  const all = b.sa.concat(b.sb);
  const lo = Math.min(...all), hi = Math.max(...all), rng = (hi - lo) || 1;
  const iw = W - padL - padR, ih = H - padT - padB;
  const pts = sr => sr.map((v, i2) => [padL + i2 / (sr.length - 1) * iw, padT + (1 - (v - lo) / rng) * ih]);
  const lin = p2 => 'M' + p2.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' L');
  const A = lbCol('a'), B = lbCol('b');
  const pa = pts(b.sa), pb = pts(b.sb);
  const fid = 'lbd' + b.i;
  let grid = '';
  for (let g = 0; g <= 3; g++) {
    const gv = lo + rng * g / 3;
    const gy = (padT + (1 - g / 3) * ih).toFixed(1);
    grid += `<line x1="${padL}" x2="${W - padR}" y1="${gy}" y2="${gy}" stroke="currentColor" opacity=".09" stroke-dasharray="4 12"/>
      <text x="${padL - 7}" y="${gy}" text-anchor="end" alignment-baseline="middle" font-size="8.5" fill="currentColor" opacity=".4" font-family="ui-monospace,Menlo,monospace">${(gv >= 0 ? '+' : '') + gv.toFixed(1)}%</text>`;
  }
  const dot = (p2, col) => `<circle cx="${p2[p2.length - 1][0].toFixed(1)}" cy="${p2[p2.length - 1][1].toFixed(1)}" r="4" fill="${col}" stroke="var(--card)" stroke-width="2" filter="url(#${fid})"/>`;
  let hov = '';
  if (LB_HOV.i === b.i && LB_HOV.idx != null) {
    const ia = Math.min(LB_HOV.idx, pa.length - 1), ib = Math.min(LB_HOV.idx, pb.length - 1);
    hov = `<line x1="${pa[ia][0].toFixed(1)}" x2="${pa[ia][0].toFixed(1)}" y1="${padT}" y2="${H - padB}" stroke="${A}" opacity=".35"/>
      <circle cx="${pa[ia][0].toFixed(1)}" cy="${pa[ia][1].toFixed(1)}" r="4" fill="${A}" stroke="var(--card)" stroke-width="2" filter="url(#${fid})"/>
      <circle cx="${pb[ib][0].toFixed(1)}" cy="${pb[ib][1].toFixed(1)}" r="4" fill="${B}" stroke="var(--card)" stroke-width="2" filter="url(#${fid})"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><filter id="${fid}" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="1" dy="1.5" stdDeviation="1.8" flood-color="rgba(0,0,0,.3)"/></filter></defs>
    ${grid}
    <path d="${lin(pb)}" fill="none" stroke="${B}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${lin(pa)}" fill="none" stroke="${A}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    ${dot(pb, B)}${dot(pa, A)}
    ${hov}
  </svg>`;
}

/* render a hub chart at the container's real pixel size — no stretched text */
function lbChartInto(el, b, i) {

function lbSparkSVG(b) {
  const W = 120, H = 34, pad = 3;

  const pts = sr => sr.map((v, i2) => [pad + i2 / (sr.length - 1) * (W - pad * 2), pad + (1 - (v - lo) / rng) * (H - pad * 2)]);
  const lin = p2 => 'M' + p2.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' L');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${lin(pts(b.sb))}" fill="none" stroke="${lbCol('b')}" stroke-width="1.6" stroke-linejoin="round"/>

}

/* flip-card tilt — the active face follows the pointer, both sides */
document.addEventListener('pointermove', e => {
  const card = e.target.closest && e.target.closest('.bdg.flip');
  if (!card) return;
  const flipped = card.classList.contains('on');
  const face = card.querySelector(flipped ? '.flip-back' : '.flip-front');
  if (!face) return;
  const r = card.getBoundingClientRect();
  const ry = ((e.clientX - r.left) / r.width - 0.5) * 30;
  const rx = ((e.clientY - r.top) / r.height - 0.5) * -30;
  face.style.transform = `${flipped ? 'rotateY(180deg) ' : ''}rotateX(${rx.toFixed(1)}deg) rotateY(${ry.toFixed(1)}deg) scale(1.03)`;
});
document.addEventListener('pointerout', e => {
  const card = e.target.closest && e.target.closest('.bdg.flip');
  if (!card || (e.relatedTarget && card.contains(e.relatedTarget))) return;
  const f = card.querySelector('.flip-front');
  const b = card.querySelector('.flip-back');
  if (f) f.style.transform = '';
  if (b) b.style.transform = 'rotateY(180deg)';
});

  const el = e.target.closest && e.target.closest('[data-lbchart]');
  const tip = document.getElementById('lbTip');
  if (!el) {
    if (LB_HOV.i !== -1) {
      const prev = document.querySelector(`[data-lbchart="${LB_HOV.i}"]`);
      const pi = LB_HOV.i;
      LB_HOV = { i: -1, idx: null };
      if (prev && LIVE_B[pi] && LIVE_B[pi].sa) lbChartInto(prev, LIVE_B[pi], pi);
    }
    if (tip) tip.classList.remove('on');
    return;
  }
  const i = +el.dataset.lbchart;
  const b = LIVE_B[i];
  if (!b || !b.sa) return;
  const r = el.getBoundingClientRect();
  const t = Math.max(0, Math.min(1, ((e.clientX - r.left) - 42) / Math.max(1, r.width - 54)));
  const idx = Math.round(t * (b.sa.length - 1));
  if (LB_HOV.i !== i || LB_HOV.idx !== idx) {
    LB_HOV = { i, idx };
    lbChartInto(el, b, i);
  }
  if (tip) {
    tip.innerHTML = `<div class="spt-r"><i style="background:${lbCol('a')}"></i>${lbName(b, 'a')}<b>${fmtRet(b.sa[Math.min(idx, b.sa.length - 1)])}</b></div>

    tip.style.left = Math.min(e.clientX + 16, window.innerWidth - 190) + 'px';
    tip.style.top = (e.clientY - 16) + 'px';
    tip.classList.add('on');
  }
});

function wmSVG() {
  if (WM_SVG) return WM_SVG;
  const W = 800, H = 400;
  const px = (lat, lng) => [(lng + 180) * (W / 360), (90 - lat) * (H / 180)];
  const inPoly = (lng, lat, poly) => {
    let c = false;
    for (let a = 0, b = poly.length - 1; a < poly.length; b = a++) {
      const [x1, y1] = poly[a], [x2, y2] = poly[b];
      if (((y1 > lat) !== (y2 > lat)) && (lng < (x2 - x1) * (lat - y1) / (y2 - y1) + x1)) c = !c;
    }
    return c;
  };
  let dots = '';
  for (let lat = 74; lat >= -56; lat -= 2.4) for (let lng = -178; lng <= 178; lng += 2.4) {
    if (!WM_LAND.some(poly => inPoly(lng, lat, poly))) continue;
    const [dx, dy] = px(lat, lng);
    dots += `<circle cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="1.5"/>`;
  }
  const arcs = WM_ROUTES.map(([a, b], i) => {
    const [x1, y1] = px(...WM_CITIES[a]), [x2, y2] = px(...WM_CITIES[b]);
    const midX = (x1 + x2) / 2, midY = Math.min(y1, y2) - Math.max(34, Math.abs(x1 - x2) * 0.18);
    return `<path class="wm-arc" d="M ${x1.toFixed(0)} ${y1.toFixed(0)} Q ${midX.toFixed(0)} ${midY.toFixed(0)} ${x2.toFixed(0)} ${y2.toFixed(0)}" fill="none" stroke="url(#wmGrad)" stroke-width="1.3" pathLength="1" style="animation-delay:${(i * 0.35).toFixed(2)}s"/>`;
  }).join('');
  const pins = Object.entries(WM_CITIES).map(([k, [lat, lng]]) => {
    const [cx, cy] = px(lat, lng);
    return `<circle cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" r="2.4" fill="var(--lbA)"/>
      <circle cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" r="2.4" fill="var(--lbA)" opacity=".5">
        <animate attributeName="r" from="2.4" to="9" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from=".5" to="0" dur="1.6s" repeatCount="indefinite"/>
      </circle>`;
  }).join('');
  WM_SVG = `<svg viewBox="0 0 ${W} ${H}" aria-label="Live battles across the globe">
    <defs><linearGradient id="wmGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9081DF" stop-opacity="0"/>
      <stop offset=".12" stop-color="#9081DF"/>
      <stop offset=".85" stop-color="#D95DDF"/>
      <stop offset="1" stop-color="#D95DDF" stop-opacity="0"/>
    </linearGradient></defs>
    <g fill="var(--wm-dot)">${dots}</g>${arcs}${pins}</svg>`;
  return WM_SVG;
}

/* ---------------- Challenge detail — full terms + scout before you accept ---------------- */

let chSel = 0;

function chCurveSVG(series, W = 640, H = 200) {
  const padL = 50, padR = 14, padT = 14, padB = 12;
  const s = series.slice(-60);
  const lo = Math.min(...s), hi = Math.max(...s), rng = (hi - lo) || 1;
  const iw = W - padL - padR, ih = H - padT - padB;
  const pts = s.map((v, i) => [padL + i / (s.length - 1) * iw, padT + (1 - (v - lo) / rng) * ih]);
  const A = lbCol('a');
  let grid = '';
  for (let g = 0; g <= 3; g++) {
    const gv = lo + rng * g / 3;
    const gy = (padT + (1 - g / 3) * ih).toFixed(1);
    grid += `<line x1="${padL}" x2="${W - padR}" y1="${gy}" y2="${gy}" stroke="currentColor" opacity=".09" stroke-dasharray="4 12"/>
      <text x="${padL - 8}" y="${gy}" text-anchor="end" alignment-baseline="middle" font-size="9" fill="currentColor" opacity=".4" font-family="ui-monospace,Menlo,monospace">${fmtM(gv)}</text>`;
  }
  const d = 'M' + pts.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' L');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><filter id="chDot" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="1" dy="1.5" stdDeviation="1.8" flood-color="rgba(0,0,0,.3)"/></filter></defs>
    ${grid}
    <path d="${d}" fill="none" stroke="${A}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${pts[pts.length - 1][0].toFixed(1)}" cy="${pts[pts.length - 1][1].toFixed(1)}" r="4.5" fill="${A}" stroke="var(--card)" stroke-width="2" filter="url(#chDot)"/>
  </svg>`;
}

/* ---------------- Win reward (slide to claim) ---------------- */

let rewardEl = null;

function showReward(pot, opp) {
  if (rewardEl) return;
  const veil = document.createElement('div');
  veil.className = 'reward-veil';
  veil.innerHTML = `<div class="reward-card">
    <div class="reward-gift"><span class="rg-emoji">🏆</span></div>
    <div class="reward-title">You won the battle!</div>
    <div class="reward-sub">Your return beat <b>${opp}</b> when the window closed.<br>The escrowed pot is yours.</div>
    <div class="slide-track" id="slideTrack">
      <div class="slide-handle" id="slideHandle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <div class="slide-label" id="slideLabel">Slide to claim £${pot.toLocaleString('en-GB')}</div>
    </div>
    <button class="reward-skip" data-rskip>Claim later</button>
  </div>`;
  document.body.appendChild(veil);
  rewardEl = veil;
  const track = document.getElementById('slideTrack');
  const handle = document.getElementById('slideHandle');
  const labelEl = document.getElementById('slideLabel');
  let sx = 0, dx = 0, dragging = false;
  const maxX = () => track.clientWidth - handle.offsetWidth - 6;
  handle.addEventListener('pointerdown', e => {
    dragging = true; sx = e.clientX; dx = 0;
    handle.classList.add('dragging');
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', e => {
    if (!dragging) return;
    dx = Math.max(0, Math.min(maxX(), e.clientX - sx));
    handle.style.transform = `translateX(${dx}px)`;
    labelEl.style.opacity = Math.max(0, 1 - dx / 60);
  });
  handle.addEventListener('pointerup', () => {
    dragging = false;
    handle.classList.remove('dragging');
    if (dx > maxX() * 0.8) unlockReward(pot, opp);
    else { handle.style.transform = ''; labelEl.style.opacity = 1; }
    dx = 0;
  });
}

function unlockReward(pot, opp) {
  const card = rewardEl.querySelector('.reward-card');
  card.querySelector('.slide-track').outerHTML = `<div class="claim-strip" data-rclaim>
    <span><span class="claim-amt">+£${pot.toLocaleString('en-GB')} claimed</span>
      <span class="claim-sub" style="display:block">settled to your balance · tap to continue</span></span>
    <span class="claim-ic">🏆</span>
  </div>`;
  const skip = card.querySelector('.reward-skip');
  if (skip) skip.remove();
  card.querySelector('.reward-title').textContent = 'GG — pot secured';
  
  term.bal += pot;
  addNotif('W', 'Battle won — pot claimed', `+£${pot.toLocaleString('en-GB')} — you beat ${opp} and the escrow settled to your balance.`);
  fireConfetti();
}

function closeReward() {
  if (rewardEl) { rewardEl.remove(); rewardEl = null; }
}

function fireConfetti() {
  const c = document.createElement('canvas');
  c.id = 'confettiCanvas';
  document.body.appendChild(c);
  const ctx = c.getContext('2d');
  const W = c.width = window.innerWidth, H = c.height = window.innerHeight;
  const cols = ['#7c3aed', '#d946ef', '#10b981', '#f59e0b', '#3b82f6', '#ef4444'];
  const ps = Array.from({ length: 170 }, () => ({
    x: Math.random() * W, y: -30 - Math.random() * H * 0.4,
    w: 5 + Math.random() * 6, h: 8 + Math.random() * 8,
    r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
    vy: 2.2 + Math.random() * 3.4, vx: (Math.random() - 0.5) * 1.8,
    col: cols[(Math.random() * cols.length) | 0]
  }));
  let frames = 0;
  (function tick() {
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.col; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (++frames < 330) requestAnimationFrame(tick);
    else c.remove();
  })();
}
