<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QSigma — A New Standard in Wealth Management</title>
<meta name="description" content="Take full control of your assets with a unified platform for investing, tracking, and growing your portfolio in real time." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #F2F2F0;
    font-family: "Inter Tight", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* ---------- Hero shell ---------- */
  .hero {
    position: relative;
    min-height: 100vh;
    overflow: hidden;
    background: #F2F2F0;
  }
  .halo {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 80% 60% at 50% 30%, rgba(220,220,215,0.6) 0%, transparent 70%);
  }

  /* ---------- Navbar ---------- */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center;
    background: rgba(242,242,240,0.85);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    padding: 16px 40px;
  }
  .nav-logo {
    justify-self: start; text-decoration: none;
    font-weight: 700; font-size: 22px; letter-spacing: -0.5px;
    color: #05050C; line-height: 28px;
  }
  .nav-links { justify-self: center; display: flex; }
  .nav-links a {
    font-weight: 600; font-size: 13px; letter-spacing: 1.5px;
    color: #111111; padding: 8px 14px; text-decoration: none;
    transition: opacity 200ms;
  }
  .nav-links a:hover { opacity: 0.55; }
  .nav-right { justify-self: end; display: flex; align-items: center; gap: 16px; }
  .nav-lang { display: flex; align-items: center; gap: 8px; }
  .nav-lang svg { width: 16px; height: 16px; stroke: #111; }
  .nav-lang span { font-weight: 400; font-size: 13px; color: #111; }
  .cta {
    display: flex; align-items: center; gap: 8px;
    background: #111111; border: none; border-radius: 9999px;
    padding: 10px 20px; cursor: pointer; transition: background 200ms;
  }
  .cta:hover { background: #333333; }
  .cta-ring {
    width: 18px; height: 18px; border-radius: 9999px;
    background: rgba(255,255,255,0.20);
    display: flex; align-items: center; justify-content: center;
  }
  .cta-dot { width: 6px; height: 6px; border-radius: 9999px; background: #FFF; }
  .cta-label { font-weight: 600; font-size: 13px; color: #FFF; font-family: inherit; }
  @media (max-width: 767px) { .nav-links { display: none; } }
  @media (max-width: 639px) { .nav-lang { display: none; } }

  /* ---------- Text content ---------- */
  .content {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 90px 24px 0;
  }
  .eyebrow {
    font-weight: 500; font-size: 12px; color: rgba(0,0,0,0.50);
    margin-bottom: 12px;
    animation: blurUp16 0.6s ease-out 0.1s both;
  }
  .headline {
    font-weight: 500; font-size: 34px; letter-spacing: -1.36px; line-height: 1.05;
  }
  .headline .line1 {
    display: block; color: rgba(0,0,0,0.20);
    animation: blurUp24 0.7s ease-out 0.2s both;
  }
  .headline .line2 {
    display: block; color: #05050C;
    animation: blurUp24 0.7s ease-out 0.32s both;
  }
  .subhead {
    font-weight: 500; font-size: 14px; color: rgba(0,0,0,0.20);
    max-width: 460px; margin-top: 16px;
    animation: blurUp20 0.7s ease-out 0.45s both;
  }
  @media (min-width: 640px) {
    .content { padding-top: 110px; }
    .eyebrow { font-size: 13px; }
    .headline { font-size: 44px; }
    .subhead { font-size: 16px; }
  }
  @media (min-width: 768px) {
    .content { padding-top: 140px; }
    .eyebrow { font-size: 14px; margin-bottom: 16px; }
    .headline { font-size: 56px; }
    .subhead { font-size: 18px; margin-top: 20px; }
  }
  @media (min-width: 1024px) {
    .headline { font-size: 68px; line-height: 73.088px; }
  }

  @keyframes blurUp16 {
    from { opacity: 0; transform: translateY(16px); filter: blur(8px); }
    to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }
  @keyframes blurUp24 {
    from { opacity: 0; transform: translateY(24px); filter: blur(12px); }
    to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }
  @keyframes blurUp20 {
    from { opacity: 0; transform: translateY(20px); filter: blur(8px); }
    to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }

  /* ---------- Stones ---------- */
  .stone-wrap {
    position: absolute; bottom: 0; width: fit-content; cursor: crosshair;
  }
  .stone-wrap.left  { left: 0; }
  .stone-wrap.right { right: 0; }
  .stone-wrap img {
    display: block; height: 280px; width: auto;
    object-fit: contain; user-select: none; -webkit-user-drag: none;
  }
  @media (min-width: 640px)  { .stone-wrap img { height: 380px; } }
  @media (min-width: 768px)  { .stone-wrap img { height: 500px; } }
  @media (min-width: 1024px) { .stone-wrap img { height: 600px; } }
  @media (min-width: 1280px) { .stone-wrap img { height: 680px; } }
  .stone-wrap.left  img { object-position: left bottom; }
  .stone-wrap.right img { object-position: right bottom; }
  .stone-base { position: relative; }
  .stone-wrap.left  .stone-base { z-index: 1; animation: stoneInLeft 0.9s ease-out 0.5s both; }
  .stone-wrap.right .stone-base { z-index: 4; animation: stoneInRight 0.9s ease-out 0.5s both; }
  .stone-grass {
    position: absolute; inset: 0; pointer-events: none;
    -webkit-mask-image: radial-gradient(circle 0px at 50% 50%, black 0%, black 40%, transparent 100%);
    mask-image: radial-gradient(circle 0px at 50% 50%, black 0%, black 40%, transparent 100%);
  }
  .stone-wrap.left  .stone-grass { z-index: 2; }
  .stone-wrap.right .stone-grass { z-index: 5; }
  @keyframes stoneInLeft {
    from { opacity: 0; transform: translateX(-40px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes stoneInRight {
    from { opacity: 0; transform: translateX(40px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* ---------- Dashboard ---------- */
  .dash-outer {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 3;
    display: flex; justify-content: center; pointer-events: none;
  }
  .dash-inner {
    width: 92vw; max-width: 944px;
    animation: dashRise 1.0s cubic-bezier(0.22, 1, 0.36, 1) 0.6s both;
  }
  @media (min-width: 640px)  { .dash-inner { width: 72vw; } }
  @media (min-width: 768px)  { .dash-inner { width: 60vw; } }
  @media (min-width: 1024px) { .dash-inner { width: 54vw; } }
  .dash-inner img {
    display: block; width: 100%; height: auto; object-fit: contain;
    border-radius: 12px 12px 0 0;
    box-shadow: 0 -8px 80px rgba(0,0,0,0.12), 0 40px 120px rgba(0,0,0,0.10);
  }
  @keyframes dashRise {
    from { opacity: 0; transform: translateY(80px); filter: blur(8px); }
    to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }

  /* ---------- Bottom dark fade ---------- */
  .dark-fade {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 6;
    height: 220px; pointer-events: none;
    background: linear-gradient(to top, rgba(5,5,12,0.85) 0%, rgba(5,5,12,0.5) 40%, transparent 100%);
  }

  /* ---------- Scroll indicator ---------- */
  .scroll-hint {
    position: absolute; bottom: 10px; left: 0; right: 0; z-index: 20;
    margin: 0 auto; width: fit-content;
    display: flex; align-items: center; gap: 8px;
    animation: hintIn 0.6s ease-out 1.2s both, bob 2.5s ease-in-out 1.2s infinite;
  }
  .scroll-hint img {
    width: 14px; height: 14px;
    animation: spin 4s ease-in-out infinite;
  }
  .scroll-hint span {
    font-weight: 500; font-size: 14px; letter-spacing: -0.28px; color: #FFF;
  }
  @keyframes hintIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <h1 class="sr-only">QSigma — A New Standard in Wealth Management</h1>

  <section class="hero">
    <nav class="nav">
      <a class="nav-logo" href="/" aria-label="QSigma home">QSigma</a>
      <div class="nav-links">
        <a href="#">DASHBOARD</a>
        <a href="#">ASSETS</a>
        <a href="#">ANALYTICS</a>
        <a href="#">MARKETS</a>
      </div>
      <div class="nav-right">
        <div class="nav-lang">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
            <path d="M2 12h20"/>
          </svg>
          <span>English</span>
        </div>
        <button class="cta">
          <span class="cta-ring"><span class="cta-dot"></span></span>
          <span class="cta-label">Launch app</span>
        </button>
      </div>
    </nav>

    <div class="halo" aria-hidden="true"></div>

    <div class="content">
      <p class="eyebrow">Finance Reimagined</p>
      <h2 class="headline">
        <span class="line1">A New Standard</span>
        <span class="line2">in Wealth Management</span>
      </h2>
      <p class="subhead">Take full control of your assets with a unified platform for investing, tracking, and growing your portfolio in real time.</p>
    </div>

    <div class="stone-wrap left" data-stone>
      <img class="stone-base" src="https://qclay.design/lovable/synex/stone-left.png" alt="" draggable="false" />
      <img class="stone-grass" src="https://qclay.design/lovable/synex/stone-g-left.png" alt="" draggable="false" />
    </div>

    <div class="dash-outer">
      <div class="dash-inner">
        <img src="https://qclay.design/lovable/synex/Dashboard.png" alt="QSigma wealth management dashboard" />
      </div>
    </div>

    <div class="stone-wrap right" data-stone>
      <img class="stone-base" src="https://qclay.design/lovable/synex/stone-right.png" alt="" draggable="false" />
      <img class="stone-grass" src="https://qclay.design/lovable/synex/stone-g-right.png" alt="" draggable="false" />
    </div>

    <div class="dark-fade" aria-hidden="true"></div>

    <div class="scroll-hint">
      <img src="https://qclay.design/lovable/synex/star.svg" alt="" />
      <span>Scroll to explore</span>
    </div>
  </section>
</main>

<script>
  // Mossy reveal: spring-smoothed radial mask following the cursor
  // (spring stiffness 200, damping 25 — matches the Framer Motion config)
  document.querySelectorAll("[data-stone]").forEach((wrap) => {
    const grass = wrap.querySelector(".stone-grass");
    let x = 0, y = 0;
    let radius = 0, target = 0, velocity = 0;
    let rafId = null, lastT = null;

    const STIFFNESS = 200, DAMPING = 25;

    function tick(t) {
      if (lastT === null) lastT = t;
      const dt = Math.min((t - lastT) / 1000, 1 / 30);
      lastT = t;

      const accel = STIFFNESS * (target - radius) - DAMPING * velocity;
      velocity += accel * dt;
      radius += velocity * dt;

      const mask = `radial-gradient(circle ${radius}px at ${x}px ${y}px, black 0%, black 40%, transparent 100%)`;
      grass.style.webkitMaskImage = mask;
      grass.style.maskImage = mask;

      if (Math.abs(target - radius) > 0.05 || Math.abs(velocity) > 0.05) {
        rafId = requestAnimationFrame(tick);
      } else {
        radius = target; velocity = 0; rafId = null; lastT = null;
      }
    }

    function start() {
      if (rafId === null) { lastT = null; rafId = requestAnimationFrame(tick); }
    }

    wrap.addEventListener("mouseenter", () => { target = 120; start(); });
    wrap.addEventListener("mouseleave", () => { target = 0; start(); });
    wrap.addEventListener("mousemove", (e) => {
      const rect = wrap.getBoundingClientRect();
      x = e.clientX - rect.left;
      y = e.clientY - rect.top;
      start();
    });
  });
</script>
</body>
</html>
