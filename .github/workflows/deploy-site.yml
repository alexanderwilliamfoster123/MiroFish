# builds personal-site and publishes it to github pages.
# enable once in the repo: settings -> pages -> source: "github actions".
# to serve it on your own domain, see personal-site/DEPLOY.md.
name: deploy site

on:
  push:
    branches:
      - main
      - claude/liquid-metal-button-integration-kns1mx
    paths:
      - "personal-site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: personal-site/package-lock.json
      - name: install
        working-directory: personal-site
        run: npm ci
      - name: build
        working-directory: personal-site
        run: npm run build
      - name: custom domain
        working-directory: personal-site
        # set the CNAME repo variable (settings -> secrets and variables ->
        # actions -> variables) to your domain, e.g. alexanderfoster.com
        run: |
          if [ -n "${{ vars.CNAME }}" ]; then
            echo "${{ vars.CNAME }}" > dist/CNAME
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: personal-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
