    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://squaredq.com/#org",
          "name": "Squared³",
          "alternateName": "SquaredQ",
          "url": "https://squaredq.com/",
          "email": "info@squaredq.com",
          "description": "AI wealth management platform: subscribe to CPA-audited algorithmic trading strategies executed in your own brokerage account."
        },
        {
          "@type": "WebSite",
          "@id": "https://squaredq.com/#website",
          "url": "https://squaredq.com/",
          "name": "Squared³",
          "publisher": { "@id": "https://squaredq.com/#org" }
        },
        {
          "@type": "Product",
          "name": "Squared³ All Access",
          "description": "Lifetime access to every Squared³ algorithmic trading strategy, executed in your own Public.com, Alpaca, or Interactive Brokers account. US CPA-audited performance, no lock-ups.",
          "brand": { "@id": "https://squaredq.com/#org" },
          "offers": {
            "@type": "Offer",
            "price": "2497",
            "priceCurrency": "USD",
            "url": "https://squaredq.com/#pricing",
            "availability": "https://schema.org/InStock"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How does Squared³ actually work?",
              "acceptedAnswer": { "@type": "Answer", "text": "You subscribe once, connect the brokerage you already use — Public.com, Alpaca, or Interactive Brokers — and choose your strategies. Every trade executes directly in your own account and you can watch each position in real time." }
            },
            {
              "@type": "Question",
              "name": "Does Squared³ ever hold my money?",
              "acceptedAnswer": { "@type": "Answer", "text": "Never. Your capital stays in your own regulated US brokerage account at all times. Squared³ sends execution instructions to your account — we have no ability to withdraw, and you can disconnect with one click." }
            },
            {
              "@type": "Question",
              "name": "What does Squared³ cost?",
              "acceptedAnswer": { "@type": "Answer", "text": "One $2,497 onboarding fee for lifetime access to every strategy, then 0.50% of assets under management per month. No performance fees, no per-trade fees, every fee disclosed." }
            },
            {
              "@type": "Question",
              "name": "Are the returns real?",
              "acceptedAnswer": { "@type": "Answer", "text": "Every portfolio has run in a backtesting environment since January 2013, and live performance is audited by a US CPA. Each strategy factsheet carries an independent audit link." }
            },
            {
              "@type": "Question",
              "name": "What if I want out?",
              "acceptedAnswer": { "@type": "Answer", "text": "There are no lock-ups and no exit fees. Your money never left your brokerage, so leaving means disconnecting — your positions and cash are already yours." }
            }
          ]
        }
      ]
    }

hen handed to an auditor whose signature means something."]},{h:"Falsifiability is the product",p:["The audit links aren't a marketing flourish. They're the product working as designed: a system where you never have to take our word for anything — not performance, not fees, not custody. If a claim on this site ever fails your verification, we want to know about it more than you do."]}]},{slug:"inside-master-max",title:"Inside Master Max: anatomy of a flagship",dek:"A 33.3% CAGR with a −19% worst drawdown doesn't come from one big idea. It comes from hundreds of small ones, disciplined.",date:"Aug 4, 2026",tag:"Strategies",minutes:7,body:[{p:["Master Max is our growth flagship: 33.3% CAGR against QQQ since 2013, 17.9% volatility, a 1.70 Sharpe, and a worst drawdown of −19.0%. Those four numbers travel together — you can't understand one without the others."]},{h:"Where the return comes from",p:["Master Max is a regime-aware momentum system. It holds concentrated exposure to the strongest liquid growth names when the regime model reads risk-on, scales down as internals deteriorate, and rotates to defensive positioning rather than fighting a falling tape.","The edge isn't a secret indicator. It's the fusion layer: thousands of signal streams — market microstructure, positioning data, macro surprise indices, sentiment flows — compressed into a single conviction score that decides how much risk the book should carry today."]},{h:"Why the drawdown is the number we manage",p:["A strategy you abandon in month eleven has a real-world return of whatever you locked in when you quit. That's why the system's first job is keeping the worst month survivable. The −19% figure isn't luck; the risk layer cuts gross exposure mechanically as realized volatility climbs — no committee, no hesitation.","If you want the smoother ride, Master Portfolio runs the same machinery against SPY at roughly half the volatility. The monthly returns table for both is in the factsheet, every month since 2013, including the ugly ones."]}]},{slug:"self-custody-is-non-negotiable",title:"Self-custody is non-negotiable",dek:"The most important feature of Squared³ is the thing we can't do: touch your money.",date:"Jul 21, 2026",tag:"Custody",minutes:4,body:[{p:["Every few years the industry relearns the same lesson: platforms that pool client money eventually face a day when clients want it back at once. We designed Squared³ so that day can't exist.","Your capital never moves. It stays in your own account at Public.com, Alpaca, or Interactive Brokers — brokerages regulated in the United States, with the investor protections that come with that. Squared³ connects to your account with execution-only permissions: we can place the trades you've subscribed to, and that is the entire list of things we can do."]},{h:"What execution-only means in practice",p:["We cannot withdraw funds. We cannot change your bank links. We cannot see your credentials — the brokerage connection is made through the brokerage's own OAuth flow, and you can revoke it from your brokerage's settings page as well as ours.","Leaving Squared³ takes one click and zero transfers, because there's nothing to transfer back. Your positions and cash are already where they've always been: with you."]}]},{slug:"eleven-thousand-streams-one-trade",title:"How 11,000 signal streams become one trade",dek:"Satellite passes, dark-pool prints, central-bank language drift — and the fusion layer that turns noise into a position.",date:"Jul 7, 2026",tag:"Engineering",minutes:6,body:[{p:["The Squared³ core ingests more than 11,000 signal streams. Most of them are individually worthless. That's not a bug — it's the honest starting point of quantitative work: no single stream survives contact with the market for long."]},{h:"Three layers between data and a fill",p:["The scanning layer is planetary-scale and indiscriminate: satellite imagery of ports and parking lots, shipping manifests, power-grid draw, options skew, dark-pool
