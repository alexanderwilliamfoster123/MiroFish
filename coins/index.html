<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shiny coins</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Ccircle cx='8' cy='8' r='5' fill='none' stroke='%23ffc35c' stroke-width='1.4'/%3E%3Ccircle cx='8' cy='8' r='2.2' fill='%23ffc35c'/%3E%3C/svg%3E">
<style>
html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: rgba(235, 233, 228, 0.5);
  font-family: system-ui, sans-serif;
  font-size: 13px;
  letter-spacing: 0.06em;
}

#scene {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.status {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 24px;
  pointer-events: none;
  transition: opacity 0.6s ease;
}

.status.gone {
  opacity: 0;
}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<p class="status" id="status">loading…</p>
<script type="module">
// The user's Spline export ("shiny coins loop") on its own page:
// the vanilla Spline runtime is vendored locally, the scene streams
// from Spline's CDN exactly as their original Next.js export did.
import { Application } from "./vendor/spline/runtime.js";

// override with ?scene=<url or local file> if you ever swap the scene
const SCENE_URL = new URLSearchParams(location.search).get("scene")
  || "https://prod.spline.design/axM-a3i4zLUUEn54/scene.splinecode";

const statusEl = document.getElementById("status");
const app = new Application(document.getElementById("scene"));
app.load(SCENE_URL)
  .then(() => statusEl.classList.add("gone"))
  .catch((err) => {
    console.error(err);
    statusEl.textContent = "couldn’t reach the scene — check your connection and reload.";
  });
</script>
</body>
</html>
