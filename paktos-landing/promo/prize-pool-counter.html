<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paktos Prize Odometer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap">
<style>
  :root {
    --ink: #1d1d1f;
    --muted: #86868b;
    --hairline: #e8e8ed;
    --ground: #ffffff;
    --serif: "Playfair Display", "New York", ui-serif, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    /* drum geometry: 10 faces of 1em -> radius = 0.5em / tan(18deg) */
    --radius: 1.5388em;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
  }
  .stage {
    position: relative;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 40px 24px 36px;
    box-sizing: border-box;
  }
  .live {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.35em;
    text-indent: 0.35em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.25; transform: scale(0.72); }
  }

  .centerpiece {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(34px, 5vh, 52px);
  }

  /* ——— The glass odometer ——— */
  .drum {
    position: relative;
    z-index: 0;
    font-family: var(--serif);
    font-weight: 500;
    font-variant-numeric: lining-nums;
    font-size: clamp(40px, 9.2vw, 112px);
    line-height: 1;
    display: flex;
    align-items: center;
    gap: 0.09em;
    white-space: nowrap;
  }
  .dollar {
    font-size: 0.72em;
    margin-right: 0.1em;
    background: linear-gradient(to bottom, #4a4a4f, #131315);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .comma {
    position: relative;
    z-index: 7;
    font-size: 0.9em;
    margin: 0 0.02em;
    transform: translateY(0.26em);
    background: linear-gradient(to bottom, #4a4a4f, #131315);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* one frosted-glass capsule per digit drum */
  .reel {
    position: relative;
    width: 0.82em;
    height: 1.38em;
    border-radius: 0.17em;
    background: linear-gradient(to bottom, rgba(255, 255, 255, 0.92), rgba(243, 243, 247, 0.55));
    border: 1px solid rgba(29, 29, 31, 0.1);
    box-shadow:
      0 0.32em 0.6em -0.28em rgba(29, 29, 31, 0.35),
      0 0.05em 0.12em rgba(29, 29, 31, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 1),
      inset 0 -0.09em 0.18em rgba(29, 29, 31, 0.06);
    overflow: hidden;
  }
  /* curvature shading inside the glass: the drum recedes top and bottom */
  .reel::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.95) 0%,
      rgba(29, 29, 31, 0.07) 9%,
      rgba(255, 255, 255, 0) 32%,
      rgba(255, 255, 255, 0) 68%,
      rgba(29, 29, 31, 0.09) 92%,
      rgba(255, 255, 255, 0.9) 100%
    );
  }
  /* standing specular streak on the glass face */
  .reel::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background:
      linear-gradient(105deg, rgba(255, 255, 255, 0) 18%, rgba(255, 255, 255, 0.55) 26%, rgba(255, 255, 255, 0) 34%),
      linear-gradient(105deg, rgba(255, 255, 255, 0) 68%, rgba(255, 255, 255, 0.35) 76%, rgba(255, 255, 255, 0) 84%);
  }
  .window {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 6em;
    overflow: hidden;
    transform: translateZ(0); /* flattening boundary so the 3D drum clips here */
    border-radius: 0.17em;
  }
  .cyl {
    position: relative;
    margin-top: -0.05em;
    width: 0.82em;
    height: 1em;
    transform-style: preserve-3d;
    transition: transform 1600ms cubic-bezier(0.24, 0.74, 0.18, 1);
    will-change: transform;
  }
  .cyl > b {
    position: absolute;
    inset: 0;
    height: 1em;
    line-height: 1;
    font-weight: 500;
    text-align: center;
    backface-visibility: hidden;
    background: linear-gradient(to bottom, #4a4a4f, #131315);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* white cover plates catch the drum faces that spill past the glass */
  .drum .cover {
    position: absolute;
    left: -4%;
    right: -4%;
    height: 0.55em;
    z-index: 6;
    pointer-events: none;
  }
  .drum .cover.top { bottom: calc(100% - 0.01em); height: 1.1em; background: linear-gradient(to top, #fff 72%, rgba(255,255,255,0)); }
  .drum .cover.bot { top: calc(100% - 0.01em); height: 0.6em; background: linear-gradient(to bottom, #fff 70%, rgba(255,255,255,0)); }
  /* soft ground shadow painted over the cover so the drums still sit on a floor */
  .drum .floor {
    position: absolute;
    top: calc(100% + 0.08em);
    left: 1%;
    right: 1%;
    height: 0.22em;
    z-index: 8;
    pointer-events: none;
    background: radial-gradient(closest-side, rgba(29, 29, 31, 0.16), rgba(29, 29, 31, 0) 78%);
    filter: blur(2px);
  }

  .cyl > b { transition: opacity 300ms ease; }
  .cyl > b.off { opacity: 0; }

  /* slow polish sweep travelling across all the drums */
  .sheen {
    position: absolute;
    inset: -4% -8%;
    z-index: 4;
    pointer-events: none;
    background: linear-gradient(100deg, rgba(255, 255, 255, 0) 42%, rgba(255, 255, 255, 0.7) 50%, rgba(255, 255, 255, 0) 58%);
    transform: translateX(-120%);
    animation: sweep 7.5s ease-in-out infinite;
  }
  @keyframes sweep {
    0%, 55% { transform: translateX(-120%); }
    85%, 100% { transform: translateX(120%); }
  }

  /* the seventh drum rolls in when the pool crosses a million */
  .mgroup {
    display: inline-flex;
    align-items: center;
    gap: 0.09em;
    max-width: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-width 1400ms cubic-bezier(0.24, 0.74, 0.18, 1), opacity 900ms ease 350ms;
  }
  .mgroup.on { max-width: 1.4em; opacity: 1; }

  .caption {
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.35em;
    text-indent: 0.35em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .caption::before, .caption::after {
    content: "";
    width: 44px;
    height: 1px;
    background: var(--hairline);
  }

  .chipzone { height: 30px; display: flex; align-items: center; }
  .chip {
    font-size: 12px;
    font-weight: 500;
    color: #fff;
    background: var(--ink);
    border-radius: 999px;
    padding: 7px 16px;
    letter-spacing: 0.02em;
    opacity: 0;
    transform: translateY(6px) scale(0.96);
    transition: opacity 450ms ease, transform 450ms cubic-bezier(0.2, 0.9, 0.3, 1.2);
  }
  .chip.show { opacity: 1; transform: translateY(0) scale(1); }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .brand img { width: 26px; height: 26px; display: block; }
  .brand-name {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.55em;
    text-indent: 0.55em;
    color: var(--ink);
  }

  canvas#confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    .cyl, .mgroup { transition: none; }
    .live-dot { animation: none; }
    .sheen { animation: none; }
  }
</style>

</head>

<script>
  "use strict";

  // ——— Simulated ticket sales ———
  // Wire to the real sales stream when it exists: each event adds its
  // ticket value to the pool.
  var START = 992600;
  var TICKET = 25;
  var reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ——— The reels: ten-sided glass drums that only roll forward ———
  // Each digit face sits on a cylinder; the cylinder's rotation only ever
  // increases, so 9 -> 0 rolls onward through the wrap like a real odometer.
  var reels = [];
  document.querySelectorAll(".reel").forEach(function (reel) {
    var cyl = reel.querySelector(".cyl");
    for (var d = 0; d <= 9; d++) {
      var face = document.createElement("b");
      face.textContent = d;
      face.style.transform = "rotateX(" + (-d * 36) + "deg) translateZ(var(--radius))";
      cyl.appendChild(face);
    }
    cyl.style.transform = "scale(0.7435) rotateX(0deg)";
    reels[+reel.dataset.i] = { cyl: cyl, faces: [].slice.call(cyl.children), digit: 0, turns: 0, vt: 0 };
  });

  // While resting, only the front face and its two neighbours render, so
  // nothing paints far outside the glass. During a roll, every face on the
  // path stays visible until the drum settles.
  function settleVis(reel) {
    for (var f = 0; f < 10; f++) {
      var off = (f - reel.digit + 10) % 10;
      reel.faces[f].classList.toggle("off", !(off === 0 || off === 1 || off === 9));
    }
  }

  function moveReel(reel, digit) {
    var steps = (digit - reel.digit + 10) % 10;
    if (!steps) return;
    for (var i = -1; i <= steps + 1; i++) {
      reel.faces[(reel.digit + i + 20) % 10].classList.remove("off");
    }
    reel.turns += steps;
    reel.digit = digit;
    reel.cyl.style.transform = "scale(0.7435) rotateX(" + reel.turns * 36 + "deg)";
    clearTimeout(reel.vt);
    reel.vt = setTimeout(function () { settleVis(reel); }, 1750);
  }

  var mgroup = document.getElementById("mgroup");
  function render(value) {
    var s = String(Math.min(value, 9999999)).padStart(7, "0");
    for (var i = 0; i < 7; i++) moveReel(reels[i], +s[i]);
    if (value >= 1000000) mgroup.classList.add("on");
  }

  // ——— Confetti, in the six coin colours ———
  var COLORS = ["#5ad0f5", "#3f6df4", "#f7cf45", "#f79a4d", "#f78ec1", "#232a56"];
  var canvas = document.getElementById("confetti");
  var ctx = canvas.getContext("2d");
  var pieces = [];
  var raf = 0;

  function fit() {
    var dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fit();
  addEventListener("resize", fit);

  function spawn(n, x, y, angle, spread) {
    for (var i = 0; i < n; i++) {
      var a = angle + (Math.random() - 0.5) * spread;
      var speed = 520 + Math.random() * 620;
      pieces.push({
        x: x, y: y,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed,
        w: 5 + Math.random() * 6,
        h: 8 + Math.random() * 8,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 14,
        color: COLORS[(Math.random() * COLORS.length) | 0],
        round: Math.random() < 0.25,
        life: 0,
        ttl: 2.2 + Math.random() * 1.4
      });
    }
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(step); }
  }

  var last = 0;
  function step(now) {
    var dt = Math.min((now - last) / 1000, 0.032);
    last = now;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (var i = pieces.length - 1; i >= 0; i--) {
      var p = pieces[i];
      p.life += dt;
      if (p.life > p.ttl || p.y > innerHeight + 40) { pieces.splice(i, 1); continue; }
      p.vy += 1350 * dt;
      p.vx *= 0.992;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      var fade = p.ttl - p.life < 0.5 ? (p.ttl - p.life) / 0.5 : 1;
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.round) {
        ctx.beginPath();
        ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // a slight fold down the middle so pieces flutter like paper
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * (0.55 + 0.45 * Math.abs(Math.sin(p.rot * 2))));
      }
      ctx.restore();
    }
    if (pieces.length) raf = requestAnimationFrame(step);
    else { raf = 0; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  function cannons(scale) {
    if (reduceMotion) return;
    var n = Math.round(70 * scale);
    spawn(n, -10, innerHeight * 0.78, -Math.PI / 3.4, 0.65);
    spawn(n, innerWidth + 10, innerHeight * 0.78, Math.PI / 3.4 - Math.PI, 0.65);
  }

  // ——— Milestone chip + announcements ———
  var chip = document.getElementById("chip");
  var announcer = document.getElementById("announcer");
  var chipTimer = 0;
  function milestone(text, hold) {
    chip.textContent = text;
    chip.classList.add("show");
    clearTimeout(chipTimer);
    chipTimer = setTimeout(function () { chip.classList.remove("show"); }, hold);
    announcer.textContent = "Prize pool " + text;
  }

  var fmt = new Intl.NumberFormat("en-US");

  // ——— The pool ———
  var pool = START;
  render(pool);
  reels.forEach(settleVis);

  function tick() {
    var before = pool;
    pool += TICKET * (3 + ((Math.random() * 15) | 0)); // $75–$450 per beat
    render(pool);

    var crossedM = before < 1000000 && pool >= 1000000;
    var crossedK = Math.floor(pool / 1000) > Math.floor(before / 1000);
    if (crossedM) {
      milestone("$1,000,000", 6000);
      cannons(2.6);
      setTimeout(function () { cannons(2.2); }, 450);
      setTimeout(function () { cannons(1.8); }, 950);
    } else if (crossedK) {
      milestone("$" + fmt.format(Math.floor(pool / 1000) * 1000), 2400);
      cannons(1);
    }
    setTimeout(tick, 1250 + Math.random() * 1450);
  }
  setTimeout(tick, 1300);
</script>
</body>
</html>
