    closeInvite();
    showCallout();
    toast(`Duel invite sent to ${inv.to} — £${(inv.stake * (1 + inv.odds)).toLocaleString('en-GB')} pot at ${inv.odds}:1, kick-off ${inv.start}`);
    addNotif('VS', `Duel invite sent to ${inv.to}`, `£${inv.stake.toLocaleString('en-GB')} vs £${(inv.stake * inv.odds).toLocaleString('en-GB')} · ${inv.market} · kick-off ${inv.start}. You'll be notified when they accept.`);
    if (currentView === 'arena') renderArena();
    return;
  }
  if ((el = q('[data-mbattle]'))) {
    const m = MACHINES[+el.dataset.mbattle];
    openTerms({
      opp: m.name, machine: true, mic: m.ic, mtint: m.tint,
      market: 'All markets', window: m.window + ' window', kick: 'Now',
      theirStake: m.house, yourStake: m.you, pot: m.you + m.house,
      winnerTakes: Math.round((m.you + m.house) * 0.9),
      watching: 900 + Math.floor(Math.random() * 2400),
      oddsLine: `The house backed ${m.name} with £${m.house} — you only put up £${m.you} for a shot at the full pot.`
    });
    return;
  }
  if ((el = q('[data-clanopen]'))) {
    clanDraft = { name: '', tag: '', tint: 0, members: ['Theo4'] };
    if (!document.getElementById('clanVeil')) {
      const v = document.createElement('div'); v.className = 'pk-veil'; v.id = 'clanVeil';
      document.body.appendChild(v);
    }
    return renderClanModal();
  }
  if ((el = q('[data-clantint]'))) { stashClanInputs(); clanDraft.tint = +el.dataset.clantint; return renderClanModal(); }
  if ((el = q('[data-claninv]'))) {
    stashClanInputs();
    const n = el.dataset.claninv;
    clanDraft.members.includes(n) ? clanDraft.members.splice(clanDraft.members.indexOf(n), 1) : clanDraft.members.push(n);
    return renderClanModal();
  }
  if ((el = q('[data-clancreate]'))) {
    stashClanInputs();
    const name = clanDraft.name.trim(), tag = clanDraft.tag.trim().toUpperCase();
    if (!name || tag.length < 2) return toast('Give your clan a name and a 2–4 letter tag');
    if (clanById(tag)) return toast('That tag is taken — pick another');
    CLANS.unshift({ id: tag, name, tint: clanDraft.tint, members: ['jstone', ...clanDraft.members], wins: 0, losses: 0, winnings: 0, desc: 'Founded today — the ladder awaits.' });
    myClan = tag;
    try { localStorage.setItem('pkClan', tag); } catch (e) { }
    document.getElementById('clanVeil')?.remove();
    toast(`${name} [${tag}] founded — ${clanDraft.members.length + 1} traders under the banner`);
    addNotif('CL', `Clan founded — ${name}`, `${clanDraft.members.length + 1} traders recruited. Call out any clan on the ladder to start a war.`);
    return renderArena();
  }
  if ((el = q('[data-clanclose]'))) return document.getElementById('clanVeil')?.remove();
  if ((el = q('[data-clanjoin]'))) {
    const c = clanById(el.dataset.clanjoin);
    if (!c) return;
    myClan = c.id;
    try { localStorage.setItem('pkClan', c.id); } catch (e) { }
    if (!c.members.includes('jstone')) c.members.push('jstone');
    toast(`Joined ${c.name} [${c.id}] — welcome to the crew`);
    addNotif('CL', `Joined ${c.name}`, `You fly the ${c.id} banner now. Clan battles count your return toward the squad average.`);
    return renderArena();
  }
  if ((el = q('[data-clanleave]'))) {
    const c = clanById(myClan);
    if (c) c.members = c.members.filter(m => m !== 'jstone');
    myClan = null;
    try { localStorage.removeItem('pkClan'); } catch (e) { }
    toast('Left the clan — free agent again');
    return renderArena();
  }
  if ((el = q('[data-clanbattle]'))) {
    const opp = clanById(el.dataset.clanbattle), mine = clanById(myClan);
    if (!opp || !mine) return;
    const pot = (mine.members.length + opp.members.length) * 2500;
    CLAN_WARS.unshift({ a: mine.id, b: opp.id, ra: 0, rb: 0, pot, ends: '24h', watching: 200 + Math.floor(Math.random() * 800) });
    toast(`Clan war declared — ${mine.name} vs ${opp.name}, £${pot.toLocaleString('en-GB')} pot over 24h`);
    addNotif('CL', `Clan war: ${mine.id} vs ${opp.id}`, `£${pot.toLocaleString('en-GB')} pot · 24h window · squad average return takes it. Rally the crew.`);
    return renderArena();
  }
  if ((el = q('[data-lbkind]'))) { lbf.kind = el.dataset.lbkind; return renderLive(); }
  if ((el = q('[data-lbmenu]'))) { lbMenu = lbMenu === el.dataset.lbmenu ? null : el.dataset.lbmenu; return renderLive(); }
  if ((el = q('[data-lbpot]'))) { lbf.pot = el.dataset.lbpot; lbMenu = null; return renderLive(); }
  if ((el = q('[data-lbdur]'))) { lbf.dur = el.dataset.lbdur; lbMenu = null; return renderLive(); }
  if ((el = q('[data-lbsort]'))) { lbf.sort = el.dataset.lbsort; lbMenu = null; return renderLive(); }
  if ((el = q('[data-lbview]'))) { lbf.view = el.dataset.lbview; return renderLive(); }
  if ((el = q('[data-lbwatch]'))) {
    const face = e.target.closest('[data-trader]');
    if (face) return openTrader(face.dataset.trader);
    const b = LIVE_B[+el.dataset.lbwatch];
    if (!b) return;
    if (b.kind === 'clan') openClanWarObj({ a: b.a, b: b.b, ra: b.ra, rb: b.rb, pot: b.pot, ends: lbEnds(b.endsMin), watching: b.watching }, -1);
    else openDuel(b.a, b.b, b.pot, b.watching, b.ra, b.rb);
    if (spec && b.sa) { spec.sa = [...b.sa]; spec.sb = [...b.sb]; }
    return;
  }
  if ((el = q('[data-clanview]'))) return openClan(el.dataset.clanview);
  if ((el = q('[data-cheer]'))) {
    if (!spec || !spec.x) return;
    const a = el.dataset.cheer === 'a';
    if (a) spec.x.cheersA += 25; else spec.x.cheersB += 25;
    setOdo(a ? 'specChA' : 'specChB', (a ? spec.x.cheersA : spec.x.cheersB).toLocaleString('en-GB'));
    return;
  }
  if ((el = q('[data-sayspec]'))) {
    const inp = document.getElementById('specSay');
    if (!inp || !inp.value.trim() || !spec?.x) return;
    const c = [myProfile.name, inp.value.trim()];
    spec.x.comments.unshift(c);
    inp.value = '';
    document.getElementById('specComments')?.insertAdjacentHTML('afterbegin', specCommentRow(c));
    return;
  }
  if ((el = q('[data-cwspec]'))) return openClanWar(+el.dataset.cwspec);
  if ((el = q('[data-njoin]'))) {
    const w = NATION_WARS[+el.dataset.njoin];
    if (!w || w.joined || w.aIn >= w.size) return;
    w.aIn++;
    w.joined = true;
    toast(`You're in — ${w.a[1]} squad, ${w.size}v${w.size} vs ${w.b[1]}. Trade well for your flag.`);
    addNotif('NW', `Joined the ${w.a[1]} squad`, `${w.size}v${w.size} nation war vs ${w.b[1]} · £${w.pot.toLocaleString('en-GB')} pot · ends ${w.ends}. Your return now counts toward the squad average.`);
    return renderArena();
  }
  if ((el = q('[data-spectate]'))) {
    const b = BATTLES[+el.dataset.spectate];
    if (b) openDuel(b[0], b[2], b[4], Math.round(parseFloat(b[5]) * 1000));
    return;
  }
  if ((el = q('[data-bshare]'))) {
    const b = myBattles[+el.dataset.bshare];
    if (!b) return;
    document.getElementById('escVeil')?.remove();
    return showBattleShare(b);
  }
  if ((el = q('[data-bsdl]'))) {
    const cv = document.getElementById('bsCanvas');
    if (!cv) return;
    const a = document.createElement('a');
    a.href = cv.toDataURL('image/png');
    a.download = `paktos-battle-${myBattles[+el.dataset.bsdl]?.opp || 'live'}.png`;
    a.click();
    return toast('Battle card downloaded — post it everywhere');
  }
  if ((el = q('[data-bsx]'))) {
    const b = myBattles[+el.dataset.bsx];
    if (!b) return;
    const tag = b.machine ? b.opp : '@' + b.opp;
    window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(`Live battle vs ${tag} on Paktos — £${b.pot.toLocaleString('en-GB')} frozen in escrow, I'm at ${(b.my >= 0 ? '+' : '') + b.my.toFixed(2)}%. Watch it live: https://${partner.link}`), '_blank');
    return toast('Opening X — attach the downloaded card for the full flex');
  }
  if ((el = q('[data-bsclose]'))) return document.getElementById('bsVeil')?.remove();
  if ((el = q('[data-bspec]'))) {
    const b = myBattles[+el.dataset.bspec];
    if (b) openDuel('jstone', b.opp, b.pot, b.watching, b.my, b.op);
    return;
  }
  if ((el = q('[data-nwopen]'))) return openNation(+el.dataset.nwopen);
  if ((el = q('[data-histshare]'))) {
    const [who, opp, pot, won] = el.dataset.histshare.split('|');
    window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(
      +won
        ? `${who} took £${(+pot * 0.9).toLocaleString('en-GB')} off @${opp} in a Paktos battle — £${(+pot).toLocaleString('en-GB')} pot, settled on verified returns. https://${partner.link}`
        : `${who} vs @${opp} on Paktos — £${(+pot).toLocaleString('en-GB')} pot settled on verified returns. Run it back: https://${partner.link}`), '_blank');
    return toast('Opening X — result ready to post');
  }
  if ((el = q('[data-duel]'))) {
    const [a, b, pot] = el.dataset.duel.split('|');
    return openDuel(a, b, +pot || 5000);
  }
  if ((el = q('[data-worldall]'))) {
    const m = document.getElementById('worldMore');
    if (!m) return;
    const open = m.style.display === 'none';
    m.style.display = open ? 'block' : 'none';
    el.querySelector('span').textContent = open ? 'Show less' : 'Show all countries';
    el.classList.toggle('open', open);
    return;
  }
  if ((el = q('[data-nreg]'))) {
    const more = document.querySelector(`[data-nmore="${el.dataset.nreg}"]`);
    if (!more) return;
    const open = more.classList.toggle('open');
    el.classList.toggle('open', open);
    el.querySelector('span').textContent = open ? 'Show less' : 'Show all';
    return;
  }
  if ((el = q('[data-accept]'))) {
    const c = challenges[+el.dataset.accept];
    if (!c) return;
    const yourStake = Math.round(c.pot * (c.odds || 1));
    openTerms({
      ref: c, opp: c.name, av: c.av, tint: AV_TINTS[battleSeq % 6],
      market: c.market, window: c.window, kick: 'On accept',
      theirStake: c.pot, yourStake, pot: c.pot + yourStake,
      winnerTakes: Math.round((c.pot + yourStake) * 0.9),
      oddsLine: c.odds && c.odds !== 1
        ? `${c.name} set 1:${c.odds} odds — you put up ${c.odds}× their stake to enter.`
        : 'Even-money battle — both sides stake the same.'
    });
    return;
  }
  if ((el = q('[data-watch]'))) {
    const b = BATTLES[0];
    return openDuel(b[0], b[2], b[4], Math.round(parseFloat(b[5]) * 1000));
  }
  if ((el = q('[data-ptx]'))) {
    window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(`I earn 20% for the lifetime of every trader I bring to Paktos — trading battles with real pots. Join me: https://${partner.link}`), '_blank');
    return toast('Opening X — your referral post is prefilled');
  }
  if ((el = q('[data-ptwa]'))) {
    window.open('https://wa.me/?text=' + encodeURIComponent(`Join me on Paktos — head-to-head trading battles, tournaments and real pots. My link: https://${partner.link}`), '_blank');
    return toast('Opening WhatsApp — your invite message is ready');
  }
  if ((el = q('[data-ptcode]'))) {
    try { navigator.clipboard.writeText(partner.code); } catch (e) { }
    return toast('Code JSTONE copied — works at signup');
  }
  if ((el = q('[data-ptsub]'))) {
    addNotif('PA', 'Sub-affiliate invites sent', 'Anyone who joins as a partner under you earns you a 5% override on their earnings.');
    return toast('Sub-affiliate invite link copied — 5% override on their earnings');
  }
  if ((el = q('[data-ptwd]'))) {
    addNotif('PA', `Withdrawal requested — ${gbp0(partner.pending)}`, 'Paid to Bank · GBP (•••• 4471) with the 1 Aug payout run.');
    return toast(`Withdrawal of ${gbp0(partner.pending)} requested — lands with the next payout run`);
  }
  if ((el = q('[data-ptcsv]'))) {
    const csv = 'client,region,joined,status,trades,their_winnings,lifetime_spend,your_20pct,last_active\n'
      + P_CLIENTS.map(c => c.join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = 'paktos-referred-clients.csv';
    a.click();
    return toast('Referred clients exported — CSV downloading');
  }
  /* partner */
  if ((el = q('[data-copyref]'))) {
    try { navigator.clipboard.writeText(partner.link); } catch (_e) {}
    return toast('Referral link copied');
  }
  /* reward overlay */
  if ((el = q('[data-rclaim]'))) { closeReward(); return toast('Winnings banked — back to the Arena'); }
  if ((el = q('[data-rskip]'))) { closeReward(); return toast('Pot parked in your notifications — claim any time'); }
  /* trader profile controls */
  if ((el = q('[data-trtab]'))) { traderTab = el.dataset.trtab; return renderTrader(); }
  if ((el = q('[data-trrange]'))) { traderRange = el.dataset.trrange; return renderTrader(); }
  /* trader rows — fall-through so buttons inside rows keep priority */
  if ((el = q('[data-chopen]'))) {
    const face = e.target.closest('[data-trader]');
    if (face) return openTrader(face.dataset.trader);
    chSel = +el.dataset.chopen;
    return navigate('challenge');
  }
  if ((el = q('[data-trader]'))) return openTrader(el.dataset.trader);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'authEmail' || e.target.id === 'authPass')) document.querySelector('[data-signin]')?.click();
  if (e.key === 'Enter' && e.target.id === 'specSay') document.querySelector('[data-sayspec]')?.click();
});

document.addEventListener('input', e => {
  if (e.target.id === 'fame-search') return renderFame(e.target.value);
  if (e.target.id === 'rrSlider') {
    term.rr = +e.target.value;
    const riskAmt = term.bal * term.risk / 100;
    const lbl = document.getElementById('rrLabel');
    if (lbl) lbl.textContent = `1 : ${term.rr.toFixed(1)}`;
    const plain = document.getElementById('rrPlain');
    if (plain) plain.innerHTML = `Risk <b>${gbp0(riskAmt)}</b> to win <b>${gbp0(riskAmt * term.rr)}</b>`;
    return;
  }
  /* arena builder custom fields — update summary in place so inputs keep focus */
  if (e.target.id === 'stakeCustom') {
    const v = Math.max(10, Math.round(+e.target.value || 0));
    if (v) arenaB.stake = v;
  } else if (e.target.id === 'oddsCustom') {
    arenaB.oddsText = e.target.value;
  } else if (e.target.id === 'startCustom') {
    arenaB.startCustom = e.target.value;
  } else return;
  const sum = document.getElementById('bSum');
  if (sum) sum.innerHTML = payoffHTML();
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'dmInput') { e.preventDefault(); sendDM(); }
  if (e.target.id === 'railSearch') {
    e.preventDefault();
    toast(e.target.value.trim() ? `Search launches with live data — no results for “${e.target.value.trim()}” in demo` : 'Type a trader or market to search');
  }
  if (e.target.id === 'composeIn') {
    e.preventDefault();
    const btn = document.querySelector('[data-postbtn]');
    if (btn) btn.click();
  }
});

/* Neumorphic entries counter + Enter Now */

let entryCount = 1;

document.addEventListener('click', e => {
  let el;
  if ((el = e.target.closest('[data-cnt]'))) {
    entryCount = Math.max(1, Math.min(50, entryCount + (+el.dataset.cnt)));
    const v = document.getElementById('cntVal');
    v.textContent = entryCount;
    v.classList.remove('pop');
    void v.offsetWidth;
    v.classList.add('pop');
    document.getElementById('enterLabel').textContent = `Enter Now · £${(entryCount * 25).toLocaleString('en-GB')}`;
    return;
  }
  if ((el = e.target.closest('[data-enter]'))) {
    prizePool += entryCount * 25;
    activePlayers += 1;
    toast(`Entered with ${entryCount} ${entryCount === 1 ? 'entry' : 'entries'} — £${(entryCount * 25).toLocaleString('en-GB')} added to the pool`);
    addNotif('T', 'Tournament entry confirmed', `${entryCount} ${entryCount === 1 ? 'entry' : 'entries'} · £${(entryCount * 25).toLocaleString('en-GB')} added to the prize pool.`);
    return;
  }
});

/* Partner mode toggle */
document.querySelector('.segmented-state').addEventListener('change', e => {
  navigate(e.target.checked ? 'partner' : 'arena');
});

/* Redraw charts on theme change */
document.getElementById('theme-state').addEventListener('change', () => {
  setTimeout(() => { if (RENDER[currentView]) RENDER[currentView](); }, 60);
});

navigate('arena');

/* Hero stats roll in from zero — every digit a slot-machine reel */
odoIntro('stat-pool', '£0.00M', '£' + (prizePool / 1e6).toFixed(2) + 'M');
odoIntro('stat-players', '000,000', activePlayers.toLocaleString('en-GB'));
odoIntro('stat-capital', '£00.00B', '£' + (liveCapital / 1e9).toFixed(2) + 'B');
</script>
</body>
</html>
