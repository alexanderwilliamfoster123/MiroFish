  border: none; background: none; cursor: pointer; font-family: inherit;
  padding: 12px 0 8px; color: var(--accent-a); font-size: 12.5px; font-weight: 600;
  display: block;
}

@media (max-width: 1180px) {
  .fd-grid { grid-template-columns: 1fr; }
  .fr-rail { position: static; }
}

/* Flick — Tradr swipe layout */

.flickwrap { max-width: 480px; margin: 0 auto; }
.fhead { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
.fh-t { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }

.fdone { text-align: center; padding: 44px 20px; }

.fpicks { margin-top: 22px; }
.fpicks-h { font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: 0.12em; color: var(--text-faint); text-transform: uppercase; margin-bottom: 10px; }

.fstack { position: relative; margin-bottom: 34px; }

.ai-sig-kick {

}
.ai-brief-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 16px 0 10px; }
.ai-brief-tag {
  display: inline-flex; align-items: center; gap: 7px;
  background: linear-gradient(92deg, var(--accent-a), var(--accent-b));
  color: #fff;
  font-family: 'SF Mono', ui-monospace, Menlo, monospace;
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
  padding: 7px 14px; border-radius: 999px;
  box-shadow: 0 6px 14px rgba(124, 58, 237, 0.3);
}
.ai-brief-box {
  position: relative;
  border-radius: 15px;
  padding: 14px 17px 14px 20px;
  background: linear-gradient(135deg, rgba(124, 58, 237, 0.06), rgba(217, 70, 239, 0.03));
  border: 1px solid rgba(124, 58, 237, 0.14);
  overflow: hidden;
}
.ai-brief-box::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  background: linear-gradient(180deg, var(--accent-a), var(--accent-b));
}
.ai-brief-box .tc-brief-p { margin: 0; }
.tcard {
  position: relative;
  z-index: 2;
  background: var(--card);
  border-radius: 26px;
  box-shadow: var(--neu-out);
  padding: 26px 28px;
  touch-action: pan-y;
  will-change: transform;
}
.tcard.dragging { transition: none !important; cursor: grabbing; }
.tcard .fstamp { z-index: 3; top: 34px; }
.fstub {
  position: absolute;
  left: 12px; right: 12px; top: 14px; bottom: -12px;
  border-radius: 26px;
  background: var(--card);
  box-shadow: var(--neu-out-sm);
  z-index: 1;
}
.fstub.d2 { left: 24px; right: 24px; bottom: -22px; z-index: 0; opacity: 0.55; }

/* Spotlight glow on hover (cursor-following) */

.glow { position: relative; }

/* AI brief */

.brief {
  background: var(--surface);
  box-shadow: var(--neu-in-sm);
  border-radius: 14px;
  padding: 14px 16px;
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--text-soft);
}
.brief-h {
  font-size: 9.5px;
  color: var(--accent-a);
  margin-bottom: 7px;
  display: flex;
  align-items: center;
  gap: 7px;
}
.brief p { margin-bottom: 10px; }
.brief-lv { display: flex; gap: 9px; }
.brief-lv .term-cell { background: var(--card); box-shadow: none; border: 1px solid var(--line); padding: 8px 11px; }
.brief-toggle { margin-top: 0; padding: 4px 0; font-size: 12.5px; color: var(--accent-a); }

/* Morphing card stack */

.stack-wrap { position: relative; max-width: 600px; margin: 18px auto 8px; height: 400px; }
.scard {
  position: absolute;
  inset: 0;
  background: var(--card);
  border-radius: 24px;
  box-shadow: var(--neu-out);
  padding: 26px 28px;
  display: flex;
  flex-direction: column;
  gap: 13px;
  transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease;
  will-change: transform;
}
.scard.d0 { z-index: 4; cursor: pointer; }
.scard.d1 { transform: translateY(18px) scale(0.955); opacity: 0.75; z-index: 3; }
.scard.d2 { transform: translateY(36px) scale(0.91); opacity: 0.45; z-index: 2; }
.scard.d3 { transform: translateY(52px) scale(0.87); opacity: 0.2; z-index: 1; }
.scard.out { transform: translateX(125%) rotate(9deg) !important; opacity: 0 !important; }
.scard-head { display: flex; align-items: center; gap: 12px; }
.scard-title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.35; }
.scard-desc {
  font-size: 13.5px; line-height: 1.6; color: var(--text-soft);
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
}
.scard .idea-cat { margin-right: auto; }
.scard-foot { margin-top: auto; display: flex; gap: 10px; align-items: center; }
.stack-hint { text-align: center; font-size: 11px; color: var(--text-faint); margin-top: 68px; }

/* Tinder flick deck */

.flick-wrap { position: relative; max-width: 460px; margin: 18px auto 0; height: 520px; touch-action: none; }
.fcard {
  position: absolute;
  inset: 0;
  background: var(--card);
  border-radius: 26px;
  box-shadow: var(--neu-out);
  padding: 26px 28px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  user-select: none;
  transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
  will-change: transform;
}
.fcard.top { cursor: grab; z-index: 2; }
.fcard.top:active { cursor: grabbing; }
.fcard.under { transform: translateY(16px) scale(0.95); opacity: 0.6; z-index: 1; }
.fcard.dragging { transition: none; }
.fstamp {
  position: absolute;
  top: 26px;
  padding: 9px 18px;
  border: 3px solid;
  border-radius: 13px;
  font-weight: 800;
  font-size: 21px;
  letter-spacing: 0.12em;
  opacity: 0;
  pointer-events: none;
}
.fstamp.exec { left: 22px; color: #10b981; border-color: #10b981; transform: rotate(-12deg); }
.fstamp.skip { right: 22px; color: #e5484d; border-color: #e5484d; transform: rotate(12deg); }
.fcard-big { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.35; }
.flick-actions { display: flex; justify-content: center; gap: 26px; margin-top: 18px; }
.fbtn {
  width: 62px; height: 62px; border: none; border-radius: 50%;
  background: var(--surface-raised);
  box-shadow: var(--neu-out-sm);
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700;
  transition: all 0.22s ease;
}
.fbtn:active { box-shadow: var(--neu-in-sm); }
.fbtn.skip { color: #e5484d; }
.fbtn.exec { color: #10b981; }
.fbtn:hover { transform: translateY(-2px); }
.flick-hint { text-align: center; font-size: 11px; color: var(--text-faint); margin-top: 14px; }

/* Neumorphic counter (soft-UI stepper) */

.neu-counter {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px;
  border-radius: 17px;
  background: var(--surface);
  box-shadow: var(--neu-in-sm);
}
.cnt-btn {
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 13px;
  background: var(--surface-raised);
  box-shadow: var(--neu-out-sm);
  color: var(--text-soft);
  font-size: 19px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  line-height: 1;
  padding-bottom: 2px;
}
.cnt-btn:hover { color: var(--accent-a); }
.cnt-btn:active { box-shadow: var(--neu-in-sm); }
.cnt-wrap { display: flex; flex-direction: column; align-items: center; min-width: 62px; padding: 0 4px; }
.cnt-label { font-size: 8.5px; color: var(--text-faint); }
.cnt-val {
  font-size: 19px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
  line-height: 1.15;
}
.cnt-val.pop { animation: cntpop 0.25s ease; }
@keyframes cntpop {
  0% { transform: translateY(7px) scale(0.85); opacity: 0; }
  100% { transform: none; opacity: 1; }
}

/* Responsive for new pages */

@media (max-width: 1180px) {
  .term-grid, .two-col { grid-template-columns: 1fr; }
  .idea-grid, .challenge-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .contact-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split { grid-template-columns: 1fr; }
  .tile-row, .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 640px) {
  .idea-grid, .challenge-grid, .contact-grid, .tile-row, .stats-grid { grid-template-columns: 1fr; }
}

/* ---------------- Odometer — every live number rolls like a slot machine ---------------- */
.odo { line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------------- Nation Wars ---------------- */
.nw-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 18px; }
.nw-card { background: var(--card); border-radius: 24px; box-shadow: var(--neu-out); padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
.nw-meta { display: flex; align-items: center; gap: 8px; font-size: 10.5px; letter-spacing: .1em; color: var(--text-faint); }
.nw-pot { margin-left: auto; color: var(--text); font-weight: 800; letter-spacing: 0; font-size: 13px; }
.nw-face { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.nw-side { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.nw-side.right { align-items: flex-end; text-align: right; }
.nw-country { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 14.5px; color: var(--text); }
.nw-squad { font-size: 11px; color: var(--text-faint); }
.nw-ret { font-size: 21px; font-weight: 800; letter-spacing: -.4px; }
.nw-vs { font-size: 11px; font-weight: 800; letter-spacing: .14em; color: var(--text-faint); background: var(--surface); box-shadow: var(--neu-in-sm); border-radius: 999px; padding: 7px 11px; }
.nw-bar { height: 9px; border-radius: 999px; background: var(--surface); box-shadow: var(--neu-in-sm); overflow: hidden; display: flex; }
.nw-bar > span { height: 100%; background: linear-gradient(90deg, #34d399, #10b981); border-radius: 999px 0 0 999px; transition: width 1.1s cubic-bezier(.16, 1, .3, 1); }
.nw-bar > i { flex: 1; height: 100%; background: linear-gradient(90deg, var(--accent-a), var(--accent-b)); border-radius: 0 999px 999px 0; }
.nw-foot { display: flex; align-items: center; gap: 10px; }
.nw-foot .btn-neu { padding: 10px 16px; font-size: 12.5px; }
.nw-watch { margin-left: auto; font-size: 11px; color: var(--text-faint); }
.flagc { position: relative; width: 30px; height: 30px; border-radius: 50%; overflow: hidden; flex: none; box-shadow: var(--neu-out-sm); background: var(--surface); }
.flagc .flag-fb { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; }
.flagc.sm .flag-fb { font-size: 13px; }
.flagc img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.flagc.sm { width: 22px; height: 22px; }

/* ---------------- Country winnings accordion ---------------- */
.nat-acc { background: var(--card); border-radius: 24px; box-shadow: var(--neu-out); overflow: hidden; }
.nrow { padding: 20px 24px; display: flex; gap: 26px; align-items: flex-start; }
.nrow + .nrow { border-top: 1px solid var(--surface); }
.nrow-label { width: 108px; flex: none; font-size: 10.5px; font-weight: 700; letter-spacing: .15em; color: var(--text-faint); padding-top: 8px; }
.nrow-body { flex: 1; min-width: 0; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(172px, 1fr)); gap: 9px; }
.cgrid.nrow-more { overflow: hidden; max-height: 0; opacity: 0; margin-top: 0; transition: max-height .45s cubic-bezier(.4, 0, .2, 1), opacity .3s ease, margin-top .3s ease; }
.cgrid.nrow-more.open { max-height: 420px; opacity: 1; margin-top: 9px; }
.cpill { display: flex; align-items: center; gap: 9px; padding: 8px 11px; border-radius: 14px; background: var(--surface); box-shadow: var(--neu-in-sm); min-width: 0; }
.cpill-tx { min-width: 0; flex: 1; }
.cpill-name { font-size: 11.5px; font-weight: 600; color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cpill-won { font-size: 12px; font-weight: 800; color: var(--text); margin-top: 1px; }
.cheat { height: 3.5px; border-radius: 2px; background: var(--card); margin-top: 4px; overflow: hidden; }
.cheat > span { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--accent-a), var(--accent-b)); }
.nrow-toggle { flex: none; padding-top: 8px; display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--text-faint); background: none; border: 0; cursor: pointer; font-family: inherit; }
.nrow-toggle:hover { color: var(--text); }
.nrow-toggle b { font-size: 15px; font-weight: 600; line-height: 1; transition: transform .25s ease; display: inline-block; }
.nrow-toggle.open b { transform: rotate(45deg); }

@media (max-width: 760px) {
  .nrow { flex-direction: column; gap: 10px; }
  .nrow-label { width: auto; padding-top: 0; }
}

/* ---------------- Tournaments inside the Arena ---------------- */
.hero.sub { margin-top: 0; }
.hero.sub .hero-title { font-size: 34px; }
.btn-invite {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 15px 26px; border: none; border-radius: 14px; cursor: pointer;
  background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
  color: #fff; font-size: 14px; font-weight: 600; letter-spacing: -.01em;
  box-shadow: 0 10px 22px rgba(124, 58, 237, .32);
  transition: transform .2s ease, box-shadow .2s ease;
}
.btn-invite:hover { transform: translateY(-1px); box-shadow: 0 13px 26px rgba(124, 58, 237, .4); }
.hero-foot { display: flex; align-items: center; gap: 9px; margin-top: 18px; font-size: 10.5px; letter-spacing: .1em; color: var(--text-faint); }
.hero-foot .hf-close { margin-left: auto; }
.hero-foot .hf-close b { color: #e5484d; font-weight: 700; font-variant-numeric: tabular-nums; }
.tc2-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.tile-ic.sm { width: 32px; height: 32px; border-radius: 11px; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.tc2-cad { font-size: 13.5px; font-weight: 800; letter-spacing: -.01em; }
.tc2-head .live-tag { margin-left: auto; }
.tc2-view { color: var(--accent-a); font-weight: 600; font-size: 11.5px; }
.tournament-pool { font-size: 29px; }
.fame-row { display: flex; align-items: center; gap: 14px; padding: 15px 4px; cursor: pointer; border-radius: 12px; }
.fame-row + .fame-row { border-top: 1px solid var(--surface); }
.fame-rank { width: 20px; flex: none; text-align: center; font-size: 11px; color: var(--text-faint); }
.fame-tx { min-width: 0; flex: 1; }
.fame-tx b { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 700; color: var(--text); }
.fame-tx > span { display: block; font-size: 11.5px; color: var(--text-faint); margin-top: 2px; }
.fame-win { text-align: right; flex: none; }
.fame-win b { display: block; font-size: 13.5px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
.fame-win b i { font-style: normal; color: var(--text-faint); font-weight: 400; padding: 0 2px; }
.fame-win > span { display: block; font-size: 11px; font-weight: 700; color: var(--green); margin-top: 2px; }

/* ---------------- Candle chart (terminal) ---------------- */
.cchart { position: relative; height: 320px; border-radius: 14px; background: var(--surface); box-shadow: var(--neu-in-sm); overflow: hidden; cursor: crosshair; }
.cchart svg { display: block; width: 100%; height: 100%; color: var(--text); }
.cc-tip { position: absolute; top: 10px; left: 10px; min-width: 138px; background: var(--card); box-shadow: var(--neu-out-sm); border-radius: 13px; padding: 9px 12px; pointer-events: none; opacity: 0; transition: opacity .15s ease; z-index: 5; }
.cc-tip.on { opacity: 1; }
.cct-t { font-size: 9.5px; letter-spacing: .08em; color: var(--text-faint); margin-bottom: 6px; }
.cct-r { display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 11px; padding: 1.5px 0; }
.cct-r span { font-size: 9px; letter-spacing: .1em; color: var(--text-faint); }
.cct-r b { font-variant-numeric: tabular-nums; font-weight: 700; }

/* person avatars — photo when the network allows, character face beneath */
.pav { position: relative; overflow: hidden; }
.pav .pav-fb { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 1.05em; }
.pav img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

/* ---------------- Modals (edit profile, invite) ---------------- */
.pk-veil { position: fixed; inset: 0; z-index: 120; display: flex; align-items: center; justify-content: center; background: rgba(120, 128, 148, .28); backdrop-filter: blur(10px); zoom: 1.176; }
.pk-modal { width: min(560px, 92vw); max-height: 88vh; overflow-y: auto; background: var(--card); border-radius: 26px; box-shadow: 0 30px 80px rgba(15, 18, 28, .28); padding: 24px 26px; }
.pk-modal-h { font-size: 17px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 4px; }
.pk-modal-s { font-size: 12px; color: var(--text-faint); margin-bottom: 18px; }
.ep-cover { position: relative; height: 110px; border-radius: 18px; overflow: hidden; background: linear-gradient(120deg, #ede9fe, #fdf4ff 55%, #e0f2fe); background-size: cover; background-position: center; margin-bottom: 0; }
.ep-cover button, .ep-avwrap button { position: absolute; bottom: 10px; right: 10px; }
.ep-avwrap { position: relative; width: 84px; height: 84px; margin: -38px 0 10px 22px; }
.ep-avatar { width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--card); background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); color: #fff; font-size: 30px; font-weight: 800; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.ep-avatar img { width: 100%; height: 100%; object-fit: cover; }
.ep-avwrap button { bottom: -6px; right: -46px; }
.ep-field { margin-bottom: 14px; }
.ep-field label { display: block; font-size: 10px; letter-spacing: .12em; color: var(--text-faint); margin-bottom: 6px; }
.ep-field input, .ep-field textarea { width: 100%; border: 0; font: inherit; font-size: 13.5px; color: var(--text); background: var(--surface); box-shadow: var(--neu-in-sm); border-radius: 13px; padding: 11px 14px; outline: none; resize: vertical; }
.pk-actions { display: flex; gap: 10px; margin-top: 18px; }
.pk-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.inv-row { margin-bottom: 13px; }
.inv-row .b-label { font-size: 10px; letter-spacing: .12em; color: var(--text-faint); margin-bottom: 7px; }
.inv-chips { display: flex; flex-wrap: wrap; gap: 7px; }
.inv-chips .pill-btn { padding: 8px 13px; font-size: 12px; }
.inv-link { display: flex; align-items: center; gap: 10px; background: var(--surface); box-shadow: var(--neu-in-sm); border-radius: 14px; padding: 11px 14px; font-size: 12.5px; color: var(--text-soft); margin-bottom: 14px; overflow: hidden; }
.inv-link b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.inv-sum { font-size: 12px; color: var(--text-faint); background: var(--surface); box-shadow: var(--neu-in-sm); border-radius: 13px; padding: 10px 14px; margin-top: 4px; }
.inv-sum b { color: var(--text); }
.flagc.xs { width: 17px; height: 17px; }
.flagc.xs .flag-fb { font-size: 10px; }

/* avatar polish — every player picture gets depth */
.thread-av, .stack-avatar, .fame-avatar, .tpc-avatar, .user-avatar-inner { position: relative; overflow: hidden; }
.thread-av::after, .stack-avatar::after, .fame-avatar::after, .tpc-avatar::after, .user-avatar-inner::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(120% 90% at 28% 18%, rgba(255, 255, 255, .38), transparent 55%); pointer-events: none; }
.user-avatar-inner img, .tpc-avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

/* ---------------- Bottom dock navigation ---------------- */
.sidebar { display: none !important; }
.main, .content { margin-left: 0 !important; }
#views { padding-bottom: 130px; }
.dock { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 90; }
.dock ul { display: flex; align-items: flex-end; gap: 5px; margin: 0; padding: 9px 11px; list-style: none; border-radius: 24px; background: var(--card); box-shadow: 10px 14px 34px var(--shadow-dark), -8px -8px 22px var(--shadow-light); }
.dk { --sz: 52px; position: relative; width: var(--sz); height: var(--sz); will-change: width, height; }
.dk-sep { width: 1px; align-self: stretch; margin: 8px 5px; background: var(--surface); }
.dk button { width: 100%; height: 100%; border: 0; cursor: pointer; border-radius: 17px; background: var(--surface); box-shadow: var(--neu-out-sm); color: var(--text-soft); display: flex; align-items: center; justify-content: center; padding: 0; font: inherit; }
.dk button svg { width: 44%; height: 44%; }
.dk.active button { color: var(--accent-a); box-shadow: var(--neu-in-sm); }
.dk.active::after { content: ''; position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--accent-a); }
.dk.locked button { opacity: .4; cursor: not-allowed; }
.dk-av { width: 62%; height: 62%; border-radius: 50%; background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); color: #fff; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.dk-tip { position: absolute; left: 50%; top: -34px; transform: translateX(-50%); background: var(--card); box-shadow: var(--neu-out-sm); border-radius: 10px; padding: 5px 11px; font-size: 11px; font-weight: 600; color: var(--text); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .18s ease; }
.dk:hover .dk-tip { opacity: 1; }

/* ---------------- Locked nav (coming soon) ---------------- */
.nav-item.locked { opacity: .45; cursor: not-allowed; }
.nav-item.locked:hover { transform: none; }
.soon-chip { display: inline-block; margin-left: 7px; font-size: 8px; letter-spacing: .12em; padding: 2.5px 6px; border-radius: 999px; background: var(--surface); box-shadow: var(--neu-in-sm); color: var(--text-faint); vertical-align: 2px; }

/* ---------------- Account toggle (terminal) ---------------- */
.acct-toggle { position: relative; display: inline-grid; grid-template-columns: repeat(3, minmax(150px, 1fr)); background: var(--surface); box-shadow: var(--neu-in-sm); border-radius: 17px; padding: 5px; margin-bottom: 18px; }
.acct-toggle .at-thumb { position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / 3); border-radius: 13px; background: var(--card); box-shadow: var(--neu-out-sm); transition: transform .35s cubic-bezier(.16, 1, .3, 1); }
.acct-toggle button { position: relative; z-index: 1; border: 0; background: none; cursor: pointer; padding: 9px 18px; font: inherit; text-align: center; color: var(--text-faint); transition: color .2s ease; }
.acct-toggle button b { display: block; font-size: 12.5px; font-weight: 800; letter-spacing: .03em; }
.acct-toggle button small { display: block; font-size: 9.5px; margin-top: 2px; }
.acct-toggle button.on { color: var(--text); }
.acct-toggle button.on b { color: var(--accent-a); }

/* ---------------- Spectate ringside ---------------- */
.spec-cheer { display: flex; gap: 12px; margin-top: 16px; }
.cheer-btn { flex: 1; border: 0; cursor: pointer; border-radius: 14px; padding: 13px; font: inherit; font-size: 13px; font-weight: 700; background: var(--card); box-shadow: var(--neu-out-sm); color: var(--text); display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform .15s ease; }
.cheer-btn:active { transform: scale(.97); }
.cheer-btn.a { color: var(--lbA); }
.cheer-btn.b { color: #61606C; }
body.dark .cheer-btn.b { color: #94939F; }
.sf-list { display: flex; flex-direction: column; gap: 7px; }
.sf-row { display: flex; align-items: center; gap: 10px; font-size: 12px; }
.sf-sym { flex: 1; color: var(--text-soft); }
.sf-amt { font-weight: 800; font-variant-numeric: tabular-nums; }
.sc-list { display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; margin-bottom: 14px; }
.sc-row { display: flex; align-items: flex-start; gap: 9px; }
.sc-tx { font-size: 12.5px; color: var(--text-soft); line-height: 1.45; padding-top: 3px; }
.sc-tx b { color: var(--text); margin-right: 4px; }
.sc-input { display: flex; gap: 10px; }
.sc-input input { flex: 1; border: 0; font: inherit; font-size: 13px; color: var(--text); background: var(--surface); box-shadow: var(--neu-in-sm); border-radius: 13px; padding: 11px 15px; outline: none; }

.ch-kick { display: flex; align-items: center; gap: 8px; font-size: 9.5px; letter-spacing: .1em; color: var(--text-faint); margin-bottom: 12px; }
.ch-kick .ch-eye { margin-left: auto; letter-spacing: .05em; }

.co-canvas { width: 100%; border-radius: 18px; box-shadow: var(--neu-out-sm); display: block; margin-bottom: 4px; }

/* ---------------- Live battles hub ---------------- */
.lb-hero { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 26px; margin-bottom: 16px; flex-wrap: wrap; }
.lb-hero-stats { display: flex; gap: 24px; font-size: 12px; color: var(--text-faint); }
.lb-hero-stats .odo { color: var(--text); font-weight: 800; font-size: 15px; }
.lb-filters { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.lb-fgroup { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lb-fgroup .b-label { width: 74px; flex: none; margin: 0; }
.lb-fgroup .pill-btn { padding: 7px 13px; font-size: 11.5px; }
.lb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
.lb-card { background: var(--card); border-radius: 22px; box-shadow: var(--neu-out-sm); padding: 16px 18px; display: flex; flex-direction: column; gap: 11px; cursor: pointer; transition: transform .2s ease, box-shadow .2s ease; }
.lb-card:hover { transform: translateY(-2px); box-shadow: var(--neu-out); }
.lb-top { display: flex; align-items: center; gap: 7px; font-size: 9px; letter-spacing: .1em; }
.lb-kind { padding: 3.5px 8px; border-radius: 999px; background: var(--surface); box-shadow: var(--neu-in-sm); color: var(--text-soft); font-weight: 800; }
.lb-kind.clan { color: var(--lbA); }
.hot-chip { padding: 3.5px 8px; border-radius: 999px; background: var(--brandGrad); color: #fff; font-weight: 800; text-shadow: 0 1px 2px rgba(0, 0, 0, .18); }
.nn-chip { padding: 3.5px 8px; border-radius: 999px; background: #6A2E9E; color: #fff; font-weight: 800; }
.lb-watching { margin-left: auto; color: var(--text-faint); letter-spacing: .06em; }
.lb-face-row { display: grid; grid-template-columns: 1fr auto auto auto 1fr; align-items: center; gap: 9px; }
.lb-face { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; min-width: 0; }
.lb-face b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-face-row .lb-face:last-child { justify-content: flex-end; }
.lb-ret { font-size: 13.5px; font-weight: 800; }
.lb-foot { display: flex; align-items: center; gap: 12px; font-size: 10px; letter-spacing: .06em; color: var(--text-faint); }
.lb-foot b { color: var(--text); font-size: 12px; letter-spacing: 0; }
.lb-go { margin-left: auto; color: var(--lbA); font-weight: 700; letter-spacing: 0; font-size: 11.5px; }

/* Paktos brand tokens — plum for weight, lavender on dark, neutrals for restraint */
:root { --lbA: #6A2E9E; --lbB: #94939F; --lbBsoft: #C9C9CF; --brandGrad: linear-gradient(120deg, #F0DCFF, #FF8E94 38%, #D95DDF 66%, #9081DF); }
body.dark { --lbA: #D3C2F0; --lbBsoft: #494851; }

.lb-hero { position: relative; overflow: hidden; }
.lb-hero::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--brandGrad); }
.lb-hero::after { content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; background: radial-gradient(60% 130% at 92% 0%, rgba(144, 129, 223, 0.15), transparent 60%), radial-gradient(45% 100% at 68% 100%, rgba(255, 142, 148, 0.09), transparent 65%); }
.lbh-tex { position: absolute; inset: 0; pointer-events: none; border-radius: inherit; background-image: radial-gradient(circle, currentColor 1px, transparent 1.4px); background-size: 15px 15px; color: var(--text); opacity: 0.055; -webkit-mask-image: linear-gradient(100deg, transparent 28%, black 82%); mask-image: linear-gradient(100deg, transparent 28%, black 82%); }
.lbh-main { position: relative; z-index: 1; min-width: 0; }
.lbh-stats { position: relative; z-index: 1; display: flex; gap: 28px; flex-wrap: wrap; align-items: center; }
.lbh-stat { display: flex; flex-direction: column; gap: 3px; }
.lbh-stat b { font-size: 27px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1.1; }
.lbh-stat span { font-size: 9px; letter-spacing: 0.12em; color: var(--text-faint); }
.lbh-stat.swing b { color: var(--lbA); }

.lb-card .nw-bar > span, .lb-tbar > span, .spec-hero .nw-bar > span { background: var(--lbA); }
.lb-card .nw-bar > i, .lb-tbar > i, .spec-hero .nw-bar > i { background: var(--lbBsoft); }
.lb-sdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.lb-leadtxt { font-size: 9px; letter-spacing: .1em; color: var(--text-faint); }
.lb-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.lb-stats span { background: var(--surface); box-shadow: var(--neu-in-sm); border-radius: 11px; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.lb-stats i { font-style: normal; font-size: 8px; letter-spacing: .08em; color: var(--text-faint); white-space: nowrap; }
.lb-stats b { font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lb-viewtog { display: inline-flex; background: var(--surface); box-shadow: var(--neu-in-sm); border-radius: 12px; padding: 3px; gap: 2px; }
.lb-viewtog button { border: none; background: transparent; cursor: pointer; padding: 6px 13px; border-radius: 9px; color: var(--text-faint); display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; font-family: inherit; }
.lb-viewtog button.on { background: var(--card); box-shadow: var(--neu-out-sm); color: var(--text); }
.lb-viewtog svg { width: 13px; height: 13px; }
.lb-table { background: var(--card); border-radius: 20px; box-shadow: var(--neu-out-sm); padding: 4px 8px; overflow-x: auto; }
.lb-table table { width: 100%; border-collapse: collapse; min-width: 980px; }
.lb-table th { font-size: 9px; letter-spacing: .09em; color: var(--text-faint); text-align: left; padding: 13px 12px 9px; border-bottom: 1px solid var(--line); font-weight: 600; }
.lb-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; vertical-align: middle; }
.lb-table tbody tr:last-child td { border-bottom: none; }
.lb-table tbody tr { cursor: pointer; transition: background .15s ease; }
.lb-table tbody tr:hover { background: var(--surface); }
.lb-tmatch { display: inline-flex; align-items: center; gap: 8px; }
.lb-spark { display: inline-block; width: 120px; height: 34px; color: var(--text); }
.lb-spark svg { width: 100%; height: 100%; display: block; }
.lb-tbar { width: 90px; height: 7px; display: inline-flex; border-radius: 999px; background: var(--surface); box-shadow: var(--neu-in-sm); overflow: hidden; }
.lb-tbar > span { height: 100%; border-radius: 999px 0 0 999px; transition: width 1.1s cubic-bezier(.16, 1, .3, 1); }
.lb-tbar > i { flex: 1; height: 100%; border-radius: 0 999px 999px 0; }
.lb-tip { position: fixed; z-index: 130; min-width: 150px; background: #18181B; color: #fff; border-radius: 10px; padding: 8px 11px; pointer-events: none; opacity: 0; transition: opacity .12s ease; box-shadow: 0 10px 26px rgba(0, 0, 0, .3); }
.lb-tip.on { opacity: 1; }

/* Challenge detail — the full read before you take the other side */
.chd-grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; align-items: start; }
@media (max-width: 1100px) { .chd-grid { grid-template-columns: 1fr; } }
.chd-card { background: var(--card); border-radius: 24px; box-shadow: var(--neu-out-sm); padding: 22px 24px; }
.chd-top { display: flex; gap: 14px; align-items: center; cursor: pointer; }
.chd-name { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chd-sub { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
.chd-bio { font-size: 13.5px; color: var(--text-soft); margin: 12px 0 14px; line-height: 1.5; }
.chd-chart { margin-top: 16px; background: var(--surface); box-shadow: var(--neu-in-sm); border-radius: 16px; overflow: hidden; height: 200px; color: var(--text); }
.chd-chart svg { width: 100%; height: 100%; display: block; }
.chd-chart-t { display: flex; justify-content: space-between; font-size: 9px; letter-spacing: 0.09em; color: var(--text-faint); margin: 16px 2px 8px; }
.chd-terms { background: var(--card); border-radius: 24px; box-shadow: var(--neu-out-sm); padding: 20px 22px; position: sticky; top: 14px; }
.chd-pot-l { font-size: 9.5px; letter-spacing: 0.12em; color: var(--text-faint); }
.chd-pot { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin: 4px 0 2px; }
.chd-split { height: 9px; border-radius: 999px; overflow: hidden; display: flex; margin: 12px 0 6px; }
.chd-split i { height: 100%; }
.chd-split-t { display: flex; justify-content: space-between; font-size: 9px; letter-spacing: 0.08em; color: var(--text-faint); margin-bottom: 14px; }
.chd-tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chd-actions { display: flex; flex-direction: column; gap: 9px; margin-top: 16px; }
.chd-actions .btn-mach { width: 100%; }
.chd-note { font-size: 9px; letter-spacing: 0.07em; color: var(--text-faint); margin-top: 12px; text-align: center; line-height: 1.7; }
.chd-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
.chd-step { background: var(--surface); box-shadow: var(--neu-in-sm); border-radius: 14px; padding: 12px 13px; }
.chd-step b { display: block; font-size: 12px; margin-bottom: 3px; }
.chd-step span { font-size: 10.5px; color: var(--text-faint); line-height: 1.5; display: block; }
.chd-step .mono { font-size: 8.5px; letter-spacing: 0.1em; color: var(--lbA); margin-bottom: 6px; }
.challenge-card { cursor: pointer; }
.challenge-card .btn-mach.enter { width: 100%; margin-top: 4px; }
.ch-actions { display: flex; gap: 9px; margin-top: 4px; }
.ch-actions .btn-mach.enter { width: auto; flex: 1; margin-top: 0; }
.ch-decline { padding: 12px 20px; font-size: 13px; }

/* Flip badges — tap a spec card, the back tells you how it's earned */
.bdg.flip { perspective: 1000px; cursor: pointer; background: transparent; box-shadow: none; padding: 0; height: 180px; outline: none; }
.flip-inner { position: relative; width: 100%; height: 100%; transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.3, 1); transform-style: preserve-3d; }
.bdg.flip.on .flip-inner { transform: rotateY(180deg); }
.flip-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 16px; background: var(--card); box-shadow: var(--neu-out-sm); padding: 15px 13px 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; transition: transform 0.25s ease-out, box-shadow 0.3s ease; }
.bdg.flip:hover .flip-face { box-shadow: var(--neu-out-sm), 0 18px 36px rgba(20, 20, 40, 0.12); }
.flip-back { transform: rotateY(180deg); }
.flip-num { position: absolute; font-size: 9px; opacity: 0.3; }
.flip-num.tr { top: 10px; right: 12px; }
.flip-num.bl { bottom: 10px; left: 12px; }
.flip-hint { font-size: 7.5px; letter-spacing: 0.09em; color: var(--text-faint); margin-top: 4px; }
.fb-chip { font-size: 8px; letter-spacing: 0.1em; padding: 3.5px 10px; border-radius: 999px; background: var(--surface); box-shadow: var(--neu-in-sm); color: var(--text-faint); }
.fb-chip.in { color: var(--lbA); font-weight: 700; }
.fb-req { font-size: 11.5px; font-weight: 700; margin: 0; }
.fb-note { font-size: 9.5px; color: var(--text-faint); line-height: 1.5; margin: 0; }

/* Activity feed — what a trader has been engaging with */
.act-list { display: flex; flex-direction: column; }
.act-row { display: flex; align-items: center; gap: 13px; padding: 13px 6px; border-bottom: 1px solid var(--line); }
.act-row:last-child { border-bottom: none; }
.act-tag { width: 34px; height: 34px; flex: none; border-radius: 11px; background: var(--surface); box-shadow: var(--neu-in-sm); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: var(--lbA); letter-spacing: 0.04em; }
.act-tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.act-tx b { font-size: 13px; }
.act-tx span { font-size: 11px; color: var(--text-faint); }
.act-ago { font-size: 9.5px; color: var(--text-faint); flex: none; }

/* Fan carousel — the Flick deck spread like a hand of cards */
.fan-wrap { position: relative; height: 730px; margin: 4px 0 8px; }
@media (max-width: 700px) { .fan-wrap { height: 680px; } }
.fan-card { position: absolute; left: 50%; top: 8px; width: min(480px, 92%); transform: translateX(-50%) translateY(3rem) scale(0.6); opacity: 0; transition: transform 0.65s cubic-bezier(0.3, 1.4, 0.45, 1), opacity 0.45s ease; will-change: transform; transform-origin: center 115%; }
.fan-card:not(.ctr) { cursor: pointer; }
.fan-card .tcard { width: 100%; }
.fprev { background: var(--card); border-radius: 22px; box-shadow: var(--neu-out); overflow: hidden; }
.fprev-hero { position: relative; height: 150px; padding: 14px 16px 10px; display: flex; flex-direction: column; justify-content: flex-end; }
.fprev-hero.up { background: linear-gradient(180deg, rgba(16, 185, 129, 0.16), rgba(16, 185, 129, 0.03)); }
.fprev-hero.down { background: linear-gradient(180deg, rgba(229, 72, 77, 0.14), rgba(229, 72, 77, 0.03)); }
.fprev-hero .tc-dir { font-size: 18px; }
.fprev-body { display: flex; align-items: center; gap: 10px; padding: 13px 16px 0; }
.fprev-body .asset-ic { width: 34px; height: 34px; border-radius: 11px; flex: none; }
.fprev-body b { font-size: 14px; display: block; }
.fprev-body i { font-style: normal; font-size: 10.5px; color: var(--text-faint); display: block; }
.fprev-head { font-size: 13px; font-weight: 600; line-height: 1.45; padding: 10px 16px 0; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fprev-cta { padding: 12px 16px 14px; font-size: 8.5px; letter-spacing: 0.1em; color: var(--text-faint); }
.fan-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 16px; }
.fan-arrow { width: 42px; height: 42px; border-radius: 50%; border: 0; cursor: pointer; background: var(--card); box-shadow: var(--neu-out-sm); color: var(--text-soft); font-family: inherit; display: flex; align-items: center; justify-content: center; padding: 0; }
.fan-arrow svg { width: 17px; height: 17px; }
.fan-arrow:active { box-shadow: var(--neu-in-sm); }

/* Sign in — the clean gate in front of the arena */
.auth-veil { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: var(--bg, #f0f1f5); padding: 20px; }
.auth-veil[hidden] { display: none; }
.auth-card { position: relative; width: 384px; max-width: 100%; background: var(--card); border-radius: 28px; box-shadow: var(--neu-out), 0 30px 70px rgba(20, 20, 45, 0.14); padding: 34px 30px 28px; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
.auth-card::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--brandGrad); }
.auth-logo { width: 56px; height: 56px; border-radius: 18px; background: var(--surface); box-shadow: var(--neu-in-sm); display: flex; align-items: center; justify-content: center; margin-bottom: 18px; color: var(--text); }
.auth-logo svg { width: 30px; height: 24px; }
.auth-h { font-size: 21px; font-weight: 800; letter-spacing: -0.01em; }
.auth-s { font-size: 12.5px; color: var(--text-faint); text-align: center; margin: 7px 0 20px; line-height: 1.55; }
.auth-field { position: relative; width: 100%; margin-bottom: 10px; }
.auth-field svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--text-faint); }
.auth-field input { width: 100%; padding: 12px 14px 12px 38px; border: 0; outline: none; border-radius: 14px; background: var(--surface); box-shadow: var(--neu-in-sm); font: inherit; font-size: 13px; color: var(--text); }
.auth-field input::placeholder { color: var(--text-faint); }
.auth-row { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 2px 0 14px; min-height: 16px; }
.auth-err { font-size: 11px; color: #c9383d; }
.auth-forgot { border: 0; background: none; cursor: pointer; font: inherit; font-size: 11px; font-weight: 600; color: var(--text-soft); }
.auth-go { width: 100%; border: 0; cursor: pointer; font: inherit; font-size: 14px; font-weight: 700; color: #fff; padding: 13px; border-radius: 14px; background: linear-gradient(160deg, #24262c, #0c0d10); box-shadow: 0 10px 22px rgba(10, 10, 20, 0.3); transition: transform 0.15s ease, filter 0.2s ease; }

/* Liquid CTA — one animated gradient button, reserved for the moment that matters */
.liquid-cta { position: relative; overflow: hidden; z-index: 0; background: none; box-shadow: 0 14px 34px rgba(70, 50, 220, 0.32); }
.liquid-cta::before { content: ''; position: absolute; inset: -80% -30%; z-index: -2; background: conic-gradient(from 0deg, #0B06FC, #1E10C5, #9081DF, #F0DCFF, #FF8E94, #D95DDF, #4743EF, #0B06FC); animation: liquidSpin 7s linear infinite; filter: blur(16px) saturate(1.35); }
.liquid-cta::after { content: ''; position: absolute; inset: 3px; border-radius: 11px; background: rgba(8, 7, 24, 0.84); z-index: -1; }
.liquid-cta:hover::before { animation-duration: 2.2s; }
.liquid-cta:hover { filter: none; box-shadow: 0 16px 40px rgba(70, 50, 220, 0.45); }
@keyframes liquidSpin { to { transform: rotate(360deg); } }
.auth-go:hover { filter: brightness(1.15); }
.auth-go:active { transform: scale(0.98); }
.auth-div { display: flex; align-items: center; width: 100%; gap: 10px; margin: 16px 0 12px; font-size: 10.5px; color: var(--text-faint); }
.auth-div::before, .auth-div::after { content: ''; flex: 1; border-top: 1px dashed var(--line); }
.auth-sso { display: flex; gap: 10px; width: 100%; }
.auth-sso button { flex: 1; height: 46px; border: 0; cursor: pointer; border-radius: 13px; background: var(--surface); box-shadow: var(--neu-out-sm); display: flex; align-items: center; justify-content: center; color: var(--text); transition: transform 0.15s ease; }
.auth-sso button:active { transform: scale(0.96); }
.auth-sso svg { width: 19px; height: 19px; }
.auth-foot { margin-top: 12px; font-size: 9px; letter-spacing: 0.08em; color: var(--text-faint); }
.auth-skip { margin-top: 16px; border: 0; background: none; cursor: pointer; font: inherit; font-size: 11.5px; font-weight: 600; color: var(--text-soft); }
.auth-skip:hover { color: var(--text); }
.ep-signout { margin-top: 12px; text-align: center; }
.ep-signout button { border: 0; background: none; cursor: pointer; font: inherit; font-size: 11.5px; color: #c9383d; font-weight: 600; }

/* App Store button — hero download CTA */
.btn-appstore { display: inline-flex; align-items: center; gap: 9px; border: 0; cursor: pointer; font: inherit; padding: 9px 18px 9px 14px; border-radius: 14px; background: linear-gradient(160deg, #24262c, #0c0d10); color: #fff; box-shadow: 0 10px 22px rgba(10, 10, 20, 0.28); transition: transform 0.15s ease, filter 0.2s ease; }
.btn-appstore:hover { filter: brightness(1.2); transform: translateY(-1px); }
.btn-appstore svg { width: 21px; height: 21px; flex: none; }
.as-tx { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
.as-tx small { font-size: 8.5px; letter-spacing: 0.02em; opacity: 0.75; margin-bottom: 3px; }
.as-tx b { font-size: 14.5px; font-weight: 700; letter-spacing: 0.01em; }

/* Account dropdown — scales to any number of battle accounts */
.acct-dd { position: relative; display: inline-block; margin-bottom: 18px; min-width: 340px; z-index: 20; }
.acct-dd-btn { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; cursor: pointer; font: inherit; text-align: left; background: var(--card); box-shadow: var(--neu-out-sm); border-radius: 16px; padding: 11px 16px; color: var(--text); }
.acct-dd-btn > svg { width: 15px; height: 15px; color: var(--text-faint); flex: none; }
.ad-ic { width: 34px; height: 34px; flex: none; border-radius: 11px; background: var(--surface); box-shadow: var(--neu-in-sm); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: var(--text-soft); }
.ad-ic.btl { color: var(--lbA); }
.ad-tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.ad-tx b { font-size: 13.5px; font-weight: 800; letter-spacing: 0.02em; }
.ad-tx small { font-size: 10px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ad-n { font-size: 8.5px; letter-spacing: 0.09em; color: var(--text-faint); flex: none; }
.acct-dd-menu { position: absolute; top: calc(100% + 8px); left: 0; right: 0; max-height: 320px; overflow-y: auto; background: var(--card); border-radius: 16px; box-shadow: var(--neu-out), 0 22px 44px rgba(20, 20, 45, 0.16); padding: 6px; display: flex; flex-direction: column; gap: 2px; z-index: 30; }
.acct-dd-menu[hidden] { display: none; }
.ad-item { display: flex; align-items: center; gap: 11px; border: 0; cursor: pointer; font: inherit; text-align: left; background: none; border-radius: 12px; padding: 9px 11px; color: var(--text); }
.ad-item:hover { background: var(--surface); }
.ad-item.on { background: var(--surface); box-shadow: var(--neu-in-sm); }
.ad-item.on .ad-tx b { color: var(--lbA); }
.ad-bal { margin-left: auto; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bacct { font-size: 8.5px; letter-spacing: 0.07em; padding: 3px 8px; border-radius: 999px; background: var(--surface); box-shadow: var(--neu-in-sm); color: var(--lbA); font-weight: 700; }

/* Airbnb-style filter bar — one clean pill, dropdown groups */
.lb-bar { display: flex; align-items: stretch; background: var(--card); border-radius: 999px; box-shadow: var(--neu-out-sm); padding: 6px; margin-bottom: 18px; width: fit-content; max-width: 100%; position: relative; z-index: 15; flex-wrap: wrap; }
.lb-g { position: relative; }
.lb-g > button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; border: 0; background: none; cursor: pointer; font: inherit; padding: 8px 24px; border-radius: 999px; text-align: left; color: var(--text); }
.lb-g > button:hover { background: var(--surface); }
.lb-g.open > button { background: var(--surface); box-shadow: var(--neu-in-sm); }
.lb-g small { font-size: 8.5px; letter-spacing: 0.1em; color: var(--text-faint); text-transform: uppercase; }
.lb-g b { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.lb-g b svg { width: 11px; height: 11px; color: var(--text-faint); }
.lb-bar-div { width: 1px; background: var(--line); margin: 9px 2px; }
.lb-menu { position: absolute; top: calc(100% + 9px); left: 0; min-width: 185px; background: var(--card); border-radius: 16px; box-shadow: var(--neu-out), 0 20px 42px rgba(20, 20, 45, 0.15); padding: 6px; display: flex; flex-direction: column; gap: 1px; z-index: 40; }
.lb-menu button { border: 0; background: none; cursor: pointer; font: inherit; text-align: left; padding: 9px 13px; border-radius: 10px; font-size: 12.5px; color: var(--text-soft); }
.lb-menu button:hover { background: var(--surface); }
.lb-menu button.on { color: var(--lbA); font-weight: 700; }
.lb-bar-view { display: flex; align-items: center; gap: 4px; padding: 0 8px 0 14px; margin-left: 4px; border-left: 1px solid var(--line); }
.lb-bar-view button { border: 0; background: none; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-faint); }
.lb-bar-view button.on { background: var(--surface); box-shadow: var(--neu-in-sm); color: var(--text); }
.lb-bar-view svg { width: 15px; height: 15px; }

/* Social profiles — neumorphic boxes that lift, linked out */
/* Expanding socials card — boxes fan out on hover, staggered */
.soc-card { position: relative; display: block; margin-top: 14px; height: 52px; }
.soc-card.n3 { width: 168px; }
.soc-card.n4 { width: 220px; }
.soc-bg { position: absolute; inset: 0; border-radius: 16px; background: var(--card); box-shadow: var(--neu-out-sm); display: flex; align-items: center; gap: 10px; padding: 0 16px; font-weight: 800; font-size: 13px; z-index: 2; pointer-events: none; transition: opacity 0.25s ease, transform 0.3s ease; }
.soc-hint { font-size: 7.5px; letter-spacing: 0.09em; color: var(--text-faint); font-weight: 600; margin-left: auto; }
.soc-pop { position: absolute; top: 5px; left: 5px; width: 42px; height: 42px; border: 0; cursor: pointer; font: inherit; border-radius: 13px; background: var(--surface); box-shadow: var(--neu-out-sm); display: flex; align-items: center; justify-content: center; color: var(--text-soft); opacity: 0; transform: translateX(0) scale(0.6); transition: transform 0.45s cubic-bezier(0.25, 1.4, 0.4, 1), opacity 0.3s ease, color 0.2s ease; z-index: 1; }
.soc-card:hover .soc-bg, .soc-card:focus-within .soc-bg { opacity: 0; transform: scale(0.92); }
.soc-card:hover .soc-pop, .soc-card:focus-within .soc-pop { opacity: 1; z-index: 3; }
.soc-card:hover .p1, .soc-card:focus-within .p1 { transform: translateX(0) scale(1); }
.soc-card:hover .p2, .soc-card:focus-within .p2 { transform: translateX(52px) scale(1); }
.soc-card:hover .p3, .soc-card:focus-within .p3 { transform: translateX(104px) scale(1); }
.soc-card:hover .p4, .soc-card:focus-within .p4 { transform: translateX(156px) scale(1); }
.soc-pop:hover { color: var(--lbA); }
.soc-pop.off { color: var(--text-faint); }
.soc-pop svg { width: 17px; height: 17px; }
.soc-plus { position: absolute; top: -4px; right: -4px; width: 15px; height: 15px; border-radius: 50%; background: var(--lbA); color: #fff; font-style: normal; font-size: 10px; font-weight: 800; line-height: 15px; text-align: center; }

.soc-row { display: flex; gap: 9px; align-items: center; margin-top: 12px; }
.soc-box { width: 34px; height: 34px; border-radius: 11px; background: var(--surface); box-shadow: var(--neu-out-sm); display: flex; align-items: center; justify-content: center; color: var(--text-soft); transition: transform 0.2s cubic-bezier(0.25, 1.4, 0.4, 1), color 0.2s ease, box-shadow 0.2s ease; }
.soc-box:hover { transform: translateY(-4px); color: var(--lbA); box-shadow: var(--neu-out-sm), 0 10px 18px rgba(20, 20, 45, 0.12); }
.soc-box svg { width: 16px; height: 16px; }
.soc-add { border: 0; background: none; cursor: pointer; font: inherit; font-size: 11px; font-weight: 600; color: var(--text-faint); }
.soc-add:hover { color: var(--text); }

/* Streaks — one qualifying action a day keeps it alive */
.stk-card { background: var(--card); border-radius: 22px; box-shadow: var(--neu-out-sm); padding: 20px 22px; align-self: start; }
.stk-head { display: flex; align-items: center; gap: 9px; }
.stk-head b { font-size: 16px; font-weight: 800; }
.stk-flame { width: 30px; height: 30px; border-radius: 10px; background: var(--surface); box-shadow: var(--neu-in-sm); display: flex; align-items: center; justify-content: center; color: var(--lbA); }
.stk-flame svg { width: 16px; height: 16px; }
.stk-sub { margin-left: auto; font-size: 8px; letter-spacing: 0.1em; color: var(--text-faint); }
.stk-big { font-size: 44px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; margin: 14px 0 16px; font-variant-numeric: tabular-nums; }
.stk-big span { font-size: 17px; font-weight: 600; color: var(--text-faint); margin-left: 8px; letter-spacing: 0; }
.stk-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; }
.stk-day { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.stk-dl { font-size: 9px; color: var(--text-faint); letter-spacing: 0.05em; }
.stk-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--surface); box-shadow: var(--neu-in-sm); display: flex; align-items: center; justify-content: center; color: #fff; }
.stk-day.on .stk-dot { background: var(--lbA); box-shadow: 0 6px 14px rgba(106, 46, 158, 0.3); }
.stk-day.on .stk-dot svg { width: 13px; height: 13px; }
.stk-day.today .stk-dl { color: var(--text); font-weight: 700; }
.stk-day.today .stk-dot { outline: 2px solid var(--lbA); outline-offset: 2px; }
.stk-day.future { opacity: 0.45; }
.stk-stats { display: flex; justify-content: space-between; gap: 14px; margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line); }
.stk-stats span { display: block; font-size: 8.5px; letter-spacing: 0.1em; color: var(--text-faint); margin-bottom: 4px; }
.stk-stats b { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stk-stats i { font-style: normal; font-size: 13px; font-weight: 600; color: var(--text-faint); }
.stk-how { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; margin-top: 14px; border: 0; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700; color: var(--text); background: var(--surface); box-shadow: var(--neu-in-sm); border-radius: 13px; padding: 12px 15px; }
.stk-how svg { width: 15px; height: 15px; color: var(--text-faint); transition: transform 0.25s ease; }
.stk-rows { display: flex; flex-direction: column; gap: 12px; padding: 14px 4px 2px; }
.stk-row { display: flex; align-items: flex-start; gap: 10px; font-size: 12px; color: var(--text-soft); line-height: 1.5; }
.stk-ri { width: 26px; height: 26px; flex: none; border-radius: 9px; background: var(--surface); box-shadow: var(--neu-in-sm); display: flex; align-items: center; justify-content: center; color: var(--lbA); }
.stk-ri svg { width: 13px; height: 13px; }
.perf-duo { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; margin-top: 16px; }
@media (max-width: 1100px) { .perf-duo { grid-template-columns: 1fr; } }

/* Escrow ticket — the receipt for locked terms */
.esc-veil { position: fixed; inset: 0; z-index: 150; background: rgba(15, 16, 20, 0.45); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 20px; zoom: 1.176; animation: viewfade 0.3s ease; }
.esc-ticket { position: relative; width: 386px; max-width: 100%; background: var(--card); border-radius: 22px; box-shadow: var(--neu-out), 0 30px 70px rgba(0, 0, 0, 0.35); animation: rewardPop 0.5s cubic-bezier(0.22, 1.4, 0.36, 1); }
.esc-ticket::before, .esc-ticket::after { content: ''; position: absolute; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%; background: var(--bg, #f0f1f5); }
.esc-ticket::before { left: -15px; }
.esc-ticket::after { right: -15px; }
.esc-top { padding: 28px 28px 22px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.esc-check { width: 62px; height: 62px; border-radius: 50%; background: var(--surface); box-shadow: var(--neu-in-sm); display: flex; align-items: center; justify-content: center; color: var(--lbA); animation: rewardPop 0.6s cubic-bezier(0.22, 1.4, 0.36, 1) 0.15s backwards; }
.esc-check svg { width: 30px; height: 30px; }
.esc-h { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; margin-top: 14px; }
.esc-s { font-size: 12.5px; color: var(--text-faint); margin-top: 5px; line-height: 1.5; }
.esc-body { padding: 0 28px 24px; display: flex; flex-direction: column; gap: 16px; }
.esc-dash { border-top: 2px dashed var(--line); }
.esc-grid { display: flex; justify-content: space-between; gap: 14px; text-align: left; }
.esc-grid p, .esc-when p { margin: 0; }
.esc-k { font-size: 8.5px; letter-spacing: 0.11em; color: var(--text-faint); margin-bottom: 4px; }
.esc-v { font-size: 13.5px; font-weight: 700; }
.esc-v.big { font-size: 17px; font-weight: 800; }
.esc-acct { display: flex; align-items: center; gap: 12px; background: var(--surface); box-shadow: var(--neu-in-sm); border-radius: 14px; padding: 13px 15px; text-align: left; }
.esc-acct .ad-ic { flex: none; }
.esc-acct b { display: block; font-size: 13px; }
.esc-acct small { font-size: 10.5px; color: var(--text-faint); }
.esc-bar { display: flex; flex-direction: column; align-items: center; color: var(--text); }
.esc-bar p { margin: 8px 0 0; font-size: 11px; color: var(--text-faint); letter-spacing: 0.3em; }
.esc-actions { display: flex; gap: 9px; padding: 0 28px 26px; }
.esc-actions .btn-mach { flex: 1; }

/* ---- take-the-other-side terms + secure checkout ---- */
.bt-card { position: relative; width: min(430px, 92vw); max-height: 86vh; overflow-y: auto; background: var(--card); border-radius: 26px; box-shadow: 0 30px 80px rgba(15, 18, 28, .28); padding: 24px 26px; }
.bt-x { position: absolute; top: 16px; right: 16px; width: 30px; height: 30px; border-radius: 50%; border: none; cursor: pointer; background: var(--surface); box-shadow: var(--neu-out-sm); color: var(--text-soft); font-size: 12px; }
.bt-x.bk { right: auto; left: 16px; font-size: 15px; line-height: 1; }
.bt-chip { display: inline-block; font-size: 8.5px; letter-spacing: .12em; font-weight: 700; color: var(--lbA); background: var(--surface); box-shadow: var(--neu-in-sm); padding: 4px 10px; border-radius: 999px; margin-bottom: 10px; }
.bt-h { font-size: 19px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 14px; }
.bt-vs { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); box-shadow: var(--neu-in-sm); border-radius: 16px; padding: 14px 16px 12px; margin-bottom: 14px; }
.bt-side { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; min-width: 0; }
.bt-side b { font-size: 12.5px; }
.bt-side small { font-size: 7.5px; letter-spacing: .1em; color: var(--text-faint); font-weight: 700; }
.bt-av { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; color: #fff; overflow: hidden; margin-bottom: 3px; }
.bt-av img { width: 100%; height: 100%; object-fit: cover; }
.bt-vs-tag { font-size: 9px; letter-spacing: .14em; color: var(--text-faint); font-weight: 700; }
.bt-rows { margin-bottom: 14px; }
.bt-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8.5px 2px; border-bottom: 1px dashed var(--line); }
.bt-row:last-child { border-bottom: none; }
.bt-row-k span { display: block; font-size: 12px; color: var(--text-soft); }
.bt-row-k small { display: block; font-size: 9px; color: var(--text-faint); margin-top: 1px; }
.bt-row > b { font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.bt-out { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.bt-win, .bt-lose { border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.bt-win { background: linear-gradient(150deg, rgba(16, 185, 129, .04), rgba(16, 185, 129, .15)); border: 1px solid rgba(16, 185, 129, .2); align-items: flex-end; text-align: right; }
.bt-lose { background: var(--surface); box-shadow: var(--neu-in-sm); }
.bt-win small, .bt-lose small { font-size: 7.5px; letter-spacing: .11em; font-weight: 700; color: var(--text-faint); }
.bt-win b { font-size: 18px; color: var(--green); font-variant-numeric: tabular-nums; }
.bt-lose b { font-size: 18px; color: var(--text); font-variant-numeric: tabular-nums; }
.bt-win span, .bt-lose span { font-size: 9.5px; color: var(--text-faint); line-height: 1.45; }
.bt-note { font-size: 10.5px; color: var(--text-faint); margin-bottom: 14px; line-height: 1.55; }
.bt-go { width: 100%; }
.bt-ey { font-size: 8.5px; letter-spacing: .14em; font-weight: 700; color: var(--lbA); margin-bottom: 8px; }
.bt-amt { font-size: 34px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.bt-amt-s { font-size: 11px; color: var(--text-faint); margin: 4px 0 16px; }
.bt-pmh { font-size: 8.5px; letter-spacing: .12em; font-weight: 700; color: var(--text-faint); margin: 2px 0 8px; }
.bt-pm { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 14px; background: var(--surface); box-shadow: var(--neu-in-sm); margin-bottom: 8px; cursor: pointer; }
.bt-pm.on { background: var(--card); box-shadow: var(--neu-out-sm); outline: 1.5px solid var(--lbA); }
.bt-pm.off { opacity: .45; cursor: not-allowed; }
.bt-radio { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--text-faint); flex: none; }
.bt-pm.on .bt-radio { border-color: var(--lbA); background: radial-gradient(circle, var(--lbA) 0 4.5px, transparent 5px); }
.bt-pm-ic { width: 30px; height: 30px; border-radius: 9px; background: var(--card); box-shadow: var(--neu-out-sm); display: flex; align-items: center; justify-content: center; font-size: 14px; flex: none; }
.bt-pm-tx b { display: block; font-size: 12.5px; }
.bt-pm-tx small { font-size: 9.5px; color: var(--text-faint); }
.bt-fees { margin: 12px 0 14px; }
.bt-fee { display: flex; justify-content: space-between; align-items: baseline; font-size: 11.5px; color: var(--text-soft); padding: 7px 2px; border-bottom: 1px dashed var(--line); }
.bt-fee b { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--text); }
.bt-fee.tot { border-bottom: none; font-size: 13px; }
.bt-fee.tot span, .bt-fee.tot b { font-weight: 800; color: var(--text); }
.bt-secure { font-size: 8px; letter-spacing: .08em; color: var(--text-faint); text-align: center; margin-top: 12px; line-height: 1.7; }

/* ---- your battles cards ---- */
.mb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px; }
.mb-card { background: var(--card); border-radius: 20px; box-shadow: var(--neu-out-sm); padding: 18px 20px 16px; cursor: pointer; }
.mb-top { display: flex; align-items: center; gap: 10px; font-size: 8.5px; letter-spacing: .09em; font-weight: 700; color: var(--text-faint); margin-bottom: 14px; }
.mb-live { display: inline-flex; align-items: center; gap: 5px; color: var(--green); }
.mb-watch { margin-left: auto; font-weight: 600; letter-spacing: .04em; }
.mb-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.mb-side { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mb-side.opp { align-items: flex-end; text-align: right; }
.mb-who { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; }
.mb-tag { font-size: 7px; letter-spacing: .11em; font-weight: 800; color: var(--lbA); background: var(--surface); box-shadow: var(--neu-in-sm); padding: 2.5px 7px; border-radius: 999px; }
.mb-ret { font-size: 21px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.mb-ret.up { color: var(--green); }
.mb-ret.down { color: var(--text-soft); }
.mb-mid { display: flex; flex-direction: column; align-items: center; gap: 2px; background: var(--surface); box-shadow: var(--neu-in-sm); border-radius: 12px; padding: 8px 14px; flex: none; }
.mb-mid b { font-size: 13px; font-variant-numeric: tabular-nums; }
.mb-mid small { font-size: 7px; letter-spacing: .12em; color: var(--text-faint); font-weight: 700; }
.mb-lead { height: 6px; border-radius: 3px; background: var(--surface); box-shadow: var(--neu-in-sm); overflow: hidden; margin-bottom: 12px; }
.mb-lead span { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--lbA), #9081DF); transition: width .6s ease; }
.mb-foot { display: flex; align-items: center; gap: 10px; font-size: 10.5px; color: var(--text-faint); min-height: 26px; }
.mb-foot .link-btn { margin: 0 0 0 auto; }

/* ---- frosted prize-pool card ---- */
.frost-card { position: relative; height: 138px; border-radius: 18px; overflow: hidden; box-shadow: var(--neu-out-sm); perspective: 1000px; }
.frost-inner { position: absolute; inset: 0; transition: transform .12s ease-out; will-change: transform; }
.frost-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.frost-shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(22, 18, 44, .5), rgba(22, 18, 44, .12) 55%, transparent); }
.frost-tx { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; text-align: center; padding: 0 16px; }
.frost-tx small { font-size: 8px; letter-spacing: .16em; font-weight: 700; color: rgba(255, 255, 255, .88); }
.frost-tx b { font-size: 37px; font-weight: 800; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; background: linear-gradient(to bottom, rgba(255, 255, 255, .98), rgba(255, 255, 255, .66)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 9px rgba(28, 18, 82, .5)); }
.frost-date { position: absolute; bottom: 10px; right: 14px; font-size: 8px; letter-spacing: .08em; color: rgba(255, 255, 255, .78); }

/* ---- topbar winnings pills ---- */
.tw-pill { display: inline-flex; align-items: center; gap: 8px; background: var(--card); box-shadow: var(--neu-out-sm); border-radius: 999px; padding: 10px 16px; font-size: 12.5px; color: var(--text-faint); white-space: nowrap; }
.tw-pill b { color: var(--text); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tw-pill { cursor: pointer; transition: transform .15s ease; }
.tw-pill:hover { transform: translateY(-1px); }
.acct-dd-side { padding: 10px 18px; font-size: 12.5px; margin-left: 12px; }
.acct-dd { display: flex; align-items: center; }

/* ---- global leaderboard table ---- */
.lbb-search { display: flex; align-items: center; gap: 8px; background: var(--surface); box-shadow: var(--neu-in-sm); border-radius: 12px; padding: 9px 14px; min-width: 230px; }
.lbb-search input { border: 0; outline: 0; background: none; font: inherit; font-size: 12.5px; color: var(--text); width: 100%; }
.lbb-search input::placeholder { color: var(--text-faint); }
.lbb-table th { white-space: nowrap; }
.lbb-th { border: 0; background: none; cursor: pointer; font: inherit; font-size: inherit; letter-spacing: inherit; color: inherit; display: inline-flex; align-items: center; gap: 4px; padding: 0; }
.lbb-th.on { color: var(--lbA); }
.lbb-rank { color: var(--text-faint); font-size: 11px; }
.lbb-who { display: inline-flex; align-items: center; gap: 9px; font-size: 12.5px; }
.lbb-who b { font-weight: 700; }
.lbb-club { font-size: 8.5px; letter-spacing: .08em; font-weight: 800; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.lbb-ring { display: block; }
.lbb-ver { display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; border-radius: 50%; background: #1d9bf0; color: #fff; font-size: 10px; font-weight: 800; }
.lbb-nver { color: var(--text-faint); }
.lbb-add { padding: 7px 14px; font-size: 11.5px; }
.lbb-spark svg { display: block; opacity: .9; }

/* ---- leaderboard hero — the globe of live escrow routes ---- */
.bd-hero { position: relative; overflow: hidden; background: var(--card); border-radius: 24px; box-shadow: var(--neu-out-sm); padding: 34px 38px; margin-bottom: 22px; min-height: 310px; display: flex; align-items: center; --wm-dot: rgba(24, 26, 34, .17); }
body.dark .bd-hero { --wm-dot: rgba(255, 255, 255, .19); }
.bd-map { position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; padding-right: 22px; pointer-events: none; }
.bd-map svg { height: 92%; width: auto; max-width: none; }
.bd-fade { position: absolute; inset: 0; background: linear-gradient(90deg, var(--card) 26%, rgba(255, 255, 255, 0) 62%); pointer-events: none; }
body.dark .bd-fade { background: linear-gradient(90deg, var(--card) 26%, rgba(0, 0, 0, 0) 62%); }
.bd-hero-tx { position: relative; z-index: 2; max-width: 480px; }
.bd-stats { display: flex; gap: 34px; }
.bd-stats b { display: block; font-size: 24px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.bd-stats span { font-size: 8px; letter-spacing: .12em; color: var(--text-faint); }

/* ---- the Paktos Card (points card) ---- */
.pkc-grid { display: grid; grid-template-columns: minmax(300px, 440px) 1fr; gap: 30px; align-items: center; background: var(--card); border-radius: 20px; box-shadow: var(--neu-out-sm); padding: 26px; }
@media (max-width: 860px) { .pkc-grid { grid-template-columns: 1fr; } }
.pkc { position: relative; width: 100%; aspect-ratio: 1.586; border-radius: 20px; background: #fdfdfe; box-shadow: 0 20px 46px rgba(28, 28, 58, .18); overflow: hidden; }
.pkc-wash { position: absolute; inset: -8%; background:
  radial-gradient(90% 70% at 10% 96%, rgba(250, 214, 148, .55), transparent 42%),
  radial-gradient(80% 65% at 36% 102%, rgba(255, 148, 158, .45), transparent 48%),
  radial-gradient(90% 75% at 66% 106%, rgba(190, 120, 228, .38), transparent 52%),
  radial-gradient(100% 80% at 96% 92%, rgba(122, 140, 240, .4), transparent 55%);
  filter: blur(16px); }
.pkc-mark { position: absolute; top: 18px; left: 20px; display: flex; align-items: center; gap: 8px; color: #111216; }
.pkc-mark svg { width: 25px; height: 19px; display: block; }
.pkc-mark b { font-size: 16.5px; font-weight: 700; letter-spacing: -.01em; }
.pkc-wm { position: absolute; top: 7%; right: 5%; width: 54%; }
.pkc-wm svg { width: 100%; height: auto; display: block; }
.pkc-wm svg path { fill: none; stroke: #e9e7f1; stroke-width: .55; }
.pkc-name { position: absolute; left: 20px; bottom: 54px; font-size: 19px; font-weight: 700; color: #17181c; letter-spacing: -.01em; }
.pkc-num { position: absolute; left: 20px; bottom: 24px; font-size: 13.5px; letter-spacing: .16em; color: #2c2d34; }
.pkc-circ { position: absolute; right: 20px; bottom: 20px; display: flex; }
.pkc-circ i { width: 27px; height: 27px; border-radius: 50%; background: rgba(96, 96, 118, .45); }
.pkc-circ i:last-child { margin-left: -11px; background: rgba(58, 58, 80, .5); }
.pkc-panel { min-width: 0; }
.pkc-ey { font-size: 8.5px; letter-spacing: .13em; font-weight: 700; color: var(--text-faint); }
.pkc-bal { font-size: 36px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin: 4px 0 8px; }
.pkc-sub { font-size: 12.5px; color: var(--text-soft); line-height: 1.55; margin: 0 0 14px; }
.pkc-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.bt-pm-ic svg { width: 16px; height: 12px; display: block; }
@media (max-width: 900px) { .bd-map { opacity: .35; } }

/* ---- explore — the trader fan (same system as Flick) ---- */
.ex-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 0 34px; }
.exfan-wrap { position: relative; height: 600px; width: 100%; margin: 0; }
.exfan-wrap .fan-card { width: min(380px, 88vw); top: 16px; }
.ex-card { background: var(--card); border-radius: 26px; box-shadow: var(--neu-out); overflow: hidden; touch-action: none; }
.fan-card.ctr .ex-card { cursor: grab; }
.fan-card.ctr .ex-card:active { cursor: grabbing; }
.ex-hero { height: 168px; display: flex; align-items: center; justify-content: center; position: relative; }
.ex-hero > span:first-child { font-size: 74px; filter: drop-shadow(0 6px 14px rgba(20, 16, 50, .25)); }
.ex-club { position: absolute; top: 14px; right: 14px; font-size: 8px; letter-spacing: .09em; font-weight: 800; padding: 4px 10px; border-radius: 999px; border: 1px solid; }
.ex-body { padding: 18px 20px 18px; display: flex; flex-direction: column; gap: 12px; }
.ex-name { display: flex; align-items: center; gap: 7px; font-size: 18px; font-weight: 800; letter-spacing: -.01em; cursor: pointer; }
.ex-view { margin-left: auto; font-size: 8px; letter-spacing: .1em; color: var(--lbA); font-weight: 700; }
.ex-bio { font-size: 12.5px; color: var(--text-soft); line-height: 1.5; min-height: 38px; margin: 0; }
.ex-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.ex-tiles > div { background: var(--card); box-shadow: var(--neu-out-sm); border-radius: 12px; padding: 9px 12px; }
.ex-tiles span { display: block; font-size: 7.5px; letter-spacing: .1em; color: var(--text-faint); font-weight: 700; }
.ex-tiles b { display: block; font-size: 14.5px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
.ex-spark svg { width: 100%; height: 44px; display: block; }
.ex-nav { display: flex; gap: 12px; margin: 2px 0 14px; }
.ex-actions { display: flex; align-items: center; gap: 16px; }
.ex-btn { width: 60px; height: 60px; border-radius: 50%; border: 0; cursor: pointer; background: var(--card); box-shadow: var(--neu-out-sm); display: flex; align-items: center; justify-content: center; transition: transform .15s ease; }
.ex-btn:hover { transform: translateY(-2px); }
.ex-btn:active { box-shadow: var(--neu-in-sm); }
.ex-btn.no { color: #e5484d; }
.ex-btn.yes { color: #10b981; }
.ex-hint { font-size: 8px; letter-spacing: .12em; color: var(--text-faint); margin-top: 14px; }
.ex-duel { border-radius: 999px; padding: 15px 30px; font-size: 14px; }
@media (max-width: 1100px) { .tw-pill { display: none; } }

/* ---- battles across the globe (dotted world map) ---- */
.wm-card { background: var(--card); border-radius: 20px; box-shadow: var(--neu-out-sm); padding: 14px 18px 8px; margin: 0 auto 22px; max-width: 1000px; --wm-dot: rgba(24, 26, 34, .18); }
body.dark .wm-card { --wm-dot: rgba(255, 255, 255, .2); }
.wm-card svg { width: 100%; height: auto; display: block; }
.wm-arc { stroke-dasharray: 1; stroke-dashoffset: 1; animation: wmDash 2.4s ease-out forwards; }
@keyframes wmDash { to { stroke-dashoffset: 0; } }
.wm-city { font: 700 9px ui-monospace, Menlo, monospace; fill: var(--text-faint); letter-spacing: .08em; }

.icon-btn.avatar-btn { display: inline-flex; align-items: center; justify-content: center; }
.tb-av { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }

/* ---------------- Partner portal ---------------- */
.pt-hero { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 26px; padding: 26px 28px; margin-bottom: 18px; }
.pt-eyebrow { font-size: 9.5px; letter-spacing: .18em; color: var(--accent-a); margin-bottom: 10px; }
.pt-title { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 8px; }
.pt-desc { font-size: 13px; color: var(--text-soft); line-height: 1.6; max-width: 560px; }
.pt-desc b { color: var(--text); }
.pt-rate { border-radius: 20px; background: linear-gradient(160deg, rgba(124, 58, 237, .1), rgba(217, 70, 239, .07)); box-shadow: var(--neu-in-sm); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; padding: 20px; }
.pt-rate b { font-size: 44px; font-weight: 800; letter-spacing: -.03em; background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.pt-rate span { font-size: 11.5px; color: var(--text-soft); }
.pt-rate .mono { font-size: 8.5px; letter-spacing: .12em; color: var(--text-faint); }
.pt-sub { font-size: 9.5px; letter-spacing: .08em; color: var(--text-faint); margin-top: 3px; }
.pt-status { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0 16px; }
.pt-status > div, .pt-pstat > div { background: var(--surface); box-shadow: var(--neu-in-sm); border-radius: 14px; padding: 13px; text-align: center; }
.pt-status b, .pt-pstat b { display: block; font-size: 18px; font-weight: 800; }
.pt-status span, .pt-pstat span { display: block; font-size: 8.5px; letter-spacing: .1em; color: var(--text-faint); margin-top: 4px; }
.pt-pstat { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.pf-row { display: flex; align-items: center; gap: 12px; margin-bottom: 11px; }
.pf-l { width: 64px; flex: none; font-size: 9.5px; letter-spacing: .1em; color: var(--text-faint); }
.pf-bar { flex: 1; height: 26px; border-radius: 999px; background: var(--surface); box-shadow: var(--neu-in-sm); overflow: hidden; }
.pf-bar i { display: flex; align-items: center; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent-a), var(--accent-b)); padding-left: 12px; min-width: 54px; }
.pf-bar b { font-size: 11px; color: #fff; font-style: normal; font-variant-numeric: tabular-nums; }
.pf-pc { width: 36px; text-align: right; font-size: 10px; color: var(--text-faint); }
.pa-row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text-soft); padding: 7px 0; }
.pa-row + .pa-row { border-top: 1px solid var(--surface); }
.pa-ago { margin-left: auto; font-size: 10px; color: var(--text-faint); }
.pt-fine { margin-top: 22px; font-size: 10.5px; color: var(--text-faint); line-height: 1.6; text-align: center; }
@media (max-width: 860px) { .pt-hero { grid-template-columns: 1fr; } }

/* ---------------- Battle the machines ---------------- */
.mach-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.mach-card { background: var(--card); border-radius: 24px; box-shadow: var(--neu-out); padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
.mach-head { display: flex; align-items: flex-start; gap: 12px; }
.mach-head .tile-ic { color: #fff; }
.mach-name { font-size: 15.5px; font-weight: 800; letter-spacing: -.01em; }
.house-chip { margin-left: 8px; font-size: 8.5px; letter-spacing: .1em; padding: 3px 8px; border-radius: 999px; background: linear-gradient(135deg, rgba(124, 58, 237, .14), rgba(217, 70, 239, .14)); color: var(--accent-a); font-weight: 800; vertical-align: 2px; }
.mach-by { display: block; font-size: 11px; color: var(--text-faint); margin-top: 3px; }
.mach-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.btn-mach { position: relative; z-index: 0; overflow: hidden; border: 0; cursor: pointer; border-radius: 14px; padding: 13px; font: inherit; font-size: 13.5px; font-weight: 700; color: #241a3f; background: linear-gradient(105deg, #d9d6fa, #e5cdf6 45%, #f7cfe2); box-shadow: 0 10px 22px rgba(144, 129, 223, .30); transition: transform .2s ease, box-shadow .2s ease; }
.btn-mach::before { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, #b9c4fb, #dcb9f8, #fbc0dd); filter: blur(16px); opacity: 0; transition: opacity .5s ease; }

/* ---------------- Clans ---------------- */
.clan-chip { display: inline-flex; align-items: center; justify-content: center; border-radius: 11px; padding: 8px 11px; color: #fff; font-weight: 800; font-size: 12px; letter-spacing: .08em; flex: none; box-shadow: 0 6px 14px rgba(60, 50, 120, .25); }

.spec-leadtxt { font-size: 10.5px; letter-spacing: .12em; color: var(--text-faint); margin-bottom: 10px; }

.spt-r i { width: 8px; height: 8px; border-radius: 3px; flex: none; }

.spec-legend { display: flex; align-items: center; gap: 18px; margin-top: 12px; font-size: 10.5px; color: var(--text-faint); }

.icg-chart svg { display: block; width: 100%; height: 100%; }
.icg-tip { position: absolute; top: 6px; left: 6px; pointer-events: none; background: var(--card); box-shadow: var(--neu-out-sm); border-radius: 10px; padding: 5px 9px; font-size: 10.5px; font-weight: 700; color: var(--text); opacity: 0; transition: opacity .15s ease; white-space: nowrap; }
