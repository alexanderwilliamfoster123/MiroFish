<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Paktos — Live Tournaments</title>
<style>
/* ==================================================================
   Paktos live dashboard — standalone HTML build.
   Soft-neumorphic, Apple-clean. Light + dark themes via CSS variables.
   ================================================================== */

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  --bg: #eef1f6;
  --surface: #f4f6fa;
  --surface-raised: #f8fafd;
  --card: #fbfcfe;
  --text: #17181c;
  --text-soft: #5f6672;
  --text-faint: #9aa1ad;
  --line: rgba(23, 24, 28, 0.06);
  --shadow-dark: #d3d9e3;
  --shadow-light: #ffffff;
  --accent-a: #7c3aed;
  --accent-b: #d946ef;
  --green: #16a34a;
  --neu-out: -8px -8px 18px var(--shadow-light), 8px 8px 18px var(--shadow-dark);
  --neu-out-sm: -4px -4px 10px var(--shadow-light), 4px 4px 10px var(--shadow-dark);
  --neu-in: inset 4px 4px 10px var(--shadow-dark), inset -4px -4px 10px var(--shadow-light);
  --neu-in-sm: inset 2px 2px 6px var(--shadow-dark), inset -2px -2px 6px var(--shadow-light);

  display: flex;
  min-height: 100vh;
  zoom: 0.85;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
  transition: background 0.4s ease, color 0.4s ease;
}

body.dark {
  --bg: #16181d;
  --surface: #1b1e24;
  --surface-raised: #20242b;
  --card: #1e2228;
  --text: #eef0f4;
  --text-soft: #a4abb8;
  --text-faint: #6b7280;
  --line: rgba(255, 255, 255, 0.06);
  --shadow-dark: #0d0e12;
  --shadow-light: #23272f;
}

button { font-family: inherit; }

.mono {
  font-family: 'SF Mono', ui-monospace, 'JetBrains Mono', Menlo, monospace;
  font-size: 0.72em;
  letter-spacing: 0.14em;
  font-weight: 500;
}

.mono-num { font-variant-numeric: tabular-nums; }

.dot-sep { color: var(--text-faint); margin: 0 0.35em; }

/* ---------------- Sidebar ---------------- */

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  width: 264px;
  flex: 0 0 264px;
  display: flex;
  flex-direction: column;
  padding: 28px 20px 24px;
}

.sidebar-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 40px;
}

.brand { display: flex; align-items: center; gap: 10px; }

.brand-mark { width: 28px; height: 22px; color: var(--text); display: inline-flex; }
.brand-mark svg { width: 100%; height: 100%; }

.brand-name { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }

.nav { display: flex; flex-direction: column; gap: 10px; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 10px 12px;
  border: none;
  border-radius: 16px;
  background: transparent;
  color: var(--text-soft);
  font-size: 15.5px;
  font-weight: 500;
  letter-spacing: -0.01em;
  cursor: pointer;
  transition: all 0.25s ease;
}

.nav-item:hover { color: var(--text); }

.nav-item.active {
  background: var(--surface-raised);
  color: var(--text);
  font-weight: 600;
  box-shadow: var(--neu-out-sm);
}

.nav-icon {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--surface-raised);
  box-shadow: var(--neu-out-sm);
  color: var(--text-soft);
  transition: all 0.25s ease;
}

.nav-icon svg { width: 18px; height: 18px; }

.nav-item.active .nav-icon {
  background: linear-gradient(135deg, #f7a8d8, var(--accent-a));
  color: #fff;
  box-shadow: 0 6px 14px rgba(124, 58, 237, 0.35);
}

.sidebar-bottom { margin-top: auto; }

.user-card { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 18px; }

.user-avatar {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  padding: 2px;
  background: linear-gradient(135deg, var(--accent-b), var(--accent-a));
  display: inline-flex;
}

.user-avatar-inner {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: #2b2f36;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 16px;
}

.user-meta { display: flex; flex-direction: column; gap: 2px; }
.user-name { font-weight: 600; font-size: 15px; }

.user-rank {
  font-family: 'SF Mono', ui-monospace, Menlo, monospace;
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--text-faint);
}

/* ---------------- Main / top bar ---------------- */

.main { flex: 1; min-width: 0; padding: 14px 14px 14px 0; }

.main-inner {
  background: var(--surface);
  border-radius: 28px;
  box-shadow: var(--neu-out);
  padding: 26px 30px 36px;
  min-height: calc(100vh / 0.85 - 28px);
  transition: background 0.4s ease;
}

.topbar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 24px;
}

.page-title { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }

.page-sub { margin-top: 6px; color: var(--text-faint); font-size: 13px; }
.page-sub .mono { font-size: 11px; }

.topbar-right { display: flex; align-items: center; gap: 14px; }

/* Neumorphic segmented Trader/Partner switch */

.segmented { display: inline-flex; cursor: pointer; user-select: none; }

.segmented-state { display: none; }
.segmented[hidden] { display: none; }

.segmented-track {
  position: relative;
  isolation: isolate;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  width: 188px;
  height: 42px;
  border-radius: 21px;
  background: var(--surface);
  box-shadow: var(--neu-in-sm);
  overflow: hidden;
}

.segmented-thumb {
  position: absolute;
  z-index: 0;
  top: 4px;
  left: 4px;
  width: calc(50% - 8px);
  height: calc(100% - 8px);
  border-radius: 17px;
  background: var(--surface-raised);
  box-shadow: var(--neu-out-sm);
  transition: transform 0.4s cubic-bezier(0.85, 0.05, 0.18, 1.35);
}

.segmented-state:checked ~ .segmented-track .segmented-thumb,
.segmented-state:checked + .segmented-track .segmented-thumb {
  transform: translateX(calc(100% + 8px));
}

.segmented-option {
  position: relative;
  z-index: 1;
  text-align: center;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text-faint);
  transition: color 0.3s ease;
}

.segmented-track span.segmented-option:first-of-type { color: var(--text); font-weight: 600; }
.segmented-state:checked + .segmented-track span.segmented-option:first-of-type { color: var(--text-faint); font-weight: 500; }
.segmented-state:checked + .segmented-track span.segmented-option:last-of-type { color: var(--text); font-weight: 600; }

/* Theme slide toggle (Uiverse-style indicator slider) */

.theme-label { display: inline-flex; align-items: center; cursor: pointer; }

.theme-toggle {
  isolation: isolate;
  position: relative;
  height: 32px;
  width: 64px;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: -6px -3px 8px 0 var(--shadow-light), 6px 3px 10px 0 var(--shadow-dark),
    3px 3px 4px 0 var(--shadow-dark) inset, -3px -3px 4px 0 var(--shadow-light) inset;
}

.theme-state { display: none; }

.theme-indicator {
  height: 100%;
  width: 200%;
  background: var(--surface);
  border-radius: 16px;
  transform: translate3d(-75%, 0, 0);
  transition: transform 0.4s cubic-bezier(0.85, 0.05, 0.18, 1.35), background 0.4s ease;
  box-shadow: -6px -3px 8px 0 var(--shadow-light), 6px 3px 10px 0 var(--shadow-dark);
}

.theme-state:checked ~ .theme-indicator { transform: translate3d(25%, 0, 0); }

.theme-icon {
  position: absolute;
  top: 50%;
  width: 15px;
  height: 15px;
  transform: translateY(-50%);
  color: var(--text-faint);
  pointer-events: none;
  transition: color 0.3s ease;
  z-index: 1;
}

.theme-icon svg { width: 100%; height: 100%; display: block; }

.theme-icon.sun { left: 9px; color: var(--text); }
.theme-icon.moon { right: 9px; }

.theme-state:checked ~ .theme-icon.sun { color: var(--text-faint); }
.theme-state:checked ~ .theme-icon.moon { color: var(--text); }

/* Icon buttons */

.icon-btn {
  position: relative;
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 14px;
  background: var(--surface);
  color: var(--text-soft);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--neu-out-sm);
  transition: all 0.25s ease;
  padding: 0;
}

.icon-btn svg { width: 19px; height: 19px; }
.icon-btn:hover { color: var(--text); }
.icon-btn:active { box-shadow: var(--neu-in-sm); }

.icon-btn.ghost { box-shadow: none; background: transparent; width: 34px; height: 34px; }
.icon-btn.round { border-radius: 50%; }

.bell-dot {
  position: absolute;
  top: 10px;
  right: 11px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent-b);
  box-shadow: 0 0 0 2.5px var(--surface);
  z-index: 1;
}

/* ---------------- Tabs ---------------- */

.tabs { display: flex; align-items: center; gap: 8px; margin-bottom: 26px; }

.tab {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 11px 20px;
  border: none;
  border-radius: 15px;
  background: transparent;
  color: var(--text-faint);
  font-size: 14.5px;
  font-weight: 500;
  letter-spacing: -0.01em;
  cursor: pointer;
  transition: all 0.25s ease;
}

.tab svg { width: 17px; height: 17px; }

.tab.active {
  background: var(--surface-raised);
  color: var(--text);
  font-weight: 600;
  box-shadow: var(--neu-out-sm);
}

.tab-count { color: var(--text-faint); font-weight: 500; }

/* ---------------- Hero ---------------- */

.hero {
  position: relative;
  border-radius: 24px;
  background: var(--card);
  box-shadow: var(--neu-out);
  padding: 32px 34px 28px;
  margin-bottom: 36px;
  overflow: hidden;
}

.hero-glow {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(52% 90% at 12% 0%, rgba(217, 70, 239, 0.07), transparent 60%),
    radial-gradient(45% 80% at 88% 100%, rgba(124, 58, 237, 0.06), transparent 60%);
  pointer-events: none;
}

.hero-content {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(300px, 0.9fr);
  gap: 44px;
  align-items: start;
}

.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--text-soft);
  margin-bottom: 14px;
}

.live-badge .mono { font-size: 11px; }

.pulse-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5);
  animation: pulse 2s infinite;
  flex: 0 0 auto;
}

.pulse-dot.purple {
  background: var(--accent-a);
  box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.45);
  animation-name: pulse-purple;
}

.pulse-dot.small { width: 6px; height: 6px; }
.pulse-dot.tiny { width: 5px; height: 5px; }
.pulse-dot.light { background: #a5f3c4; }

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.45); }
  70% { box-shadow: 0 0 0 7px rgba(34, 197, 94, 0); }
  100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}

@keyframes pulse-purple {
  0% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.4); }
  70% { box-shadow: 0 0 0 7px rgba(124, 58, 237, 0); }
  100% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0); }
}

.hero-title {
  margin-bottom: 16px;
  font-size: clamp(40px, 4.6vw, 58px);
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.hero-title-accent {
  background: linear-gradient(92deg, var(--accent-a) 10%, var(--accent-b) 90%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.hero-desc {
  margin-bottom: 30px;
  max-width: 470px;
  color: var(--text-soft);
  font-size: 15px;
  line-height: 1.55;
}

.hero-stats { display: flex; gap: 54px; margin-bottom: 32px; flex-wrap: wrap; }

.stat { display: flex; flex-direction: column; gap: 8px; }

.stat-label { color: var(--text-faint); font-size: 11px; }

.stat-value {
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}

.stat-value.sm { font-size: 21px; }

.hero-actions { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }

/* Primary dark pill button */

.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 15px 30px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(160deg, #24262c, #0c0d10);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
  cursor: pointer;
  box-shadow: 8px 10px 22px var(--shadow-dark), -6px -6px 16px var(--shadow-light),
    inset 0 1px 0 rgba(255, 255, 255, 0.12);
  transition: all 0.3s ease;
}

.btn-primary:hover { transform: translateY(-1px); }

.btn-primary:active {
  transform: translateY(1px);
  box-shadow: 3px 4px 10px var(--shadow-dark), -3px -3px 8px var(--shadow-light);
}

/* Neumorphic soft button (Uiverse-style) */

.btn-neu {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  color: var(--text);
  padding: 15px 28px;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.01em;
  border-radius: 14px;
  background: var(--surface-raised);
  cursor: pointer;
  border: none;
  transition: all 0.3s ease;
  box-shadow: 6px 6px 14px var(--shadow-dark), -6px -6px 14px var(--shadow-light);
}

.btn-neu:hover { color: var(--accent-a); }

.btn-neu:active {
  color: var(--text-soft);
  box-shadow: inset 4px 4px 12px var(--shadow-dark), inset -4px -4px 12px var(--shadow-light);
}

.btn-neu.enter { width: 100%; padding: 12px 18px; font-size: 14px; font-weight: 600; }

.hero-social { display: flex; align-items: center; gap: 12px; }

.avatar-stack { display: flex; }

.stack-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  border: 2.5px solid var(--card);
  margin-left: -9px;
}

.stack-avatar:first-child { margin-left: 0; }

.hero-social-text { color: var(--text-soft); font-size: 13.5px; }
.hero-social-text strong { color: var(--text); font-weight: 600; }

/* ---------------- Leaderboard ---------------- */

.leaderboard {
  background: var(--surface-raised);
  border-radius: 20px;
  box-shadow: var(--neu-out-sm);
  border: 1px solid var(--line);
  padding: 22px 22px 16px;
}

.leaderboard-head { display: flex; align-items: center; gap: 9px; margin-bottom: 18px; }

.leaderboard-title { font-size: 12px; color: var(--text); font-weight: 600; }

.leaderboard-list { list-style: none; display: flex; flex-direction: column; }

.leaderboard-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 10px;
  border-radius: 14px;
  transition: background 0.3s ease;
}

.leaderboard-row + .leaderboard-row { border-top: 1px solid var(--line); }

.leaderboard-row.me {
  background: var(--surface);
  box-shadow: var(--neu-in-sm);
  border-top-color: transparent;
}

.row-rank { color: var(--text-faint); font-size: 11px; width: 20px; }

.row-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, #cfd6e0, #aab3c2);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12.5px;
  font-weight: 600;
  overflow: hidden;
  flex: 0 0 auto;
}

.row-name {
  flex: 1;
  min-width: 0;
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.row-you { color: var(--accent-b); font-weight: 500; }

.row-flag { margin-left: 5px; font-size: 12.5px; }

.row-value {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-soft);
  transition: color 0.3s ease;
}

.row-value.ticked { color: var(--accent-a); }

.link-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  padding: 10px 8px;
  border: none;
  background: transparent;
  color: var(--text);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: gap 0.25s ease, color 0.25s ease;
}

.link-btn svg { width: 16px; height: 16px; }
.link-btn:hover { gap: 12px; color: var(--accent-a); }

/* ---------------- Sections ---------------- */

.section { margin-bottom: 46px; }
.section:last-child { margin-bottom: 0; }

.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.section-title { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }

.section-sub { margin-top: 6px; color: var(--text-faint); font-size: 13px; }
.section-sub .mono { font-size: 11px; }

.section-head-right { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }

/* LED live-feed switch (Uiverse-style, scaled down) */

.feed-switch { display: flex; align-items: center; gap: 12px; }

.feed-label { font-size: 10px; color: var(--text-faint); }

.switch-container {
  position: relative;
  width: 86px;
  height: 36px;
  background: var(--surface);
  border-radius: 50px;
  box-shadow: var(--neu-in-sm);
}

.toggle-checkbox { display: none; }

.switch {
  position: absolute;
  top: 50%;
  left: 0;
  width: 100%;
  height: 100%;
  transform: translateY(-50%);
  border-radius: 50px;
  overflow: hidden;
  cursor: pointer;
}

.switch .toggle {
  position: absolute;
  width: 44px;
  height: 28px;
  background: linear-gradient(145deg, var(--surface-raised), var(--surface));
  border-radius: 50px;
  top: 4px;
  left: 4px;
  box-shadow: -3px -3px 6px var(--shadow-light), 3px 3px 6px var(--shadow-dark);
  transition: all 0.3s ease-in-out;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  padding-left: 8px;
}

.led {
  width: 8px;
  height: 8px;
  background: var(--text-faint);
  border-radius: 50%;
  box-shadow: 0 0 8px 1px rgba(0, 0, 0, 0.15);
  transition: all 0.3s ease-in-out;
}

.toggle-checkbox:checked + .switch .toggle { left: 38px; }

.toggle-checkbox:checked + .switch .led {
  background: #22c55e;
  box-shadow: 0 0 10px 3px rgba(34, 197, 94, 0.6);
}

.switch:hover .toggle {
  box-shadow: -3px -3px 9px var(--shadow-light), 3px 3px 9px var(--shadow-dark);
}

/* Neumorphic search input (Uiverse-style) */

.neu-input {
  border: none;
  padding: 12px 18px;
  border-radius: 13px;
  width: 190px;
  background: var(--surface);
  color: var(--text);
  font-family: inherit;
  font-size: 13.5px;
  box-shadow: 6px 6px 14px var(--shadow-dark), -6px -6px 14px var(--shadow-light);
  transition: 0.3s;
}

.neu-input::placeholder { color: var(--text-faint); }

.neu-input:focus {
  outline: none;
  box-shadow: inset 5px 5px 12px var(--shadow-dark), inset -5px -5px 12px var(--shadow-light);
}

/* ---------------- Tournament cards ---------------- */

.tournament-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 18px;
}

.tournament-card {
  background: var(--card);
  border-radius: 20px;
  box-shadow: var(--neu-out-sm);
  padding: 20px 18px 18px;
  display: flex;
  flex-direction: column;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  cursor: pointer;
}


.tournament-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 20px;
}

.trophy-tile {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, #f9a8d4 0%, #c084fc 55%, #a855f7 100%);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 16px rgba(168, 85, 247, 0.3);
}

.trophy-tile svg { width: 20px; height: 20px; }

.live-tag { display: inline-flex; align-items: center; gap: 6px; color: var(--text-faint); }
.live-tag .mono { font-size: 10px; }

.tournament-name { margin-bottom: 6px; font-size: 11px; color: var(--text-soft); }

.tournament-pool {
  margin-bottom: 16px;
  font-size: 27px;
  font-weight: 700;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}

.tournament-meta {
  border-top: 1px dashed var(--line);
  padding-top: 13px;
  margin-bottom: 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
}

.tournament-meta p { font-size: 12.5px; color: var(--text-faint); }

.closes { color: var(--accent-a); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------------- Hall of Fame ---------------- */

.fame-card {
  background: var(--card);
  border-radius: 22px;
  box-shadow: var(--neu-out-sm);
  padding: 8px 26px;
}

.fame-scroll { overflow-x: auto; }

.fame-table { width: 100%; border-collapse: collapse; min-width: 760px; }

.fame-table thead th {
  text-align: left;
  padding: 18px 12px 14px;
  font-size: 10.5px;
  color: var(--text-faint);
  font-weight: 500;
  border-bottom: 1px solid var(--line);
}

.fame-table tbody td {
  padding: 15px 12px;
  font-size: 14px;
  border-bottom: 1px solid var(--line);
}

.fame-table tbody tr:last-child td { border-bottom: none; }
.fame-table tbody tr { transition: background 0.2s ease; }
.fame-table tbody tr:hover { background: var(--surface); }

.col-rank { width: 46px; }
.col-place, .col-pool, .col-entry { color: var(--text-soft); }
.col-tournament { color: var(--text); }
.col-winning { text-align: right; }

.rank-num { color: var(--accent-a); font-size: 12px; }

.fame-player { display: inline-flex; align-items: center; gap: 11px; }

.fame-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, #cfd6e0, #aab3c2);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
}

.fame-name { font-weight: 600; }

.winning-amount { display: block; font-weight: 700; font-variant-numeric: tabular-nums; }

.winning-return {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 3px;
  color: var(--green);
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.winning-return svg { width: 13px; height: 13px; }

.fame-empty { text-align: center; color: var(--text-faint); padding: 30px 0 !important; }

/* ---------------- Past tournaments ---------------- */

.pager { display: flex; gap: 10px; }

.past-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }

.past-card {
  background: var(--card);
  border-radius: 22px;
  box-shadow: var(--neu-out-sm);
  padding: 14px 14px 0;
  overflow: hidden;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}


.past-art {
  position: relative;
  height: 210px;
  border-radius: 15px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.art-silver { background: linear-gradient(150deg, #e9ebf2 0%, #d4d8e4 45%, #c3c9da 100%); }
.art-mag { background: linear-gradient(150deg, #ecedf3 0%, #dcdfe9 50%, #cdd2e0 100%); }
.art-duo { background: linear-gradient(150deg, #eceef4 0%, #dadee8 50%, #c9cfdd 100%); }

.dark .art-silver, .dark .art-mag, .dark .art-duo { filter: brightness(0.55) saturate(1.1); }

.past-chip {
  position: absolute;
  top: 14px;
  left: 14px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.55);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.7);
  color: #3c4250;
  font-size: 12.5px;
  font-weight: 500;
  z-index: 2;
}

.past-chip svg { width: 13px; height: 13px; }
.past-chip.right { left: auto; right: 14px; }

/* Stylised coin art */

.coin-scene { position: relative; display: flex; align-items: center; justify-content: center; }

.coin {
  position: relative;
  z-index: 1;
  width: 108px;
  height: 108px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: rotate(-10deg);
  animation: coin-float 5s ease-in-out infinite;
}

.coin svg { width: 52px; height: 40px; }

.coin-round {
  border-radius: 50%;
  background: radial-gradient(circle at 32% 26%, #ffffff 0%, #e3e6ee 38%, #b9bfd0 72%, #9aa2b8 100%);
  box-shadow:
    inset 0 -6px 14px rgba(90, 98, 125, 0.45),
    inset 0 6px 10px rgba(255, 255, 255, 0.9),
    0 22px 34px rgba(74, 82, 110, 0.35);
  color: #8d94ab;
}

.coin-square {
  border-radius: 26px;
  background: linear-gradient(140deg, #f472b6 0%, #c026d3 48%, #7c3aed 100%);
  box-shadow:
    inset 0 -6px 14px rgba(76, 15, 130, 0.55),
    inset 0 6px 10px rgba(255, 255, 255, 0.45),
    0 22px 34px rgba(124, 58, 237, 0.4);
  color: rgba(255, 255, 255, 0.92);
}

.coin-duo {
  border-radius: 26px;
  background: linear-gradient(140deg, #e879f9 0%, #a21caf 55%, #6d28d9 100%);
  box-shadow:
    inset 0 -6px 14px rgba(76, 15, 130, 0.55),
    inset 0 6px 10px rgba(255, 255, 255, 0.45),
    0 22px 34px rgba(124, 58, 237, 0.4);
  color: rgba(255, 255, 255, 0.92);
}

.coin-duo::before {
  content: '€';
  position: absolute;
  top: -26px;
  right: -34px;
  width: 76px;
  height: 76px;
  border-radius: 50%;
  background: radial-gradient(circle at 32% 26%, #ffffff 0%, #dfe3ec 40%, #adb5c9 100%);
  box-shadow:
    inset 0 -4px 10px rgba(90, 98, 125, 0.45),
    inset 0 4px 8px rgba(255, 255, 255, 0.9),
    0 16px 26px rgba(74, 82, 110, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  font-weight: 700;
  color: #7d859c;
  transform: rotate(12deg);
}

.coin-duo svg { transform: translate(-6px, 6px); }

@keyframes coin-float {
  0%, 100% { transform: rotate(-10deg) translateY(0); }
  50% { transform: rotate(-8deg) translateY(-7px); }
}

.coin-shadow {
  position: absolute;
  bottom: -34px;
  width: 120px;
  height: 22px;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(60, 66, 90, 0.28), transparent 70%);
}

.past-stats { display: flex; justify-content: space-between; padding: 22px 12px 20px; gap: 12px; }

.past-stats .stat { gap: 6px; }
.past-stats .stat-label { font-size: 10px; }

.past-footer {
  border-top: 1px solid var(--line);
  margin: 0 -14px;
  padding: 15px 26px 17px;
  text-align: center;
  color: var(--text-soft);
  font-size: 13.5px;
  background: var(--surface);
}

/* ---------------- Responsive ---------------- */

@media (max-width: 1420px) {
  .tournament-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

@media (max-width: 1180px) {
  .hero-content { grid-template-columns: 1fr; }
  .past-grid { grid-template-columns: 1fr; }
}

@media (max-width: 900px) {
  .sidebar { display: none; }
  .main { padding: 10px; }
  .main-inner { padding: 22px 18px 30px; }
  .tournament-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero { padding: 28px 22px; }
  .hero-stats { gap: 28px; }
  .topbar { flex-direction: column; }
}

@media (max-width: 560px) {
  .tournament-grid { grid-template-columns: 1fr; }
}

/* ==================================================================
   Multi-page app additions
   ================================================================== */

.view { display: none; }
.view.on { display: block; animation: viewfade 0.35s ease; }
@keyframes viewfade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translate(-50%, 20px);
  background: linear-gradient(160deg, #24262c, #0c0d10);
  color: #fff;
  padding: 12px 22px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  transition: all 0.35s ease;
  z-index: 100;
  box-shadow: 0 14px 30px rgba(0, 0, 0, 0.25);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 18px 9px 14px;
  border: none;
  border-radius: 12px;
  background: var(--surface);
  box-shadow: var(--neu-out-sm);
  color: var(--text-soft);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 22px;
  transition: all 0.25s ease;
}
.back-btn svg { width: 15px; height: 15px; }
.back-btn:hover { color: var(--text); }
.back-btn:active { box-shadow: var(--neu-in-sm); }

/* Stat tiles (terminal / performance / partner) */

.tile-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 18px;
  margin-bottom: 26px;
}
.tile {
  background: var(--card);
  border-radius: 18px;
  box-shadow: var(--neu-out-sm);
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.tile-ic {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 17px;
  flex: 0 0 auto;
  box-shadow: 0 8px 16px rgba(0, 0, 0, 0.14);
}
.tile-tx { min-width: 0; }
.tile-label { font-size: 10.5px; color: var(--text-faint); margin-bottom: 4px; }
.tile-value { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile-bar { margin-top: 7px; height: 6px; border-radius: 3px; background: var(--surface); box-shadow: var(--neu-in-sm); overflow: hidden; width: 110px; }
.tile-bar span { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent-a), var(--accent-b)); }

/* Pills & segments */

.pill-btn {
  padding: 8px 14px;
  border: none;
  border-radius: 11px;
  background: var(--surface);
  box-shadow: var(--neu-out-sm);
  color: var(--text-faint);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.22s ease;
  white-space: nowrap;
}
.pill-btn:hover { color: var(--text); }
.pill-btn.on { box-shadow: var(--neu-in-sm); color: var(--accent-a); }
.pill-btn small { display: block; font-size: 10px; color: var(--text-faint); font-weight: 500; margin-top: 2px; }

.chip-row { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 18px; }

/* Terminal */

.asset-row { display: flex; gap: 11px; flex-wrap: wrap; margin-bottom: 18px; }
.asset-chip {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px 8px 9px;
  border: none;
  border-radius: 14px;
  background: var(--card);
  box-shadow: var(--neu-out-sm);
  cursor: pointer;
  transition: all 0.22s ease;
  color: var(--text);
}
.asset-chip.on { box-shadow: var(--neu-in-sm); background: var(--surface); }
.asset-ic {
  width: 30px; height: 30px; border-radius: 10px; color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
}
.asset-tx { text-align: left; }
.asset-sym { font-size: 12.5px; font-weight: 700; display: block; }
.asset-px { font-size: 10.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; }

.term-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.65fr) minmax(300px, 0.85fr);
  gap: 22px;
  margin-bottom: 26px;
  align-items: start;
}

.chart-card { background: var(--card); border-radius: 20px; box-shadow: var(--neu-out-sm); padding: 22px; }
.chart-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.chart-sym { font-weight: 700; font-size: 17px; }
.chart-sym span { color: var(--text-faint); font-weight: 500; font-size: 13px; margin-left: 6px; }
.chart-px { font-size: 25px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; text-align: right; }
.chart-chg { font-size: 12.5px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.tf-row { display: flex; gap: 8px; margin: 16px 0 12px; flex-wrap: wrap; }
canvas.chart { width: 100%; height: 290px; display: block; border-radius: 12px; }

.up { color: var(--green); }
.down { color: #e5484d; }

.ticket { background: var(--card); border-radius: 20px; box-shadow: var(--neu-out-sm); padding: 20px; display: flex; flex-direction: column; gap: 15px; }
.t-label { font-size: 10.5px; color: var(--text-faint); display: flex; justify-content: space-between; align-items: baseline; }
.t-label b { color: var(--text-soft); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.seg-grid { display: grid; gap: 8px; }
.seg-grid.c3 { grid-template-columns: repeat(3, 1fr); }
.seg-grid.c4 { grid-template-columns: repeat(4, 1fr); }
.rr-wrap input[type="range"] { width: 100%; accent-color: var(--accent-a); margin-top: 8px; }
.rr-plain { font-size: 12.5px; color: var(--text-soft); margin-top: 6px; }
.rr-plain b { color: var(--text); }
.dir-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dir-btn {
  padding: 15px 10px; border: none; border-radius: 15px;
  font-weight: 700; font-size: 15px; cursor: pointer; color: #fff;
  letter-spacing: -0.01em; transition: transform 0.2s ease;
}
.dir-btn:hover { transform: translateY(-1px); }
.dir-btn:active { transform: translateY(1px); }
.dir-btn small { display: block; font-weight: 500; font-size: 10.5px; opacity: 0.85; margin-top: 2px; }
.dir-btn.buy { background: linear-gradient(160deg, #34d399, #059669); box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3); }
.dir-btn.sell { background: linear-gradient(160deg, #f87171, #dc2626); box-shadow: 0 10px 20px rgba(220, 38, 38, 0.26); }

.pos-card { background: var(--surface); box-shadow: var(--neu-in-sm); border-radius: 16px; padding: 16px 18px; }
.pos-head { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; font-weight: 700; margin-bottom: 8px; }
.pos-pnl { font-size: 27px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.pos-sub { font-size: 11.5px; color: var(--text-faint); margin-top: 3px; font-variant-numeric: tabular-nums; }
.pos-act { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }

.hist-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hist-pill {
  padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700;
  box-shadow: var(--neu-out-sm); background: var(--card); font-variant-numeric: tabular-nums;
}
.hist-label { font-size: 10.5px; color: var(--text-faint); margin-right: 4px; }

/* Ideas */

.wire {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 18px; border-radius: 14px;
  background: var(--card); box-shadow: var(--neu-out-sm);
  margin-bottom: 18px; font-size: 12.5px; color: var(--text-soft);
}
.wire .mono { font-size: 10.5px; color: var(--text-faint); margin-left: auto; }

.idea-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.idea-card {
  background: var(--card); border-radius: 18px; box-shadow: var(--neu-out-sm);
  padding: 18px; display: flex; flex-direction: column; gap: 12px;
  animation: viewfade 0.4s ease;
}
.idea-top { display: flex; align-items: center; gap: 9px; }
.idea-cat {
  font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent-a); background: rgba(124, 58, 237, 0.09);
  padding: 4px 9px; border-radius: 999px;
}
.idea-age { font-size: 11px; color: var(--text-faint); margin-left: auto; font-variant-numeric: tabular-nums; }
.idea-head { font-size: 14.5px; font-weight: 600; line-height: 1.45; flex: 1; }
.idea-meta { display: flex; align-items: center; gap: 9px; font-size: 11.5px; color: var(--text-faint); }
.idea-meta .asset-ic { width: 24px; height: 24px; border-radius: 8px; font-size: 10px; }
.conf-wrap { flex: 1; }
.conf-bar { height: 5px; border-radius: 3px; background: var(--surface); box-shadow: var(--neu-in-sm); overflow: hidden; }
.conf-bar span { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent-a), var(--accent-b)); }
.idea-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.idea-actions .dir-btn { padding: 10px; font-size: 13px; border-radius: 12px; }

/* Social / inbox */

.split { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
.thread-list { background: var(--card); border-radius: 20px; box-shadow: var(--neu-out-sm); padding: 10px; }
.thread {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 12px; border: none; border-radius: 14px; background: transparent;
  cursor: pointer; text-align: left; color: var(--text); transition: all 0.2s ease;
}
.thread:hover { background: var(--surface); }
.thread.on { background: var(--surface); box-shadow: var(--neu-in-sm); }
.thread-av {
  width: 40px; height: 40px; border-radius: 50%; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center; font-size: 19px;
}
.thread-tx { display: block; min-width: 0; flex: 1; }
.thread-name { display: block; font-size: 13.5px; font-weight: 700; }
.thread-last { display: block; font-size: 12px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.thread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-b); flex: 0 0 auto; }

.chat-panel { background: var(--card); border-radius: 20px; box-shadow: var(--neu-out-sm); padding: 20px; display: flex; flex-direction: column; height: 560px; }
.chat-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 4px 14px; }
.bubble {
  max-width: 72%; padding: 10px 15px; border-radius: 16px;
  font-size: 13.5px; line-height: 1.5; animation: viewfade 0.3s ease;
}
.bubble.me { align-self: flex-end; background: linear-gradient(160deg, #24262c, #0c0d10); color: #fff; border-bottom-right-radius: 5px; }
.bubble.them { align-self: flex-start; background: var(--surface); box-shadow: var(--neu-in-sm); border-bottom-left-radius: 5px; }
.chat-inrow { display: flex; gap: 10px; margin-top: 12px; }
.chat-inrow .neu-input { flex: 1; width: auto; }

.contact-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.contact-card {
  background: var(--card); border-radius: 18px; box-shadow: var(--neu-out-sm);
  padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 9px; text-align: center;
}
.contact-av { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 25px; }
.contact-name { font-size: 14px; font-weight: 700; }
.contact-sub { font-size: 11px; color: var(--text-faint); }

.invite-card {
  background: var(--card); border-radius: 18px; box-shadow: var(--neu-out-sm);
  padding: 18px 20px; display: flex; align-items: center; gap: 14px; margin-bottom: 14px;
}
.invite-tx { flex: 1; min-width: 0; }
.invite-t { font-size: 14px; font-weight: 600; }
.invite-s { font-size: 12px; color: var(--text-faint); margin-top: 3px; }
.invite-act { display: flex; gap: 9px; }

/* Assistant */

.asst { max-width: 780px; margin: 0 auto; padding-top: 26px; }
/* Performance */

.stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 22px; }
.sg-cell { background: var(--card); border-radius: 14px; box-shadow: var(--neu-out-sm); padding: 14px 16px; }
.sg-l { font-size: 10.5px; color: var(--text-faint); margin-bottom: 5px; }
.sg-v { font-size: 15.5px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

/* Textured progress-metric card — dot-grid depth, right-region chart */

.pmc2 {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 360px;
  border-radius: 26px;
  background: var(--card);
  box-shadow: var(--neu-out-sm);
  overflow: hidden;
}
.pmc2-region { position: absolute; top: 0; right: 0; bottom: 52px; width: 62%; z-index: 0; }
.pmc2-wash { position: absolute; inset: 0; }
.pmc2-dots {
  position: absolute; inset: 0;
  color: var(--text);
  opacity: 0.11;
  -webkit-mask-image: linear-gradient(to right, transparent, black 55%);
  mask-image: linear-gradient(to right, transparent, black 55%);
}
.pmc2-dots svg { width: 100%; height: 100%; display: block; }
.pmc2-chart { position: absolute; inset: 0; cursor: crosshair; touch-action: none; }
.pmc2-chart svg { width: 100%; height: 100%; display: block; }
.pmc2-main { position: relative; z-index: 2; flex: 1; padding: 26px 30px 18px; pointer-events: none; }
.pmc2-head { display: flex; align-items: center; gap: 12px; }
.pmc2-title { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.pmc2-chip {
  font-size: 9px; letter-spacing: 0.1em; color: var(--text-faint);
  background: var(--surface); box-shadow: var(--neu-in-sm);
  padding: 5px 11px; border-radius: 999px;
}
.pmc2-headline {
  display: flex; align-items: baseline; gap: 12px;
  margin-top: 20px;
  font-size: clamp(40px, 4vw, 60px);
  font-weight: 600; letter-spacing: -0.03em; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.pmc2-trendchip { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700; letter-spacing: 0; }
.pmc2-date { font-size: 10px; color: var(--text-faint); margin-top: 9px; }
.pmc2-foot {
  position: relative; z-index: 2;
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  border-top: 1px solid var(--line);
  background: var(--card);
  padding: 13px 30px;
  font-size: 12.5px;
  flex-wrap: wrap;
}
.pmc2-stats { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
.pmc2-stats b { color: var(--text-soft); font-weight: 600; }
.pmc2-stats .sep { opacity: 0.4; }

/* Gamified stats scorecard with glow */

.tp-grid { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 22px; align-items: stretch; }
@media (max-width: 1100px) { .tp-grid { grid-template-columns: 1fr; } }

.glow-wrap { position: relative; border-radius: 28px; }
.glow-wrap::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 30px;
  background: linear-gradient(135deg, rgba(124, 58, 237, 0.45), rgba(217, 70, 239, 0.2) 45%, rgba(245, 158, 11, 0.35));
  filter: blur(16px);
  opacity: 0.3;
  animation: glowShift 6s ease-in-out infinite alternate;
}
@keyframes glowShift {
  from { opacity: 0.2; transform: scale(0.995); }
  to { opacity: 0.45; transform: scale(1.004); }
}

.score-card {
  position: relative;
  height: 100%;
  border-radius: 26px;
  background: var(--card);
  box-shadow: var(--neu-out-sm);
  padding: 24px 26px 20px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  overflow: hidden;
}
.sc-head { display: flex; align-items: center; justify-content: space-between; }
.sc-title { font-size: 15px; font-weight: 700; }
.sc-earn-label { font-size: 9.5px; letter-spacing: 0.12em; color: var(--text-faint); margin-bottom: 6px; }
.sc-earn { font-size: 33px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.sc-change { font-size: 12px; font-weight: 600; color: var(--green); margin-top: 7px; }
.sc-change span { color: var(--text-faint); font-weight: 500; }
.sc-sub { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sc-sub-cell { background: var(--surface); box-shadow: var(--neu-in-sm); border-radius: 14px; padding: 12px 15px; }
.sc-sub-v { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.sc-sub-v span { font-size: 12px; font-weight: 500; color: var(--text-faint); letter-spacing: 0; }
.sc-sub-s { font-size: 10px; color: var(--text-faint); margin-top: 4px; }
.sc-rank {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 14px 18px;
  border-radius: 16px;
  background: linear-gradient(150deg, rgba(245, 158, 11, 0.09), rgba(217, 70, 239, 0.05));
  border: 1px solid rgba(245, 158, 11, 0.18);
}
.sc-rank svg { color: #b45309; opacity: 0.25; flex: 0 0 auto; }
.sc-rank-place { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
.sc-rank-cat { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); margin-top: 3px; }
.sc-rank { margin-top: auto; }

/* Shareable winnings card — chart + stats living in one clean card */

.share-card { position: relative; border-radius: 26px; background: var(--card); box-shadow: var(--neu-out-sm); overflow: hidden; display: flex; flex-direction: column; }
.share-card .pmc2 { box-shadow: none; border-radius: 0; background: transparent; min-height: 330px; }
.share-card .pmc2-foot { background: transparent; }
.shc-band { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 18px 26px; align-items: center; padding: 18px 26px 2px; }
@media (max-width: 640px) { .shc-band { grid-template-columns: 1fr; } }
.shc-foot { display: flex; align-items: stretch; gap: 12px; padding: 16px 26px 22px; }
.shc-club { display: flex; align-items: center; gap: 16px; padding: 14px 26px 0; }
.shc-club .award-badge { width: 250px; flex: none; }
.shc-club-tx { font-size: 8px; letter-spacing: 0.1em; color: var(--text-faint); }
.shc-foot .sc-rank { margin-top: 0; flex: 1; }
.shc-ins { padding: 0 18px; font-size: 12.5px; font-weight: 700; border-radius: 16px; white-space: nowrap; }
.shc-ins .ins-chev { font-size: 10px; opacity: 0.6; margin-left: 4px; }
.shc-ins.on { color: #7c3aed; }

/* Post composer — write your own thoughts from your profile */

.composer { display: flex; gap: 14px; background: var(--card); border-radius: 20px; box-shadow: var(--neu-out-sm); padding: 18px 20px; margin-bottom: 16px; }
.composer .thread-av { flex: 0 0 auto; }
.thread-av img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
.composer-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.composer-main textarea { width: 100%; border: none; outline: none; resize: none; background: var(--surface); box-shadow: var(--neu-in-sm); border-radius: 14px; padding: 12px 14px; font: inherit; font-size: 13.5px; color: var(--text); min-height: 58px; }
.composer-main textarea::placeholder { color: var(--text-faint); }
.composer-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.composer-hint { font-size: 9px; letter-spacing: 0.1em; color: var(--text-faint); }

/* Slide-to-unlock reward (comp win) */

.reward-veil {
  position: fixed; inset: 0; z-index: 120;
  background: rgba(15, 16, 20, 0.45);
  backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  animation: viewfade 0.3s ease;
  zoom: 1.176;
}
.reward-card {
  width: 340px; max-width: calc(100vw - 40px);
  background: var(--card);
  border-radius: 26px;
  box-shadow: var(--neu-out), 0 30px 70px rgba(0, 0, 0, 0.35);
  padding: 30px 26px 26px;
  text-align: center;
  animation: rewardPop 0.45s cubic-bezier(0.22, 1.4, 0.36, 1);
}
@keyframes rewardPop { from { transform: scale(0.7) translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.reward-gift {
  position: relative; z-index: 0;
  width: 88px; height: 88px; margin: 0 auto 16px;
  border-radius: 50%;
  background: var(--surface); box-shadow: var(--neu-in-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 40px;
}
.reward-gift::before { content: ''; position: absolute; inset: -5px; border-radius: 50%; background: var(--brandGrad); opacity: 0.35; filter: blur(12px); z-index: -1; }
.rg-emoji { font-size: 46px; line-height: 1; filter: drop-shadow(0 8px 14px rgba(150, 110, 30, 0.35)); animation: rewardPop 0.6s cubic-bezier(0.22, 1.4, 0.36, 1); }
.reward-title { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.reward-sub { font-size: 13px; color: var(--text-soft); line-height: 1.55; margin-top: 8px; }
.slide-track {
  position: relative; height: 54px; margin-top: 22px;
  border-radius: 999px;
  background: var(--surface); box-shadow: var(--neu-in-sm);
  overflow: hidden;
  touch-action: none;
}
.slide-handle {
  position: absolute; left: 3px; top: 3px; z-index: 2;
  width: 48px; height: 48px; border-radius: 50%;
  background: linear-gradient(160deg, #24262c, #0c0d10);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: grab;
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
  transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
}
.slide-handle.dragging { transition: none; cursor: grabbing; }
.slide-handle svg { width: 20px; height: 20px; }
.slide-label {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
  background: linear-gradient(110deg, #9ca3af 40%, #f4f4f6 50%, #9ca3af 60%);
  background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmerText 2.2s linear infinite;
  transition: opacity 0.2s ease;
  pointer-events: none;
}
@keyframes shimmerText { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.claim-strip {
  display: flex; align-items: center; justify-content: space-between;
  height: 54px; margin-top: 22px;
  border-radius: 999px;
  background: linear-gradient(135deg, #10b981, #059669);
  color: #fff; padding: 4px 4px 4px 20px;
  cursor: pointer;
  box-shadow: 0 12px 26px rgba(16, 185, 129, 0.4);
  animation: rewardPop 0.5s cubic-bezier(0.22, 1.4, 0.36, 1);
  text-align: left;
}
.claim-amt { font-size: 15px; font-weight: 800; }
.claim-sub { font-size: 10.5px; opacity: 0.85; }
.claim-ic {
  width: 44px; height: 44px; border-radius: 50%;
  background: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 21px;
}
.reward-skip { margin-top: 14px; background: none; border: none; color: var(--text-faint); font-size: 11.5px; cursor: pointer; font-family: inherit; }
#confettiCanvas { position: fixed; inset: 0; z-index: 130; pointer-events: none; }

/* Holographic award badge (£1M+ club) */

.award-badge { display: inline-block; width: 260px; max-width: 100%; cursor: pointer; }
.award-tilt { transition: transform 0.2s ease-out; transform: perspective(700px); will-change: transform; }
.award-badge svg { width: 100%; height: auto; display: block; border-radius: 10px; box-shadow: 0 10px 26px rgba(120, 110, 90, 0.26); }
.award-badge.locked { filter: grayscale(0.85); opacity: 0.42; cursor: default; }
.award-badge.locked .award-tilt { transform: none !important; }
.tp-club { margin-top: 14px; }
.tp-club .award-badge { width: 100%; max-width: 300px; }
.club-card { background: var(--card); border-radius: 20px; box-shadow: var(--neu-out-sm); padding: 18px 20px; align-self: start; }
.club-sub { font-size: 11px; color: var(--text-faint); margin: 0 0 14px; }
.club-prog { margin-bottom: 16px; }
.club-prog-t { display: flex; justify-content: space-between; font-size: 9px; letter-spacing: 0.08em; color: var(--text-faint); margin-bottom: 7px; }
.club-bar { height: 7px; border-radius: 999px; background: var(--surface); box-shadow: var(--neu-in-sm); overflow: hidden; }
.club-bar span { display: block; height: 100%; background: var(--brandGrad); border-radius: 999px; }
.club-ladder { display: flex; flex-direction: column; gap: 12px; }
.club-ladder .award-badge { width: 100%; }
.club-row { display: flex; flex-direction: column; gap: 5px; }
.club-meta { display: flex; justify-content: space-between; font-size: 9px; letter-spacing: 0.08em; color: var(--text-faint); padding: 0 3px; }
.club-st.in { color: var(--lbA); font-weight: 700; }
.holo { transform-origin: center center; will-change: transform; }
.hg1 { animation: holo1 5s infinite; }
.hg2 { animation: holo2 5s infinite; }
.hg3 { animation: holo3 5s infinite; }
.hg4 { animation: holo4 5s infinite; }
.hg5 { animation: holo5 5s infinite; }
.hg6 { animation: holo6 5s infinite; }
@keyframes holo1 { 0% { transform: rotate(0deg); } 50% { transform: rotate(10deg); } 100% { transform: rotate(0deg); } }
@keyframes holo2 { 0% { transform: rotate(10deg); } 50% { transform: rotate(20deg); } 100% { transform: rotate(10deg); } }
@keyframes holo3 { 0% { transform: rotate(20deg); } 50% { transform: rotate(30deg); } 100% { transform: rotate(20deg); } }
@keyframes holo4 { 0% { transform: rotate(30deg); } 50% { transform: rotate(40deg); } 100% { transform: rotate(30deg); } }
@keyframes holo5 { 0% { transform: rotate(40deg); } 50% { transform: rotate(50deg); } 100% { transform: rotate(40deg); } }
@keyframes holo6 { 0% { transform: rotate(90deg); } 50% { transform: rotate(100deg); } 100% { transform: rotate(90deg); } }

/* Badge wall (spec card) */

.badge-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .badge-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.bdg {
  background: var(--card);
  box-shadow: var(--neu-out-sm);
  border-radius: 16px;
  padding: 15px 12px 13px;
  text-align: center;
  border: 1px solid transparent;
}
.bdg.earned { border-color: rgba(245, 158, 11, 0.22); background: linear-gradient(160deg, rgba(245, 158, 11, 0.07), var(--card) 55%); }
.bdg.locked { opacity: 0.45; filter: grayscale(1); }
.bdg-emoji { font-size: 26px; line-height: 1; }
.bdg-name { font-size: 12px; font-weight: 700; margin-top: 8px; }
.bdg-req { font-size: 9.5px; color: var(--text-faint); margin-top: 3px; line-height: 1.4; }

/* X-style profile page */

.tpc { background: var(--card); border-radius: 24px; box-shadow: var(--neu-out-sm); overflow: hidden; display: flex; flex-direction: column; }
.tpc-cover {
  position: relative;
  height: 104px;
  background:
    radial-gradient(75% 160% at 85% 0%, rgba(217, 70, 239, 0.26), transparent 55%),
    radial-gradient(70% 150% at 12% 20%, rgba(124, 58, 237, 0.20), transparent 60%),
    radial-gradient(55% 130% at 55% 100%, rgba(56, 189, 248, 0.16), transparent 65%),
    linear-gradient(120deg, #ede9fe, #fdf4ff 55%, #e0f2fe);
}
.tpc-cover::before {
  content: '';
  position: absolute; inset: 0;
  background-image: radial-gradient(rgba(124, 58, 237, 0.16) 1px, transparent 1px);
  background-size: 13px 13px;
  -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, .65), transparent 85%);
  mask-image: linear-gradient(180deg, rgba(0, 0, 0, .65), transparent 85%);
}
body.dark .tpc-cover {
  background:
    radial-gradient(75% 160% at 85% 0%, rgba(217, 70, 239, 0.30), transparent 55%),
    radial-gradient(70% 150% at 12% 20%, rgba(139, 92, 246, 0.26), transparent 60%),
    radial-gradient(55% 130% at 55% 100%, rgba(56, 189, 248, 0.18), transparent 65%),
    linear-gradient(120deg, #2a2352, #3a2360 55%, #1c3355);
}
body.dark .tpc-cover::before { background-image: radial-gradient(rgba(196, 181, 253, 0.18) 1px, transparent 1px); }
.view[data-view="trader"] .xfeed { max-width: 900px; margin: 0; }
.tpc-cover .past-chip { top: 12px; }
.tpc-body { padding: 0 24px 20px; display: flex; flex-direction: column; flex: 1; }
.tpc-avrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.tpc-avatar {
  width: 76px; height: 76px; border-radius: 50%;
  border: 4px solid var(--card);
  margin-top: -38px;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px;
  box-shadow: var(--neu-out-sm);
}
.tpc-actions { display: flex; gap: 9px; padding-top: 12px; }
.tpc-name { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: center; gap: 6px; margin-top: 10px; }
.tpc-handle { font-size: 12.5px; color: var(--text-faint); }
.tpc-bio { font-size: 13.5px; color: var(--text-soft); margin-top: 8px; }
.tpc-meta { font-size: 11.5px; color: var(--text-faint); margin-top: 5px; }
.tpc-follows { display: flex; gap: 16px; font-size: 12.5px; color: var(--text-faint); margin-top: 8px; }
.tpc-follows b { color: var(--text); }

.tp-level {
  display: flex; align-items: center; gap: 13px;
  margin-top: 16px; padding: 13px 15px;
  border-radius: 15px;
  background: var(--surface); box-shadow: var(--neu-in-sm);
}
.tp-level-ic {
  width: 40px; height: 40px; border-radius: 12px; flex: 0 0 auto;
  background: linear-gradient(145deg, #38bdf8, #2563eb);
  color: #fff; display: flex; align-items: center; justify-content: center; font-size: 17px;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.3);
}
.tp-level-tx { flex: 1; min-width: 0; }
.tp-level-name { display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 700; }
.tp-level-lv { font-size: 10px; font-weight: 700; color: var(--text-faint); background: var(--card); padding: 3px 9px; border-radius: 999px; }
.tp-level-bar { height: 8px; border-radius: 4px; background: var(--card); overflow: hidden; margin: 8px 0 6px; }
.tp-level-bar span { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #38bdf8, #2563eb); }
.tp-level-sub { font-size: 10.5px; color: var(--text-faint); }

.tp-strip { display: flex; gap: 30px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.tp-level-tx > span { display: block; }
.tp-level-name { display: flex !important; }
.tp-ss b { display: block; font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.tp-ss span { font-size: 10.5px; color: var(--text-faint); }

.bk-card { background: var(--card); border-radius: 20px; box-shadow: var(--neu-out-sm); padding: 18px 22px; }
.bk-title { font-size: 13.5px; font-weight: 700; margin-bottom: 13px; }
.bk-bar { display: flex; height: 9px; border-radius: 5px; overflow: hidden; margin-bottom: 6px; }
.bk-bar i { display: block; height: 100%; }
.bk-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.bk-row:last-child { border-bottom: none; padding-bottom: 2px; }
.bk-ic { width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex: 0 0 auto; }
.bk-tx { flex: 1; min-width: 0; }
.bk-t { display: block; font-size: 13px; font-weight: 700; }
.bk-s { display: block; font-size: 10.5px; color: var(--text-faint); margin-top: 1px; }
.bk-v { font-weight: 800; font-variant-numeric: tabular-nums; }

.media-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.media-tile {
  height: 118px; border-radius: 16px; padding: 13px 15px;
  color: #fff; display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: var(--neu-out-sm);
}
.media-ret { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; text-shadow: 0 1px 6px rgba(0,0,0,.25); }
.media-cap { font-size: 11px; font-weight: 600; opacity: 0.9; }

/* Trader profile header */

.tp-head {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  background: var(--card); border-radius: 22px; box-shadow: var(--neu-out-sm);
  padding: 22px 26px; margin-bottom: 22px;
}
.tp-av {
  width: 64px; height: 64px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 30px;
  box-shadow: var(--neu-out-sm);
}
.tp-name { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: center; gap: 7px; }
.tp-sub { font-size: 12px; color: var(--text-faint); margin-top: 3px; }
.tp-follows { display: flex; gap: 14px; font-size: 12px; color: var(--text-faint); margin-top: 6px; }
.tp-follows b { color: var(--text); }

/* Progress metric card (scrubbable) */

.pmc {
  background: var(--card);
  border-radius: 22px;
  box-shadow: var(--neu-out-sm);
  padding: 24px 26px 14px;
}
.pmc-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pmc-title { font-size: 13.5px; font-weight: 700; color: var(--text-soft); }
.pmc-unit {
  font-family: 'SF Mono', ui-monospace, Menlo, monospace;
  font-size: 9.5px; letter-spacing: 0.1em; color: var(--text-faint);
  background: var(--surface); box-shadow: var(--neu-in-sm);
  padding: 5px 11px; border-radius: 999px;
}
.pmc-val { font-size: clamp(28px, 2.8vw, 38px); font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: 10px; line-height: 1.1; }
.pmc-delta { font-size: 12.5px; font-weight: 700; margin-left: 10px; font-variant-numeric: tabular-nums; }
.pmc-date { font-size: 10px; color: var(--text-faint); margin-top: 4px; }
.pmc-wrap { position: relative; margin-top: 12px; cursor: crosshair; touch-action: none; }
.pmc-wrap svg { width: 100%; height: 235px; display: block; }

.perf-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.perf-name { font-size: 19px; font-weight: 700; }
.perf-hash { font-size: 10.5px; color: var(--text-faint); }

.trades-table { width: 100%; border-collapse: collapse; }
.trades-table th { text-align: left; padding: 13px 12px 11px; font-size: 10.5px; color: var(--text-faint); font-weight: 500; border-bottom: 1px solid var(--line); }
.trades-table td { padding: 12px; font-size: 13.5px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.trades-table tr:last-child td { border-bottom: none; }

/* Leaderboard page */

.lb-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.lb-table-card { background: var(--card); border-radius: 22px; box-shadow: var(--neu-out-sm); padding: 8px 26px; margin-bottom: 18px; }
.lb-mini { height: 150px; border-radius: 14px; background: var(--surface); box-shadow: var(--neu-in-sm); overflow: hidden; color: var(--text); cursor: crosshair; }
.lb-mini svg { display: block; width: 100%; height: 100%; }
.lb-foot { display: flex; align-items: center; justify-content: space-between; }
.lb-page { font-size: 12px; color: var(--text-faint); }
tr.lb-me td { background: var(--surface); }
tr.lb-me td:first-child { border-radius: 12px 0 0 12px; }
tr.lb-me td:last-child { border-radius: 0 12px 12px 0; }

/* Arena */

.vs-pair { display: flex; }
.vs-pair .thread-av { width: 30px; height: 30px; font-size: 14px; border: 2.5px solid var(--surface-raised); }
.vs-pair .thread-av + .thread-av { margin-left: -8px; }
.watching { font-size: 10.5px; color: var(--text-faint); display: block; margin-top: 2px; }

.challenge-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.challenge-card {
  background: var(--card); border-radius: 18px; box-shadow: var(--neu-out-sm);
  padding: 18px; display: flex; flex-direction: column; gap: 12px;
}
.challenge-head { display: flex; align-items: center; gap: 11px; }
.challenge-name { font-size: 14px; font-weight: 700; }
.challenge-sub { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
.challenge-terms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ch-profit { color: var(--green); font-weight: 800; }
.term-cell { flex: 1; background: var(--surface); box-shadow: var(--neu-in-sm); border-radius: 12px; padding: 10px 12px; }
.term-cell .k { font-size: 9.5px; color: var(--text-faint); letter-spacing: 0.1em; text-transform: uppercase; }
.term-cell .v { font-size: 14px; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }

/* Collapsed sidebar */

body.side-collapsed .sidebar { width: 88px; flex-basis: 88px; padding: 28px 14px 24px; }
body.side-collapsed .brand-name,
body.side-collapsed .nav-label,
body.side-collapsed .user-meta { display: none; }
body.side-collapsed .nav-item { justify-content: center; padding: 10px 6px; }
body.side-collapsed .sidebar-top { justify-content: center; }
body.side-collapsed .brand { display: none; }

/* Notifications panel */

.topbar-right { position: relative; }
.notif-panel {
  position: absolute;
  top: 54px; right: 0;
  width: 340px;
  background: var(--card);
  border-radius: 20px;
  box-shadow: var(--neu-out), 0 24px 50px rgba(0, 0, 0, 0.12);
  border: 1px solid var(--line);
  padding: 8px;
  z-index: 60;
  display: none;
  animation: viewfade 0.25s ease;
}
.notif-panel.show { display: block; }
.np-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 8px; font-size: 13.5px; font-weight: 700; }
.np-row { display: flex; gap: 11px; padding: 11px 12px; border-radius: 13px; align-items: flex-start; }
.np-row:hover { background: var(--surface); }
.np-row.unread { background: var(--surface); box-shadow: var(--neu-in-sm); margin-bottom: 4px; }
.np-ic {
  width: 30px; height: 30px; border-radius: 10px; flex: 0 0 auto;
  background: linear-gradient(135deg, #f9a8d4, #a855f7); color: #fff;
  display: inline-flex; align-items: center; justify-content: center; font-size: 14px;
}
.np-t { font-size: 12.5px; font-weight: 700; }
.np-s { font-size: 11.5px; color: var(--text-faint); margin-top: 2px; line-height: 1.45; }
.np-ago { margin-left: auto; font-size: 9.5px; color: var(--text-faint); white-space: nowrap; }
.np-empty { padding: 26px; text-align: center; color: var(--text-faint); font-size: 12.5px; }

/* Trade outcome stamps */

.obadge {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'SF Mono', ui-monospace, Menlo, monospace;
  font-size: 9px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
  padding: 4px 9px; border-radius: 999px;
}
.obadge.target { color: #10b981; background: rgba(16, 185, 129, 0.11); }
.obadge.stopped { color: #e5484d; background: rgba(229, 72, 77, 0.1); }
.obadge.manual { color: #2f6bff; background: rgba(47, 107, 255, 0.1); }
.obadge.breakeven { color: var(--text-faint); background: var(--surface); box-shadow: var(--neu-in-sm); }
.tsrc { display: block; font-size: 9.5px; color: var(--text-faint); margin-top: 3px; }

/* Arena battle builder + live battles */

.builder {
  background: var(--card);
  border-radius: 22px;
  box-shadow: var(--neu-out-sm);
  padding: 24px 26px;
  margin-bottom: 34px;
  animation: viewfade 0.35s ease;
}
.b-row { margin-bottom: 16px; }
.b-label {
  font-family: 'SF Mono', ui-monospace, Menlo, monospace;
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-faint); margin-bottom: 9px;
  display: flex; align-items: center; gap: 7px;
}
.b-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.b-payoff {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  align-items: stretch;
  margin: 20px 0 10px;
  max-width: 640px;
}
.bp-card {
  border-radius: 14px;
  padding: 11px 15px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.bp-card.win {
  background: linear-gradient(150deg, rgba(16, 185, 129, 0.03), rgba(16, 185, 129, 0.14));
  border: 1px solid rgba(16, 185, 129, 0.2);
  box-shadow: 0 10px 24px rgba(16, 185, 129, 0.12);
  text-align: right;
  align-items: flex-end;
}
.bp-card.lose {
  background: linear-gradient(150deg, rgba(229, 72, 77, 0.11), rgba(229, 72, 77, 0.02));
  border: 1px solid rgba(229, 72, 77, 0.16);
}
.bp-k { font-size: 8.5px; color: var(--text-soft); }
.bp-v { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.bp-s { font-size: 9.5px; color: var(--text-faint); }
.bp-mid {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: var(--surface); box-shadow: var(--neu-in-sm);
  border-radius: 14px; padding: 10px 16px;
}
.bp-potv { font-size: 14.5px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.bp-rake { font-size: 7.5px; color: var(--text-faint); }
.bp-note { font-size: 11px; color: var(--text-faint); margin-bottom: 14px; }
.bp-note b { color: var(--text-soft); }

@media (max-width: 900px) {
  .b-payoff { grid-template-columns: 1fr; }
  .bp-card.lose { text-align: left; align-items: flex-start; }
}
.b-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.mine-tag {
  font-size: 9px; font-weight: 800; letter-spacing: 0.1em;
  color: var(--accent-a); background: rgba(124, 58, 237, 0.1);
  padding: 3px 8px; border-radius: 999px;
}
.blive {
  background: var(--card); border-radius: 20px; box-shadow: var(--neu-out-sm);
  padding: 18px 20px; margin-bottom: 14px;
}
.blive .fd-bt-row { margin-bottom: 10px; }
.blive-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-faint); }
.rating-chip {
  display: inline-flex; align-items: center; gap: 8px;
  background: linear-gradient(135deg, #fde68a, #f59e0b);
  color: #713f12; font-weight: 800; font-size: 12px;
  padding: 6px 14px; border-radius: 999px;
  box-shadow: 0 6px 14px rgba(245, 158, 11, 0.3);
}

/* Partner */

.ref-row { display: flex; gap: 12px; align-items: stretch; margin-bottom: 26px; flex-wrap: wrap; }
.ref-box {
  flex: 1; min-width: 260px; display: flex; align-items: center; gap: 12px;
  background: var(--surface); box-shadow: var(--neu-in-sm);
  border-radius: 14px; padding: 6px 8px 6px 18px;
}
.ref-url { flex: 1; font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.two-col { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(300px, 1fr); gap: 22px; align-items: start; margin-bottom: 26px; }
.panel-card { background: var(--card); border-radius: 20px; box-shadow: var(--neu-out-sm); padding: 22px; }
.panel-title { font-size: 14px; font-weight: 700; margin-bottom: 14px; }
canvas.chart-sm { width: 100%; height: 220px; display: block; }

.tier-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-faint); margin-bottom: 8px; }
.tier-bar { height: 10px; border-radius: 5px; background: var(--surface); box-shadow: var(--neu-in-sm); overflow: hidden; }
.tier-bar span { display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--accent-a), var(--accent-b)); }

/* Social feed (X-style) */

.xfeed {
  max-width: 680px; margin: 0 auto;
  background: var(--card); border-radius: 22px;
  box-shadow: var(--neu-out-sm); overflow: hidden;
}
.xtabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); }
.xtab {
  position: relative; border: none; background: none; cursor: pointer;
  padding: 16px 0 14px; font-family: inherit;
  font-size: 14px; font-weight: 600; color: var(--text-faint);
  transition: color 0.2s ease;
}
.xtab:hover { background: var(--surface); }
.xtab.on { color: var(--text); }
.xtab.on::after {
  content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 58px; height: 4px; border-radius: 2px;
  background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
}

.xcomposer { display: flex; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.xcomposer-body { flex: 1; min-width: 0; }
.xcomposer textarea {
  width: 100%; min-height: 46px; resize: none; border: none;
  background: transparent; color: var(--text);
  font-family: inherit; font-size: 17px; line-height: 1.45; padding: 9px 0 4px;
}
.xcomposer textarea:focus { outline: none; }
.xcomposer textarea::placeholder { color: var(--text-faint); }
.xcomposer-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
.xicons { display: flex; gap: 2px; margin-left: -8px; }
.xicon {
  width: 34px; height: 34px; border: none; background: none; border-radius: 10px;
  color: var(--accent-a); display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background 0.2s ease;
}
.xicon svg { width: 17px; height: 17px; }
.xicon:hover { background: var(--surface); }

.xshow {
  display: block; width: 100%; border: none; background: none;
  padding: 14px; cursor: pointer; font-family: inherit;
  font-size: 13.5px; font-weight: 600; color: var(--accent-a);
  border-bottom: 1px solid var(--line); transition: background 0.2s ease;
}
.xshow:hover { background: var(--surface); }

.xempty { padding: 44px 30px; text-align: center; color: var(--text-faint); font-size: 13.5px; line-height: 1.6; }
.post-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 24px; border: none; border-radius: 12px;
  background: linear-gradient(160deg, #24262c, #0c0d10); color: #fff;
  font-size: 13.5px; font-weight: 600; cursor: pointer;
  box-shadow: 5px 6px 14px var(--shadow-dark), -4px -4px 10px var(--shadow-light),
    inset 0 1px 0 rgba(255, 255, 255, 0.12);
  transition: all 0.25s ease;
}
.post-btn:hover { transform: translateY(-1px); }
.post-btn:active { transform: translateY(1px); }

.post { display: flex; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); animation: viewfade 0.35s ease; }
.post:last-child { border-bottom: none; }
.post-body { flex: 1; min-width: 0; }
.post-head { display: flex; align-items: center; gap: 5px; min-width: 0; }
.post-name { font-size: 14px; font-weight: 700; white-space: nowrap; }
.post-badge { width: 15px; height: 15px; color: #2f6bff; flex: 0 0 auto; }
.post-handle { font-size: 12.5px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.post-time { font-size: 12.5px; color: var(--text-faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.post-time::before { content: '· '; }
.post-menu {
  margin-left: auto; border: none; background: none; cursor: pointer;
  width: 28px; height: 28px; border-radius: 9px; color: var(--text-faint);
  font-size: 15px; font-weight: 700; letter-spacing: 1px;
  display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
  transition: background 0.2s ease;
}
.post-menu:hover { background: var(--surface); color: var(--text); }
.post-text { font-size: 14px; line-height: 1.55; margin: 6px 0 10px; overflow-wrap: break-word; }
.post-tag {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 12px; border-radius: 999px; margin-bottom: 11px;
  background: var(--surface); box-shadow: var(--neu-in-sm);
  font-family: 'SF Mono', ui-monospace, Menlo, monospace;
  font-size: 11px; font-weight: 600; color: var(--text-soft);
  font-variant-numeric: tabular-nums;
}
.post-tag .asset-ic { width: 18px; height: 18px; border-radius: 6px; font-size: 8.5px; }
.post-actions { display: flex; align-items: center; margin-left: -10px; }
.post-actions .grow { display: flex; flex: 1; justify-content: space-between; max-width: 420px; }
.post-actions .side { display: flex; gap: 2px; margin-left: auto; }
.pact.bm.on { color: #2f6bff; }
.pact.bm.on svg { fill: currentColor; }
.pact {
  display: inline-flex; align-items: center; gap: 7px;
  border: none; background: none; cursor: pointer;
  font-size: 12px; font-weight: 600; color: var(--text-faint);
  font-family: inherit; font-variant-numeric: tabular-nums;
  padding: 6px 10px; border-radius: 10px; transition: all 0.2s ease;
}
.pact svg { width: 15px; height: 15px; }
.pact:hover { background: var(--surface); }
.pact.reply:hover { color: #2f6bff; }
.pact.rt:hover, .pact.rt.on { color: #10b981; }
.pact.like:hover, .pact.like.on { color: #db2777; }
.pact.views { margin-left: auto; cursor: default; }
.pact.views:hover { background: none; color: var(--text-faint); }

/* Tradr social feed — embeds + rail */

.fd-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) 320px; gap: 22px; align-items: start; }
.fd-composer { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.fd-composer .neu-input { flex: 1; width: auto; box-shadow: var(--neu-in-sm); }
.fd-embed {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 11px;
  font-size: 13px;
}
.fd-bt-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.fd-bt-f { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; min-width: 0; }
.fd-bt-f .thread-av { width: 28px; height: 28px; font-size: 13px; }
.fd-bt-av-ghost {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--card); box-shadow: var(--neu-in-sm);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--text-faint); font-weight: 700;
}
.fd-bt-vs { font-size: 10.5px; font-weight: 800; letter-spacing: 0.1em; color: var(--text-faint); }
.fd-bt-ret { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.fd-leadbar { height: 7px; border-radius: 4px; background: rgba(229, 72, 77, 0.25); overflow: hidden; margin-bottom: 12px; }
.fd-leadbar span { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #10b981, #34d399); }
.fd-bt-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.fd-bt-meta { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--text-faint); }
.fd-accept {
  border: none; cursor: pointer; font-family: inherit;
  padding: 9px 16px; border-radius: 11px;
  background: linear-gradient(160deg, #24262c, #0c0d10); color: #fff;
  font-size: 12px; font-weight: 600;
  box-shadow: 4px 5px 12px var(--shadow-dark), -3px -3px 8px var(--shadow-light);
  transition: transform 0.2s ease;
}
.fd-accept:hover { transform: translateY(-1px); }
.fd-won-tag {
  font-size: 9.5px; font-weight: 800; letter-spacing: 0.1em;
  color: #10b981; background: rgba(16, 185, 129, 0.12);
  padding: 3px 8px; border-radius: 999px;
}
.fd-rs-ret { color: var(--green); font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
.fd-dim { color: var(--text-faint); font-weight: 600; }
.fd-media { position: relative; border-radius: 16px; overflow: hidden; margin-bottom: 11px; background: #14161b; }
.fd-media svg { display: block; width: 100%; height: auto; }
.fd-media-ret {
  position: absolute; top: 12px; left: 14px;
  font-family: 'SF Mono', ui-monospace, Menlo, monospace;
  font-size: 13px; font-weight: 700;
}
.fd-media-play {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 46px; height: 46px; border-radius: 50%;
  background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
}
.fd-media-play svg { width: 18px; height: 18px; }
.fd-media-dur {
  position: absolute; bottom: 10px; left: 12px;
  font-size: 10.5px; color: #fff; background: rgba(0, 0, 0, 0.5);
  padding: 3px 8px; border-radius: 7px; font-variant-numeric: tabular-nums;
}
.fd-idea-top { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; flex-wrap: wrap; }
.fd-idea-sym {
  font-family: 'SF Mono', ui-monospace, Menlo, monospace;
  font-size: 11px; font-weight: 700; background: var(--card);
  box-shadow: var(--neu-out-sm); padding: 4px 10px; border-radius: 8px;
}
.fd-idea-tag { font-size: 9.5px; letter-spacing: 0.1em; color: var(--text-faint); text-transform: uppercase; }
.fd-idea-lean { margin-left: auto; font-size: 12px; font-weight: 700; font-family: 'SF Mono', ui-monospace, Menlo, monospace; }
.fd-idea-title { font-weight: 700; font-size: 14px; margin-bottom: 5px; }
.fd-idea-thesis { color: var(--text-soft); line-height: 1.55; font-size: 12.5px; margin-bottom: 11px; }

.fr-rail { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 20px; }
.fr-card { background: var(--card); border-radius: 20px; box-shadow: var(--neu-out-sm); padding: 18px 20px 10px; }
.fr-h { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 4px; }
.fr-search { display: flex; align-items: center; gap: 10px; }
.fr-search .neu-input { flex: 1; width: auto; }
.fr-trend { padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.fr-trend:hover .fr-tt { color: var(--accent-a); }
.fr-tcat { font-size: 10.5px; color: var(--text-faint); }
.fr-tt { font-size: 13.5px; font-weight: 700; margin: 2px 0; transition: color 0.2s ease; }
.fr-tn { font-size: 10.5px; color: var(--text-faint); }
.fr-wtf { display: flex; align-items: center; gap: 11px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.fr-wtf .thread-av { width: 38px; height: 38px; font-size: 18px; }
.fr-wm { flex: 1; min-width: 0; }
.fr-wn { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
.fr-wh { font-size: 10.5px; color: var(--text-faint); margin-top: 2px; }
.fr-follow {
  border: none; cursor: pointer; font-family: inherit;
  padding: 8px 16px; border-radius: 999px;
  background: linear-gradient(160deg, #24262c, #0c0d10); color: #fff;
  font-size: 11.5px; font-weight: 700;
  transition: all 0.2s ease;
}
.fr-follow.on { background: var(--surface); color: var(--text-soft); box-shadow: var(--neu-in-sm); }
.fr-showmore {
