    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://squaredq.com/#org",
          "name": "Squared³",
          "alternateName": "SquaredQ",
          "url": "https://squaredq.com/",
          "email": "info@squaredq.com",
          "description": "AI wealth management platform: subscribe to CPA-audited algorithmic trading strategies executed in your own brokerage account."
        },
        {
          "@type": "WebSite",
          "@id": "https://squaredq.com/#website",
          "url": "https://squaredq.com/",
          "name": "Squared³",
          "publisher": { "@id": "https://squaredq.com/#org" }
        },
        {
          "@type": "Product",
          "name": "Squared³ All Access",
          "description": "Lifetime access to every Squared³ algorithmic trading strategy, executed in your own Public.com, Alpaca, or Interactive Brokers account. US CPA-audited performance, no lock-ups.",
          "brand": { "@id": "https://squaredq.com/#org" },
          "offers": {
            "@type": "Offer",
            "price": "2497",
            "priceCurrency": "USD",
            "url": "https://squaredq.com/#pricing",
            "availability": "https://schema.org/InStock"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How does Squared³ actually work?",
              "acceptedAnswer": { "@type": "Answer", "text": "You subscribe once, connect the brokerage you already use — Public.com, Alpaca, or Interactive Brokers — and choose your strategies. Every trade executes directly in your own account and you can watch each position in real time." }
            },
            {
              "@type": "Question",
              "name": "Does Squared³ ever hold my money?",
              "acceptedAnswer": { "@type": "Answer", "text": "Never. Your capital stays in your own regulated US brokerage account at all times. Squared³ sends execution instructions to your account — we have no ability to withdraw, and you can disconnect with one click." }
            },
            {
              "@type": "Question",
              "name": "What does Squared³ cost?",
              "acceptedAnswer": { "@type": "Answer", "text": "One $2,497 onboarding fee for lifetime access to every strategy, then 0.50% of assets under management per month. No performance fees, no per-trade fees, every fee disclosed." }
            },
            {
              "@type": "Question",
              "name": "Are the returns real?",
              "acceptedAnswer": { "@type": "Answer", "text": "Every portfolio has run in a backtesting environment since January 2013, and live performance is audited by a US CPA. Each strategy factsheet carries an independent audit link." }
            },
            {
              "@type": "Question",
              "name": "What if I want out?",
              "acceptedAnswer": { "@type": "Answer", "text": "There are no lock-ups and no exit fees. Your money never left your brokerage, so leaving means disconnecting — your positions and cash are already yours." }
            }
          ]
        }
      ]
    }
